<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sauce's Short Order — live (Lua in your browser)</title>
<style>
  /* Neo-Tokyo Chrome instrument skin — tokens from the site design system */
  :root {
    --well:#050302; --gunmetal:#1C1613; --enamel:#A32226; --lip:#5C0F12;
    --enamel-hover:#BE2C31; --text:#E8E2D6; --text-bright:#F0EAE0;
    --text-dim:#7E756C; --crt-g:#7FA86A; --fault:#E5565B;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body { background:var(--well); color:var(--text);
         font:12px/1.4 ui-monospace,Consolas,monospace; }
  .bar { display:flex; gap:12px; align-items:center; padding:9px 12px;
         background:var(--gunmetal); flex-wrap:wrap;
         box-shadow:inset 0 1px 0 rgba(232,226,214,.09), inset 0 -1px 0 rgba(0,0,0,.7); }
  .bar b { color:var(--text-bright); font-size:11px; font-weight:400;
           letter-spacing:.14em; text-transform:uppercase; white-space:nowrap; }
  input[type=text]{ background:var(--well); border:0; color:var(--text);
    font:inherit; padding:6px 10px; flex:1; min-width:150px;
    box-shadow:inset 0 3px 8px rgba(0,0,0,.95), inset 0 0 0 1px rgba(232,226,214,.07); }
  input[type=text]:focus { outline:none;
    box-shadow:inset 0 3px 8px rgba(0,0,0,.95), inset 0 0 0 1px rgba(232,135,58,.35); }
  input[type=text]::placeholder { color:var(--text-dim); }
  button{ background:var(--enamel); border:0; border-bottom:3px solid var(--lip);
    color:#FBF3EE; font:inherit; font-size:10px; letter-spacing:.14em;
    text-transform:uppercase; padding:6px 14px 4px; cursor:pointer; }
  button:hover{ background:var(--enamel-hover); border-bottom-color:var(--fault); }
  button:active{ background:#8E1B1F; border-bottom-width:2px; padding-top:7px; }
  .stage{ display:grid; place-items:center; padding:12px; height:calc(100% - 48px);
    background:repeating-conic-gradient(#0D0907 0% 25%, #120E0C 0% 50%) 50% / 20px 20px; }
  canvas{ image-rendering:pixelated; box-shadow:0 6px 22px rgba(0,0,0,.55); cursor:pointer; outline:none; }
  .hint{ color:var(--text-dim); font-size:11px; }
  .hint .ok{ color:var(--crt-g); }
</style>
</head>
<body>
<div class="bar">
  <b>Sauce's Short Order</b>
  <input id="q" type="text" placeholder="type an order... arrows to move, Tab to browse" autocomplete="off">
  <button id="reset">reset</button>
  <span class="hint" id="hint">real pal_ui.lua, <span class="ok">running in your browser</span></span>
</div>
<div class="stage"><canvas id="cv" tabindex="0"></canvas></div>

<!-- VM + draw core as bundle files; Lua program + icons inlined at build time -->
<script src="fengari-web.js"></script>
<script type="text/plain" id="luaProgram">/*__LUA__*/</script>
<script src="replay.js"></script>
<script>
const ASSETS = /*__ICONS__*/{};
const R = window.UIViewReplay;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const qEl = document.getElementById('q');
const hint = document.getElementById('hint');
const IMAGES = new Map();
for (const name in ASSETS){ const im = new Image(); im.src = ASSETS[name]; IMAGES.set(name, im); }
// The first frame draws before the preloads finish decoding (drawImage on an
// incomplete Image is a silent no-op) — redraw once they're all ready.
Promise.all([...IMAGES.values()].map(im => im.decode().catch(() => null)))
  .then(() => draw());

// ── Fengari: boot the Lua VM once, expose tick(ev) -> frame JSON ──────────────
const F = window.fengari;
const { lua, lauxlib, lualib, to_luastring, to_jsstring } = F;
const L = lauxlib.luaL_newstate();
lualib.luaL_openlibs(L);
(function boot(){
  const program = document.getElementById('luaProgram').textContent;
  if (lauxlib.luaL_dostring(L, to_luastring(program)) !== lua.LUA_OK) {
    hint.textContent = 'lua boot error: ' + to_jsstring(lua.lua_tostring(L, -1));
    hint.style.color = 'var(--fault)';
    lua.lua_pop(L, 1);
  }
})();
function tick(ev){
  lua.lua_getglobal(L, to_luastring('UIView_tick'));
  lua.lua_pushstring(L, to_luastring(ev));
  if (lua.lua_pcall(L, 1, 1, 0) !== lua.LUA_OK){
    console.error('lua tick', to_jsstring(lua.lua_tostring(L, -1))); lua.lua_pop(L, 1); return null;
  }
  const s = to_jsstring(lua.lua_tostring(L, -1));
  lua.lua_pop(L, 1);
  return s;
}

// ── draw (crop to the panel + fit the iframe, both dims) ─────────────────────
let FRAME = { width: 480, height: 320, ops: [], tree: null };
let ZOOM = 1, CROP = { x:0, y:0 };
function draw(){
  const t = FRAME.tree || { x:0, y:0, w:FRAME.width, h:FRAME.height };
  const M = 12;
  const cx = (t.x||0) - M, cy = (t.y||0) - M;
  CROP.x = cx; CROP.y = cy;
  const cw = (t.w||FRAME.width) + M*2, ch = (t.h||FRAME.height) + M*2;
  const barEl = document.querySelector('.bar');
  const barH = barEl ? barEl.offsetHeight : 50;
  const availW = Math.max(240, window.innerWidth - 28);
  const availH = Math.max(180, window.innerHeight - barH - 18);
  ZOOM = Math.max(0.5, Math.min(availW/cw, availH/ch, 2));
  cv.width = cw*ZOOM; cv.height = ch*ZOOM;
  cv.style.width = cw*ZOOM+'px'; cv.style.height = ch*ZOOM+'px';
  ctx.setTransform(ZOOM,0,0,ZOOM, -cx*ZOOM, -cy*ZOOM);
  ctx.clearRect(cx, cy, cw, ch);
  R.drawFrame(ctx, FRAME, { images: IMAGES });
}
function loadIcon(name){
  return new Promise(res => { const im = new Image(); im.onload=()=>res(im); im.onerror=()=>res(null); im.src = ASSETS[name] || ''; });
}
async function run(ev){
  const json = tick(ev);
  if (!json) return;
  let f; try { f = JSON.parse(json); } catch(e){ return; }
  FRAME = f;
  const need = [];
  for (const op of f.ops||[]) if (op.op==='texture' && op.name && !IMAGES.has(op.name)) need.push(op.name);
  if (need.length){ const imgs = await Promise.all(need.map(loadIcon)); need.forEach((n,i)=>IMAGES.set(n,imgs[i])); }
  draw();
}

// ── input -> Lua (synchronous; a tick is just a JS call) ─────────────────────
// A tick costs ~100ms under Fengari (full frame render), so per-event ticks
// back up into seconds of lag on a wheel flick or a mouse sweep. Continuous
// events coalesce: accumulate wheel steps and the latest hover position, flush
// at most one tick per animation frame. Discrete events still run immediately.
function frameCoords(e){ const r = cv.getBoundingClientRect(); return [Math.round(CROP.x + (e.clientX-r.left)/ZOOM), Math.round(CROP.y + (e.clientY-r.top)/ZOOM)]; }
let wheelSteps = 0, wheelAt = null, moveAt = null, flushId = 0;
function scheduleFlush(){ if (!flushId) flushId = requestAnimationFrame(flush); }
function flush(){
  flushId = 0;
  if (wheelSteps){
    const d = Math.max(-20, Math.min(20, wheelSteps)); wheelSteps = 0;
    run(`wheel ${wheelAt[0]} ${wheelAt[1]} ${d}`);
    moveAt = null;                 // hover is stale mid-scroll; drop it
  } else if (moveAt){
    const [x,y] = moveAt; moveAt = null;
    run(`move ${x} ${y}`);
  }
  if (wheelSteps || moveAt) scheduleFlush();
}
cv.addEventListener('click', e => { cv.focus(); const [x,y]=frameCoords(e); run(`click ${x} ${y}`); });
cv.addEventListener('mousemove', e => { moveAt = frameCoords(e); scheduleFlush(); });
cv.addEventListener('wheel', e => { e.preventDefault(); wheelAt = frameCoords(e); wheelSteps += (e.deltaY>0?-1:1); scheduleFlush(); }, { passive:false });
const KEYMAP = { ArrowUp:'up', ArrowDown:'down', Enter:'enter', Tab:'tab', Escape:'esc', F1:'f1' };
document.addEventListener('keydown', e => { const k = KEYMAP[e.key]; if (k){ e.preventDefault(); run(`key ${k}`); } });
qEl.addEventListener('input', () => run(`text ${qEl.value}`));
document.getElementById('reset').addEventListener('click', () => { qEl.value=''; run('reset'); });
window.addEventListener('resize', draw);

run('render');
</script>
</body>
</html>
