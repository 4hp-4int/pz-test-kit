name: 'PZ Test Kit'
description: 'Run Project Zomboid Build 42 mod tests on PZ''s actual Kahlua VM.'
author: '4hp-4int'

branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  mod-root:
    description: 'Path to the mod directory being tested. Defaults to the workspace root.'
    required: false
    default: '${{ github.workspace }}'
  java-version:
    description: 'Java version to use. Must be 25+ — kahlua-runtime.jar ships class-file version 69 (Java 25) matching PZ''s bundled JDK.'
    required: false
    default: '25'
  filter:
    description: 'Lua pattern; only tests whose name matches run.'
    required: false
    default: ''
  junit-xml:
    description: 'Write JUnit XML report to this path for CI test result integration.'
    required: false
    default: 'pz-test-results.xml'
  kit-ref:
    description: 'Git ref (tag / branch / SHA) of pz-test-kit to use. Defaults to the action ref.'
    required: false
    default: ''
  scriptcheck:
    description: 'Validate media/scripts/*.txt with PZ''s own parser before running tests. A malformed script file fails silently in game -- the engine logs a debug warning and the items simply do not exist -- so this catches a whole class of bug the Lua suite cannot see. Set to false to skip.'
    required: false
    default: 'true'
  pz-install-dir:
    description: 'Path to a Project Zomboid install (or staged vanilla files) on the runner. Exported as PZ_INSTALL_DIR so engine mode and vanilla_requires resolve it. Without one, engine-guarded tests contribute nothing and the run says so.'
    required: false
    default: ''

outputs:
  junit-xml:
    description: 'Path to the JUnit XML report written by the run.'
    value: ${{ steps.run.outputs.junit-xml }}
  engine-available:
    description: 'Whether engine mode had a PZ install to run against ("true"/"false"). "false" with engine = true in pz-test.lua means engine-guarded tests were skipped.'
    value: ${{ steps.run.outputs.engine-available }}

runs:
  using: 'composite'
  steps:
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ inputs.java-version }}

    - name: Fetch pz-test-kit
      shell: bash
      run: |
        KIT_REF="${{ inputs.kit-ref }}"
        if [ -z "$KIT_REF" ]; then
          KIT_REF="${{ github.action_ref || 'main' }}"
        fi
        # Clone into a sibling directory if not already present.
        if [ ! -d "$RUNNER_TEMP/pz-test-kit" ]; then
          git clone --depth 1 --branch "$KIT_REF" \
            https://github.com/4hp-4int/pz-test-kit.git \
            "$RUNNER_TEMP/pz-test-kit" \
            || git clone --depth 1 \
               https://github.com/4hp-4int/pz-test-kit.git \
               "$RUNNER_TEMP/pz-test-kit"
        fi
        echo "PZTEST_KIT_DIR=$RUNNER_TEMP/pz-test-kit" >> "$GITHUB_ENV"

    - name: Compile pz-test-kit
      shell: bash
      run: |
        cd "$PZTEST_KIT_DIR/kahlua"
        javac -cp kahlua-runtime.jar \
          TestPlatform.java \
          KahluaTestRunner.java \
          DualVMSim.java \
          StubbingClassLoader.java \
          PZTestKitLauncher.java \
          ScriptCheck.java \
          EngineBridge.java \
          PzLocator.java \
          PopSim.java

    # Before the Lua suite: a broken .txt makes every item in the file vanish
    # with no error the tests could observe, so failing here gives a far
    # clearer signal than a downstream test that cannot find an item.
    - name: Check scripts
      if: ${{ inputs.scriptcheck == 'true' }}
      shell: bash
      run: |
        chmod +x "$PZTEST_KIT_DIR/pztest"
        cd "${{ inputs.mod-root }}"
        "$PZTEST_KIT_DIR/pztest" scriptcheck

    - name: Run tests
      id: run
      shell: bash
      run: |
        chmod +x "$PZTEST_KIT_DIR/pztest"
        JUNIT_PATH="${{ inputs.junit-xml }}"
        FILTER="${{ inputs.filter }}"
        if [ -n "${{ inputs.pz-install-dir }}" ]; then
          export PZ_INSTALL_DIR="${{ inputs.pz-install-dir }}"
        fi
        FLAGS=("--junit-xml" "$JUNIT_PATH")
        if [ -n "$FILTER" ]; then
          FLAGS+=("--filter" "$FILTER")
        fi
        # Tee so the engine-availability line is inspectable after the run.
        LOG="$RUNNER_TEMP/pztest-run.log"
        set -o pipefail
        "$PZTEST_KIT_DIR/pztest" "${{ inputs.mod-root }}" "${FLAGS[@]}" 2>&1 | tee "$LOG"
        echo "junit-xml=$JUNIT_PATH" >> "$GITHUB_OUTPUT"
        # Reduced coverage must be visible in the annotations, not just the
        # transcript: a green run with the engine down is NOT the same green
        # as a run that exercised the engine tests.
        if grep -q "^ENGINE UNAVAILABLE:" "$LOG"; then
          echo "engine-available=false" >> "$GITHUB_OUTPUT"
          echo "::notice title=PZ engine unavailable::engine-guarded tests contributed nothing on this runner — stage a PZ install and set pz-install-dir to run them."
        else
          echo "engine-available=true" >> "$GITHUB_OUTPUT"
        fi
