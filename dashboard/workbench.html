    const pick = $("#ipick"), form = $("#iform");
    pick.onchange = () => {
      if (!pick.value) { form.innerHTML = ""; return; }
      const v = JSON.parse(pick.value);
      let steps, def = null;
      if (v.p) { const a = live.find((x) => x.id === v.p[0]); steps = a.presets[v.p[1]].steps.map((s) => ({ addon: s.addon, action: s.action, params: s.params || {} })); }
      else { def = live.find((x) => x.id === v.a).actions.find((x) => x.id === v.x); steps = [{ addon: v.a, action: v.x, params: null }]; }
      form.innerHTML = `${def && def.doc ? `<div class="muted" style="font-size:11.5px;margin-top:4px">${esc(def.doc)}</div>` : ""}
        <div class="pform">${def ? paramForm(def) : `<span class="mono muted" style="font-size:11.5px">${steps.map(stepText).map(esc).join(" → ")}</span>`}<button class="btn small primary" id="irun">▶ run</button></div>`;
      $("#irun").onclick = async () => {
        if (def) { try { steps[0].params = readParams(form); } catch (e) { alert(e.message); return; } }

        for (const st of steps) {
          let res;
          try { res = await call("addonRun", { ref: c.ref, addon: st.addon, action: st.action, params: st.params || {} }); }
          catch (e) { res = { ok: false, err: e.message, addon: st.addon, action: st.action }; }
          c.lastRun = res;
          if (!res.ok) break;
          if (first) c.lastBefore = res.before;
          first = false;
          c.snap = res.item;
          (c.steps = c.steps || []).push({ addon: st.addon, action: st.action, params: res.params || st.params || {} });
        }
        this.save(); this.draw(); this.inspect();
      };
    };

  inspectAction(el, a) {

          ${a.akind === "timed" ? `<select class="inp" id="amode"><option value="sp" ${a.mode !== "mp" ? "selected" : ""}>SP (perform + complete on one machine)</option><option value="mp" ${a.mode === "mp" ? "selected" : ""}>MP (client perform; server serverStart + complete)</option></select>` : `<span class="muted" style="font-size:12px">client → server command</span>`}</div>

        <div class="muted" style="font-size:11px">or drop an item card on the action</div>

          <div class="verdict ${res.noChange ? "warn" : res.ok && !arr(res.steps).some((h) => !h.ok) ? "ok" : "bad"}" style="padding:6px 9px">${res.err ? `<pre class="fail">${esc(res.err)}</pre>` : res.noChange ? "<b>Ran, but nothing changed.</b> <span class='muted'>Every slot item came out exactly as it went in. A server handler that refuses usually looks like this; see the log.</span>" : res.ok ? "ran" : "failed"}

          ${arr(res.commands).length ? `<h3>Commands sent</h3>${res.commands.map((x) => `<div style="font-size:12px"><span class="mono acc">${esc(x.module)}/${esc(x.command)}</span>${x.toServer ? " <span class='dim'>(to server)</span>" : ""} ${val(x.args, 1)}</div>`).join("")}` : ""}

          <details style="margin-top:8px"><summary style="font-size:12px">CraftRecipeMonitor · ${arr(res.monitor).length ? arr(res.monitor).length + " lines" : "off (tick engine monitor)"}</summary><div class="monitor">${arr(res.monitor).map((l) => `<div class="${/WARN|FAIL|NOT /.test(l) ? "why" : ""}">${esc(l)}</div>`).join("")}</div></details>
          ${arr(res.out).length ? `<details><summary style="font-size:12px">print output · ${res.out.length}</summary><pre class="box">${esc(res.out.join("\n"))}</pre></details>` : ""}` : ""}
      </div>`;
    $("#icraft").onclick = () => this.craft(r);

});

// Craft simulator ----------------------------------------------------------
tool("craft", {
  icon: "⚒", label: "Craft",
  st: { q: "", recipe: null, items: [], qualify: true, mode: "action", list: null, detail: null, result: null, history: [], stepForm: null },
  hash() { const s = this.st; return { recipe: s.recipe, inv: s.items.length ? JSON.stringify(s.items) : null, mode: s.mode !== "action" ? s.mode : null }; },
  load(h) {
    const s = this.st;
    if (h.recipe) s.recipe = h.recipe;

  async render(v) {

      <div id="rmain"></div></div>`;
    $("#rq").oninput = debounce(async (e) => { s.q = e.target.value; await this.loadList(); }, 200);
    this.loadList();
    this.renderMain();
  },
  async loadList() {
    const s = this.st;
    const isItem = /^[A-Z][\w]*\.[\w]+$/.test(s.q.trim()) && !s.q.includes(" ");
    const r = await call("recipes", isItem ? { item: s.q.trim(), limit: 400 } : { q: s.q, limit: 400 }).catch((e) => ({ error: e.message }));
    if (r.error) { $("#rlist").innerHTML = `<pre class="fail" style="padding:8px">${esc(r.error)}</pre>`; return; }
    s.list = r;
    $("#rlist").innerHTML = (isItem ? `<div class="li dim" style="cursor:default">recipes using/producing ${esc(s.q)}</div>` : "")
      + arr(r.recipes).map((x) => `<div class="li ${x.full === s.recipe ? "sel" : ""}" data-r="${esc(x.full)}"><span class="t" title="${esc(x.full)}">${esc(x.label)}</span><span class="s">${esc(x.category || "")}${x.learn ? " · learn" : ""}</span></div>`).join("")
      + (r.total > arr(r.recipes).length ? `<div class="li dim">… ${r.total - arr(r.recipes).length} more, refine the search</div>` : "");
    for (const li of $$("#rlist [data-r]")) li.onclick = () => this.pick(li.dataset.r);

        <datalist id="itemlist"></datalist>
        ${arr(s.planNotes).length ? `<div class="warn" style="font-size:11.5px;margin-top:4px">${arr(s.planNotes).map(esc).join("<br>")}</div>` : ""}
        <div class="row" style="margin-top:8px">
          <label class="muted"><input type="checkbox" id="qual" ${s.qualify ? "checked" : ""}> qualify player (learn recipe + set required skills)</label>

          <label class="muted">path <select id="mode" class="inp"><option value="action" ${s.mode === "action" ? "selected" : ""}>ISHandcraftAction.performRecipe (mod hooks run)</option><option value="logic" ${s.mode === "logic" ? "selected" : ""}>HandcraftLogic only (no Lua action layer)</option></select></label>
          <span style="flex:1"></span><button class="btn primary" id="runcraft">▶ Craft</button></div></div>
      <div id="cresult"></div>
      <details class="card"><summary>Script source (${arr(d.source && d.source.defs).length} definition${arr(d.source && d.source.defs).length === 1 ? "" : "s"})</summary>${arr(d.source && d.source.defs).map((x) => `<div class="muted mono" style="font-size:11px;margin-top:8px">${esc(x.origin)} · ${esc(x.file)}:${x.line}</div><pre class="box">${esc(x.text)}</pre>`).join("") || `<span class="dim">not found on disk</span>`}</details>`;
    this.renderRows();
    $("#fill").onclick = async () => { s.items = []; s.result = null; await this.renderMain(); };
    $("#addrow").onclick = () => { s.items.push({ type: "", count: 1 }); this.renderRows(); };

    $("#mode").onchange = (e) => { s.mode = e.target.value; writeHash(); };
    $("#runcraft").onclick = () => this.run();
    if (s.result) this.renderResult();
  },
  renderRows() {
    const s = this.st;
    $("#invrows").innerHTML = s.items.map((it, i) => `<tr data-i="${i}">
      <td><input class="inp mono" list="itemlist" data-f="type" value="${esc(it.type)}"></td>
      <td><input class="inp" type="number" min="1" data-f="count" value="${it.count || 1}"></td>
      <td><input class="inp mono" data-f="modData" placeholder='{"key": 1}' value="${esc(it.modData ? JSON.stringify(it.modData) : "")}"></td>
      <td><input class="inp mono" data-f="init" placeholder="it:setCondition(3)" value="${esc(it.init || "")}"></td>
      <td class="steps" data-i="${i}">${arr(it.steps).map((st, j) => `<span class="step" title="${esc(stepText(st))}">${esc(stepText(st))}<b data-sdel="${j}">✕</b></span>`).join("")}<select class="inp" data-addstep="${i}" style="max-width:150px"><option value="">+ step…</option></select></td>
      <td><button class="btn small" data-del="${i}">✕</button></td></tr>
      ${s.stepForm && s.stepForm.row === i ? `<tr class="stepform"><td colspan="6"><div class="pform"><b class="acc mono" style="font-size:12px">${esc(s.stepForm.addon)}/${esc(s.stepForm.action)}</b>${paramForm(s.stepForm.def, null)}
        <button class="btn small primary" id="stepok">add step</button><button class="btn small" id="stepcancel">cancel</button>${s.stepForm.def.doc ? `<span class="muted" style="font-size:11.5px">${esc(s.stepForm.def.doc)}</span>` : ""}</div></td></tr>` : ""}`).join("");
    for (const inp of $$("#invrows input")) {
      inp.onchange = inp.oninput = (e) => {
        const i = +e.target.closest("tr").dataset.i, f = e.target.dataset.f;
        let v = e.target.value;
        if (f === "count") v = Math.max(1, +v || 1);
        if (f === "modData") { try { v = v.trim() ? JSON.parse(v) : undefined; e.target.style.borderColor = ""; } catch (_) { e.target.style.borderColor = "var(--fail)"; return; } }
        s.items[i][f] = v;
        writeHash();
        if (f === "type") itemSuggest(e.target.value);
      };
    }
    for (const b of $$("#invrows [data-del]")) b.onclick = () => { s.items.splice(+b.dataset.del, 1); this.renderRows(); writeHash(); };
    for (const b of $$("#invrows [data-sdel]")) b.onclick = () => { const i = +b.closest("td").dataset.i; s.items[i].steps.splice(+b.dataset.sdel, 1); this.renderRows(); writeHash(); };
    if (s.stepForm) {
      $("#stepok").onclick = () => {
        let params;
        try { params = readParams($("tr.stepform")); } catch (e) { alert(e.message); return; }
        const it = s.items[s.stepForm.row];
        (it.steps = it.steps || []).push({ addon: s.stepForm.addon, action: s.stepForm.action, params });
        s.stepForm = null; this.renderRows(); writeHash();
      };
      $("#stepcancel").onclick = () => { s.stepForm = null; this.renderRows(); };
    }
    // Step menus: presets + actions that apply to the row's item type.
    for (const sel of $$("#invrows [data-addstep]")) {
      const i = +sel.dataset.addstep, type = s.items[i].type;
      if (!type) continue;
      addonsFor(type).then((r) => {
        const live = arr(r.addons).filter((a) => !a.disabled && a.applies !== false);
        sel.innerHTML = `<option value="">+ step…</option>` + live.map((a) => {
          const pre = arr(a.presets).filter((p) => p.applies !== false);
          const acts = arr(a.actions).filter((x) => x.applies !== false);
          return (pre.length ? `<optgroup label="${esc(a.name)} presets">${pre.map((p, k) => `<option value='${esc(JSON.stringify({ preset: [a.id, k] }))}'>★ ${esc(p.label)}</option>`).join("")}</optgroup>` : "")
            + (acts.length ? `<optgroup label="${esc(a.name)} actions">${acts.map((x) => `<option value='${esc(JSON.stringify({ addon: a.id, action: x.id }))}'>${esc(x.label)}</option>`).join("")}</optgroup>` : "");
        }).join("");
        sel.onchange = () => {
          if (!sel.value) return;
          const v = JSON.parse(sel.value), it = s.items[i];
          if (v.preset) {
            const a = live.find((x) => x.id === v.preset[0]);
            it.steps = (it.steps || []).concat(arr(a.presets[v.preset[1]].steps).map((st) => ({ addon: st.addon, action: st.action, params: st.params || {} })));
            this.renderRows(); writeHash(); return;
          }
          const def = live.find((x) => x.id === v.addon).actions.find((x) => x.id === v.action);
          if (!arr(def.params).length) { (it.steps = it.steps || []).push({ addon: v.addon, action: v.action, params: {} }); this.renderRows(); writeHash(); return; }
          s.stepForm = { row: i, addon: v.addon, action: v.action, def };
          this.renderRows();
        };
      });
    }
  },
  async run() {
    const s = this.st;
    $("#cresult").innerHTML = `<div class="card"><span class="spin"></span> crafting…</div>`;
    try {
      s.result = await call("craft", { recipe: s.recipe, items: s.items.filter((x) => x.type), qualify: s.qualify, mode: s.mode, monitor: !!s.monitor });
    } catch (e) { s.result = { error: e.message, _out: e.out }; }
    s.history.unshift({ recipe: s.recipe, ok: s.result.ok, at: new Date().toLocaleTimeString(), items: JSON.parse(JSON.stringify(s.items)) });
    this.renderResult();
  },
  renderResult() {
    const r = this.st.result, el = $("#cresult");
    if (!el || !r) return;
    if (r.error) { el.innerHTML = `<div class="verdict bad"><b>Tool error</b><pre>${esc(r.error)}</pre></div>`; return; }
    // mode: "before" = show the item as it went in (consumed), "after" = as it is now,
    // "diff" = now, with changes vs before highlighted (kept tools).
    const items = (list, mode) => arr(list).map((i) => {
      const panels = mode === "before" ? i.panelsBefore : i.panels;
      const ph = panelsHtml(panels, mode === "diff" ? i.panelsBefore : null);
      return `<tr><td>${val({ $java: true, ref: i.ref, class: i.class, str: i.fullType })}</td><td class="mono" style="font-size:12px">${esc(i.name || "")}</td>
      <td class="mono dim" style="font-size:11px">${i.condition != null ? "cond " + i.condition + "/" + i.conditionMax : ""}${i.uses != null ? " uses " + i.uses : ""}</td>
      <td style="text-align:right"><button class="btn small" data-bench='${esc(JSON.stringify({ ref: i.ref, type: i.fullType }))}' title="Open this live item in the item bench: run addon actions on it">⚙</button></td></tr>
      ${ph ? `<tr><td colspan="4">${ph}</td></tr>` : (i.modData && !panels ? `<tr><td colspan="4">${val(i.modData, 1)}</td></tr>` : "")}`;
    }).join("");
    const hooks = arr(r.hooks), cmds = arr(r.commands), why = arr(r.why), out = arr(r._out);
    const verdict = r.ok ? ["ok", "Crafted"] : r.ran ? ["bad", "Refused — no output"] : ["bad", "Threw"];
    el.innerHTML = `<div class="verdict ${verdict[0]}"><b>${verdict[1]}</b> <span class="muted mono">${esc(r.recipe)} · ${r.mode} path · ${r.ms != null ? r.ms.toFixed(2) + " ms in engine" : ""}</span>
        <div class="muted" style="font-size:12px;margin-top:3px">canPerform: ${r.canPerform == null ? "n/a" : r.canPerform} · mod performRecipe wrapper: ${r.hooked ? `<span class="acc">installed</span>` : "none"} · qualified: ${arr(r.qualified).map(esc).join(", ") || "—"}</div>
        ${why.length ? `<div class="warn mono" style="font-size:12px;margin-top:4px">${why.map(esc).join("<br>")}</div>` : ""}
        ${r.err ? `<pre class="fail" style="margin-top:4px">${esc(r.err)}</pre>` : ""}
        ${arr(r.initErrors).length ? `<pre class="warn">${arr(r.initErrors).map(esc).join("\n")}</pre>` : ""}</div>
      <div class="cols3"><div class="card"><h3 style="margin-top:0">Consumed · ${arr(r.consumed).length} <span class="dim" style="text-transform:none">(as they went in)</span></h3><table>${items(r.consumed, "before") || `<tr><td class="dim">nothing</td></tr>`}</table>
          <h3>Kept · ${arr(r.kept).length} <span class="dim" style="text-transform:none">(changes highlighted)</span></h3><table>${items(r.kept, "diff") || `<tr><td class="dim">nothing</td></tr>`}</table></div>
        <div class="card"><h3 style="margin-top:0">Produced · ${arr(r.outputs).length}</h3><table>${items(r.outputs, "after") || `<tr><td class="dim">nothing</td></tr>`}</table>
          ${cmds.length ? `<h3>Commands sent · ${cmds.length}</h3>${cmds.map((c) => `<div class="mono" style="font-size:12px">${esc(c.module)} / <b>${esc(c.command)}</b> ${val(c.args, 1)}</div>`).join("")}` : ""}</div></div>
      ${hooks.length ? `<div class="card"><h3 style="margin-top:0">Lua hooks</h3><table>${hooks.map((h) => `<tr><td class="mono" style="font-size:12px">${esc(h.kind)}</td><td class="mono" style="font-size:12px">${esc(h.fn)}</td>
          <td>${h.resolved ? (h.calls ? `<span class="pass">called ×${h.calls}</span>` : `<span class="warn">resolved, not called</span>`) : `<span class="fail">unresolved</span>`}${arr(h.loaded).length ? ` <span class="dim">(required ${arr(h.loaded).map(esc).join(", ")})</span>` : ""}</td>
          <td>${h.args ? "args " + val(h.args, 1) : ""}${h.returned != null ? " → " + val(h.returned) : ""}${h.err ? `<span class="fail">${esc(h.err)}</span>` : ""}${h.reason ? `<span class="muted" style="font-size:11.5px">${esc(h.reason)}</span>` : ""}</td></tr>`).join("")}</table></div>` : ""}
      <div class="row" style="margin-bottom:12px">${val(r.logic)} ${val(r.player)} <span class="dim" style="font-size:11px">← the live HandcraftLogic and player; click to explore</span></div>
      <details class="card" ${r.ok ? "" : "open"}><summary>CraftRecipeMonitor · ${arr(r.monitor).length ? arr(r.monitor).length + " lines" : "off (tick engine monitor)"}</summary><div class="monitor" style="margin-top:6px">${arr(r.monitor).map((l) => `<div class="${/WARN|FAIL|NOT /.test(l) ? "why" : ""}">${esc(l)}</div>`).join("")}</div></details>
      ${out.length ? `<details class="card"><summary>Lua print output · ${out.length} lines</summary><pre class="box">${esc(out.join("\n"))}</pre></details>` : ""}
      <details class="card"><summary>Inventory after · ${arr(r.inventory).length}</summary><table>${items(r.inventory, "after")}</table></details>
      ${this.st.history.length > 1 ? `<details class="card"><summary>This session · ${this.st.history.length} crafts</summary>${this.st.history.map((h) => `<div class="mono" style="font-size:12px"><span class="${h.ok ? "pass" : "fail"}">${h.ok ? "✓" : "✗"}</span> ${esc(h.at)} ${esc(h.recipe)} ← ${h.items.map((i) => esc(i.type) + "×" + i.count).join(", ")}</div>`).join("")}</details>` : ""}`;
  },
});

// Items ----------------------------------------------------------------------
tool("items", {
  icon: "◇", label: "Items",
  st: { q: "", item: null, list: null, pq: "" },
  hash() { return { item: this.st.item, q: this.st.q || null }; },
  load(h) { if (h.item) this.st.item = h.item; if (h.q) this.st.q = h.q; },
  async render(v) {
    const s = this.st;
    v.innerHTML = `<div class="cols"><div><input class="inp" id="iq" placeholder="search items (type, name, category)" value="${esc(s.q)}" style="width:100%;margin-bottom:6px">
      <div class="list" id="ilist"><div class="empty"><span class="spin"></span></div></div></div><div id="imain"></div></div>`;
    $("#iq").oninput = debounce((e) => { s.q = e.target.value; writeHash(); this.loadList(); }, 200);
    this.loadList();
    this.renderMain();
  },
  async loadList() {
    const s = this.st;
    const r = await call("items", { q: s.q, limit: 400 }).catch((e) => ({ error: e.message }));
    if (r.error) { $("#ilist").innerHTML = `<pre class="fail" style="padding:8px">${esc(r.error)}</pre>`; return; }
    $("#ilist").innerHTML = arr(r.items).map((x) => `<div class="li ${x.fullType === s.item ? "sel" : ""}" data-i="${esc(x.fullType)}"><span class="t" title="${esc(x.fullType)}">${esc(x.name)}</span><span class="s">${esc(x.fullType)}</span></div>`).join("")
      + (r.total > arr(r.items).length ? `<div class="li dim">… ${r.total - arr(r.items).length} more of ${r.total}</div>` : "");
    for (const li of $$("#ilist [data-i]")) li.onclick = () => { s.item = li.dataset.i; $$("#ilist .li").forEach((x) => x.classList.toggle("sel", x === li)); writeHash(); this.renderMain(); };
  },
  async renderMain() {
    const s = this.st, el = $("#imain");
    if (!el) return;
    if (!s.item) { el.innerHTML = `<div class="empty">Pick an item to see its script properties, tags, source, and every recipe that consumes, keeps, or produces it.</div>`; return; }
    el.innerHTML = `<span class="spin"></span>`;
    let d;
    try { d = await call("item", { fullType: s.item }); } catch (e) { el.innerHTML = `<pre class="fail">${esc(e.message)}</pre>`; return; }
    const props = d.props || {};
    const rl = (list) => arr(list).map((r) => `<a class="lnk" data-go='${esc(JSON.stringify({ tool: "craft", recipe: r }))}'>${esc(r.replace(/^Base\./, ""))}</a>`).join(", ") || `<span class="dim">none</span>`;
    el.innerHTML = `<h2>${esc(props.getDisplayName || s.item)} <small>${esc(s.item)}</small> ${val(d.script)}</h2>
      <div class="row" style="margin:-4px 0 10px"><button class="btn small" id="inst">instance a real item → explore</button>
        ${arr(d.tags).map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</div>
      <div class="cols3"><div class="card"><h3 style="margin-top:0">Recipes</h3>
          <div style="font-size:12px"><span class="muted">consumed by</span> ${rl(d.consumedBy)}</div>
          <div style="font-size:12px;margin-top:4px"><span class="muted">used as tool by</span> ${rl(d.keptBy)}</div>
          <div style="font-size:12px;margin-top:4px"><span class="muted">produced by</span> ${rl(d.producedBy)}</div></div>
        <div class="card"><h3 style="margin-top:0">Script source</h3>${arr(d.source && d.source.defs).map((x) => `<div class="muted mono" style="font-size:11px">${esc(x.origin)} · ${esc(x.file)}:${x.line}</div><pre class="box" style="max-height:260px">${esc(x.text)}</pre>`).join("") || `<span class="dim">not found on disk</span>`}</div></div>
      <div class="card" id="bench"></div>
      <div class="card"><div class="row"><h3 style="margin:0;flex:1">Script properties · ${Object.keys(props).length} getters</h3><input class="inp" id="pq" placeholder="filter" value="${esc(s.pq)}"></div>
        <table id="ptable" style="margin-top:6px"></table></div>`;
    const rows = (q) => Object.keys(props).sort().filter((k) => !q || k.toLowerCase().includes(q.toLowerCase()) || String(props[k]).toLowerCase().includes(q.toLowerCase()))
      .map((k) => `<tr><td class="k">${esc(k)}</td><td>${val(props[k])}</td></tr>`).join("");
    $("#ptable").innerHTML = rows(s.pq);
    $("#pq").oninput = (e) => { s.pq = e.target.value; $("#ptable").innerHTML = rows(s.pq); };
    $("#inst").onclick = () => openExplorer({ expr: `PZEngine.instanceItem("${s.item}")` });
    this.renderBench();
  },
  // A live item + every addon action that applies to it. Each action shows
  // what changed (panels before -> after), the log and any network commands.
  async renderBench() {
    const s = this.st, el = $("#bench");
    if (!el) return;
    if (s.live && s.live.type !== s.item) s.live = null;
    const r = await addonsFor(s.item);
    const live = arr(r.addons).filter((a) => !a.disabled && a.applies !== false);
    const head = `<div class="row"><h3 style="margin:0;flex:1">Item bench <span class="dim" style="text-transform:none">· addons: ${live.map((a) => esc(a.name)).join(", ") || "none apply"}</span></h3>
      ${s.live ? `${val({ $java: true, ref: s.live.ref, class: "", str: s.item })} <button class="btn small" id="bnew" title="Discard this one and instance a fresh item">fresh item</button>` : `<button class="btn small primary" id="bnew">instance a live item</button>`}</div>`;
    if (!s.live) { el.innerHTML = head + `<div class="muted" style="font-size:12px;margin-top:6px">Instance a real item to run addon actions on it (add kills, set modData, force affixes...) and watch what changes.</div>`; $("#bnew").onclick = () => this.freshItem(); return; }
    let snap = s.live.snap;
    if (!snap) { try { snap = s.live.snap = await call("addonPanels", { ref: s.live.ref }); } catch (e) { s.live = null; el.innerHTML = head + `<pre class="fail">${esc(e.message)}</pre>`; return; } }
    const last = s.live.last;
    el.innerHTML = head + `<div class="cols3" style="margin-top:8px"><div>
        ${live.map((a) => arr(a.actions).filter((x) => x.applies !== false).map((x) => `<div class="act" data-a="${esc(a.id)}" data-x="${esc(x.id)}"><div class="row"><b style="font-size:12.5px">${esc(x.label)}</b> <span class="dim mono" style="font-size:11px">${esc(a.id)}/${esc(x.id)}</span></div>
          ${x.doc ? `<div class="doc">${esc(x.doc)}</div>` : ""}<div class="pform">${paramForm(x)}<button class="btn small primary" data-run>▶</button></div></div>`).join("")).join("")}</div>
      <div>${last ? `<div class="verdict ${last.ok ? "ok" : "bad"}" style="margin-bottom:8px"><b>${esc(last.addon)}/${esc(last.action)}</b> ${last.ok ? val(last.result) : `<pre class="fail">${esc(last.err)}</pre>`}
          ${arr(last.log).length ? `<pre class="muted" style="margin-top:4px">${arr(last.log).map(esc).join("\n")}</pre>` : ""}
          ${arr(last.commands).length ? `<div style="font-size:12px;margin-top:4px">commands: ${arr(last.commands).map((c) => `<span class="mono">${esc(c.module)}/<b>${esc(c.command)}</b></span>`).join(", ")}</div>` : ""}
          ${arr(last._out).length ? `<details style="margin-top:4px"><summary>print output · ${arr(last._out).length}</summary><pre class="box">${esc(arr(last._out).join("\n"))}</pre></details>` : ""}</div>` : ""}
        ${panelsHtml(snap.panels, last ? last.before : null) || `<div class="dim">no panels for this item</div>`}</div></div>`;
    $("#bnew").onclick = () => this.freshItem();
    for (const b of $$("#bench [data-run]")) b.onclick = async () => {
      const row = b.closest(".act");
      let params;
      try { params = readParams(row); } catch (e) { alert(e.message); return; }
      b.disabled = true;
      let res;
      try { res = await call("addonRun", { ref: s.live.ref, addon: row.dataset.a, action: row.dataset.x, params }); }
      catch (e) { res = { ok: false, err: e.message, addon: row.dataset.a, action: row.dataset.x }; }
      s.live.last = res;
      if (res.item) s.live.snap = res.item;
      this.renderBench();
    };
  },
  async freshItem() {
    const s = this.st;
    try {
      const r = await call("addonPanels", { type: s.item });
      s.live = { ref: r.ref, type: s.item, snap: r };
    } catch (e) { $("#bench").innerHTML += `<pre class="fail">${esc(e.message)}</pre>`; return; }
    this.renderBench();
  },
});

tool("addons", {
  icon: "✚", label: "Addons",
  st: {},
  async render(v) {
    v.innerHTML = `<span class="spin"></span>`;
    const r = await addonsFor("");
    const errs = arr(r.loadErrors);
    v.innerHTML = `<h2>Addons <small>${arr(r.addons).length} loaded in the ${esc(S.mod)} VM</small></h2>
      <p class="muted" style="max-width:900px">An addon is one <span class="mono">WB.addon{...}</span> call in Lua. Its actions show up as <b>craft input steps</b> (⚒ Craft → addon steps) and as buttons on a live item (◇ Items → Item bench); its panels show on every matching item, before and after a craft. Forms are generated from the declared params.
      Files are picked up from <span class="mono">dashboard/workbench/addons/</span>, <span class="mono">&lt;mod&gt;/workbench/</span> and each pz-test.lua dependency's <span class="mono">workbench/</span>; edit one, then <b>reload tools</b>.</p>
      ${errs.length ? `<div class="verdict bad"><b>Failed to load</b>${errs.map((e) => `<div class="mono" style="font-size:12px;margin-top:4px">${esc(e.file)}</div><pre class="fail">${esc(e.error)}</pre>`).join("")}</div>` : ""}
      ${arr(r.addons).map((a) => `<div class="card"><div class="row"><h3 style="margin:0;flex:1;text-transform:none;font-size:14px;color:var(--text)">${esc(a.name)} <span class="dim mono" style="font-size:11px">${esc(a.id)}</span></h3><span class="dim mono" style="font-size:11px">${esc(a.file || "")}</span></div>
        ${a.description ? `<div class="muted" style="font-size:12px">${esc(a.description)}</div>` : ""}
        ${a.disabled ? `<div class="fail" style="font-size:12px;margin-top:4px">disabled: ${esc(a.disabled)}</div>` : ""}
        <table style="margin-top:6px">${arr(a.actions).map((x) => `<tr><td class="k">${esc(x.id)}</td><td>${esc(x.label)}${arr(x.params).length ? ` <span class="dim mono" style="font-size:11px">(${arr(x.params).map((p) => esc(p.name) + ":" + esc(p.type || "string")).join(", ")})</span>` : ""}</td><td class="muted" style="font-size:12px">${esc(x.doc || "")}</td></tr>`).join("")}</table>
        ${arr(a.presets).length ? `<div style="margin-top:6px;font-size:12px"><span class="muted">presets:</span> ${arr(a.presets).map((p) => `<span class="tag" title="${esc(arr(p.steps).map(stepText).join("\n"))}">★ ${esc(p.label)}</span>`).join("")}</div>` : ""}
        ${arr(a.panels).length ? `<div style="font-size:12px"><span class="muted">panels:</span> ${arr(a.panels).map((p) => `<span class="tag">${esc(p.title)}</span>`).join("")}</div>` : ""}</div>`).join("")}
      <details class="card"><summary>Template: <span class="mono">&lt;your mod&gt;/workbench/mymod.lua</span></summary><pre class="box">${esc(ADDON_TEMPLATE)}</pre></details>`;
  },
});
const ADDON_TEMPLATE = `-- Lives outside media/: dev tooling, never deployed. ASCII only (Kahlua's lexer).
local MyMod   -- bound below, after WB.addon has required it

WB.addon {
    id = "mymod", name = "MyMod",
    description = "what these tools are for",
    requires = { "MyMod/Core" },                       -- failure disables the addon, with the reason shown
    appliesTo = function(item) return instanceof(item, "HandWeapon") end,

    panels = {                                         -- shown on every matching item, before + after crafts
        { id = "state", title = "MyMod state",
          render = function(item) return { level = item:getModData().myLevel } end },
    },

    actions = {                                        -- craft input steps + live-item buttons
        { id = "setLevel", label = "Set level",
          doc = "Call the mod's real code path, not raw modData, where one exists",
          params = { { name = "level", type = "number", default = 3 } },  -- number|string|bool|select(options)|json
          run = function(item, p, ctx)                 -- ctx.player = real IsoPlayer, ctx.log(msg)
              MyMod.setLevel(item, p.level, ctx.player)
              return "level " .. p.level               -- shown as the result
          end },
    },

    presets = {                                        -- one-click step lists for craft inputs
        { label = "Max level", steps = { { "setLevel", { level = 10 } } } },
    },
}

MyMod = _G.MyMod`;

// Explorer (as a page: start from an expression) -----------------------------
tool("explore", {
  icon: "◎", label: "Explore",
  st: {},
  async render(v) {
    const ex = [
      ["a real Axe", `PZEngine.instanceItem("Base.Axe")`],
      ["the script manager", `getScriptManager()`],
      ["GetLongStick recipe", `getScriptManager():getCraftRecipe("Base.GetLongStick")`],
      ["a real player", `WB.craft and WB.craft.player or PZEngine.newPlayer()`],
      ["the PZEngine API table", `PZEngine`],
      ["SandboxVars", `SandboxVars`],
    ];
    v.innerHTML = `<h2>Object explorer</h2><p class="muted">Evaluate any Lua expression in the VM and open the result. Every Java object shows its Lua-exposed methods with signatures (from <span class="mono">pz-dev-tools/indexes/java-api</span>); zero-arg methods are one click, and every result drills further. Paths made of expressions + method steps survive VM restarts and are shareable links.</p>
      <div class="row"><input class="inp mono" id="xexpr" style="flex:1" placeholder='PZEngine.instanceItem("Base.Axe")'><button class="btn primary" id="xgo">open</button></div>
      <h3>Starting points</h3>${ex.map(([l, e]) => `<div><a class="lnk" data-x="${esc(e)}">${esc(e)}</a> <span class="muted">— ${esc(l)}</span></div>`).join("")}`;
    const go = () => { const e = $("#xexpr").value.trim(); if (e) openExplorer({ expr: e }); };
    $("#xgo").onclick = go;
    $("#xexpr").onkeydown = (e) => { if (e.key === "Enter") go(); };
    for (const a of $$("[data-x]", v)) a.onclick = () => openExplorer({ expr: a.dataset.x });
  },
});

// Console ----------------------------------------------------------------------
tool("console", {
  icon: "›_", label: "Console",
  st: { log: [], hist: JSON.parse(localStorage.wbHist || "[]"), hi: -1 },
  async render(v) {
    const s = this.st;
    v.innerHTML = `<h2>Lua console <small>resident VM · <span class="mono">$N</span> = explored object N · <span class="mono">_</span> = last result · Ctrl+Enter runs</small></h2>
      <textarea id="csrc" rows="5" style="width:100%" class="mono" placeholder='local it = PZEngine.instanceItem("Base.Axe")\nreturn it:getMaxDamage(), it'></textarea>
      <div class="row" style="margin:6px 0 12px"><button class="btn primary" id="crun">▶ Run</button><button class="btn small" id="cclear">clear</button><span class="muted" style="font-size:11px">↑/↓ in an empty box walks history</span></div>
      <div class="consoleout" id="cout"></div>`;
    const ta = $("#csrc");
    ta.onkeydown = (e) => {
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); this.run(); }
      if ((e.key === "ArrowUp" || e.key === "ArrowDown") && (!ta.value || s.hi >= 0)) {
        if (!s.hist.length) return;
        e.preventDefault();
        s.hi = e.key === "ArrowUp" ? Math.min(s.hist.length - 1, s.hi + 1) : Math.max(-1, s.hi - 1);
        ta.value = s.hi >= 0 ? s.hist[s.hi] : "";
      }
    };
    $("#crun").onclick = () => this.run();
    $("#cclear").onclick = () => { s.log = []; this.renderLog(); };
    this.renderLog();
    ta.focus();
  },
  async run() {
    const s = this.st, src = $("#csrc").value;
    if (!src.trim()) return;
    s.hist = [src, ...s.hist.filter((x) => x !== src)].slice(0, 100);
    localStorage.wbHist = JSON.stringify(s.hist);
    s.hi = -1;
    const entry = { src, pending: true };
    s.log.unshift(entry);
    this.renderLog();
    try { const r = await call("eval", { src }); Object.assign(entry, { values: arr(r.values), out: arr(r._out), ms: r._ms }); }
    catch (e) { Object.assign(entry, { error: e.message, out: arr(e.out) }); }
    entry.pending = false;
    $("#csrc").value = "";
    this.renderLog();
  },
  renderLog() {
    const el = $("#cout");
    if (!el) return;
    el.innerHTML = this.st.log.map((e) => `<div class="entry"><div class="src">› ${esc(e.src)}</div>
      ${e.pending ? `<span class="spin"></span>` : ""}
      ${e.out && e.out.length ? `<pre class="muted">${esc(e.out.join("\n"))}</pre>` : ""}
      ${e.error ? `<pre class="fail">${esc(e.error)}</pre>` : ""}
      ${e.values ? (e.values.length ? e.values.map((x) => `<div>${val(x)}</div>`).join("") : `<span class="dim">(no value)</span>`) : ""}
      ${e.ms != null ? `<span class="dim" style="font-size:11px">${e.ms} ms</span>` : ""}</div>`).join("");
  },
});

// ── item autocomplete (shared) ─────────────────────────────────────────────
const itemSuggest = debounce(async (q) => {
  if (!q || q.length < 2) return;
  const r = await call("items", { q, limit: 40 }).catch(() => null);
  const dl = $("#itemlist");
  if (r && dl) dl.innerHTML = arr(r.items).map((x) => `<option value="${esc(x.fullType)}">${esc(x.name)}</option>`).join("");
}, 180);
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

// ── shell ──────────────────────────────────────────────────────────────────
function renderRail() {
  $("#rail").innerHTML = Object.entries(TOOLS).map(([id, t]) => `<div class="tool ${id === S.tool ? "on" : ""}" data-t="${id}"><b>${t.icon}</b>${t.label}</div>`).join("");
  for (const el of $$("#rail .tool")) el.onclick = () => switchTool(el.dataset.t);
}
async function switchTool(id, params) {
  S.tool = id;
  if (params) {
    if (id === "craft" && params.recipe) { const st = TOOLS.craft.st; if (st.recipe !== params.recipe) { st.items = []; st.result = null; } st.recipe = params.recipe; st.q = st.q || ""; }
    if (id === "items" && params.item) TOOLS.items.st.item = params.item;
  }
  renderRail();
  writeHash();
  $("#view").classList.toggle("bleed", id === "board");
  await TOOLS[id].render($("#view"));
}
async function selectMod(id) {
  S.mod = id;
  S.addonCache = {};
  localStorage.wbMod = id;
  $("#mod").value = id;
  for (const t of Object.values(TOOLS)) if (t.st) { t.st.list = null; t.st.detail = null; t.st.result = null; }
  writeHash();
  pollStatus();
  await TOOLS[S.tool].render($("#view"));
}

async function boot() {
  S.mods = await fetch("/api/wb/mods").then((r) => r.json());
  const h = readHash();
  $("#mod").innerHTML = S.mods.slice().sort((a, b) => (b.engine - a.engine) || a.name.localeCompare(b.name))
    .map((m) => `<option value="${esc(m.id)}">${esc(m.name)}${m.engine ? "" : " (no engine)"}</option>`).join("");
  $("#mod").onchange = (e) => selectMod(e.target.value);
  const pref = h.mod || localStorage.wbMod || (S.mods.find((m) => m.id === "VorpallySauced") || S.mods.find((m) => m.engine) || S.mods[0]).id;
  S.mod = S.mods.some((m) => m.id === pref) ? pref : S.mods[0].id;
  $("#mod").value = S.mod;
  if (h.tool && TOOLS[h.tool]) S.tool = h.tool;
  for (const t of Object.values(TOOLS)) if (t.load) t.load(h);
  renderRail();
  $("#restart").onclick = async () => {
    await fetch(`/api/wb/${S.mod}/stop`, { method: "POST" });
    S.addonCache = {};
    for (const t of Object.values(TOOLS)) if (t.st) { t.st.detail = null; t.st.result = null; }
    await new Promise((r) => setTimeout(r, 1800));
    await TOOLS[S.tool].render($("#view"));
  };
  $("#reloadTools").onclick = async () => {
    S.addonCache = {};
    const r = await fetch(`/api/wb/${S.mod}/reload`, { method: "POST" }).then((r) => r.json());
    $("#binfo").textContent = r.error ? r.error : "tools reloaded";
    pollStatusSoon();
  };
  pollStatus();
  $("#view").classList.toggle("bleed", S.tool === "board");
  const view = TOOLS[S.tool].render($("#view"));
  if (h.x) {
    try {
      const x = JSON.parse(h.x);
      if (x) openExplorer(x.e ? { expr: x.e } : { ref: x.r }, x.p || []);
    } catch (_) {}
  }
  await view;
}
boot();
</script>
