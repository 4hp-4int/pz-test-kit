      const snap = await call("addonPanels", { ref: x.ref }).catch(() => null);
      if (!snap) return;
      const p = this.centerWorld();
      const c = this.newCard({ kind: "item", type: snap.fullType, ref: snap.ref, snap, steps: [], x: p.x, y: p.y });
      this.board().sel = c.id; this.save(); this.draw(); this.inspect();
    };
  },

  // ── blueprints ──
  toBlueprint(meta) {
    const b = this.board(), tid = (id) => { const c = this.card(id); return c ? (c.tid || c.id) : id; };
    const cards = b.cards.map((c) => {
      const o = { id: c.tid || c.id, kind: c.kind, x: Math.round(c.x), y: Math.round(c.y) };
      if (c.kind === "recipe") Object.assign(o, { recipe: c.recipe, label: c.label, inputs: c.inputs.map(tid), outputs: c.outputs.map(tid), ...(c.bench !== undefined ? { bench: c.bench } : {}) });
      else if (c.kind === "object") Object.assign(o, { label: c.label, expr: c.expr || null, from: c.from ? tid(c.from) : null, steps: c.steps || [] });
      else if (c.kind === "script") Object.assign(o, { stype: c.stype, name: c.name });
      else if (c.kind === "world") Object.assign(o, { wx: c.wx, wy: c.wy, wz: c.wz, label: c.label });
      else if (c.kind === "action") {
        const slots = {}, outMap = {};
        for (const [k, v] of Object.entries(c.slots || {})) if (v) slots[k] = tid(v);
        for (const [k, v] of Object.entries(c.outMap || {})) outMap[k] = tid(v);
        Object.assign(o, { addon: c.addon, action: c.action, label: c.label, slots, params: c.params || {}, mode: c.mode || "sp", outMap });
      }
      else Object.assign(o, { type: c.type }, (c.count || 1) > 1 ? { count: c.count } : {}, arr(c.steps).length ? { steps: c.steps } : {}, c.origin ? { origin: tid(c.origin) } : {});
      return o;
    });
    return { ...meta, rng: this.rng(), cards, expect: arr(b.expect).map((e) => ({ ...e, card: e.card && tid(e.card), recipe: e.recipe && tid(e.recipe), outputsOf: e.outputsOf && tid(e.outputsOf) })) };
  },
  async saveDialog() {
    const b = this.board();
    if (!b.cards.length) { this.say("Nothing to save yet."); return; }
    const lib = this.st.lib || await fetch(`/api/wb/${S.mod}/blueprints`).then((r) => r.json());
    const m = b.meta || {};
    const dlg = document.createElement("div");
    dlg.className = "modal";
    dlg.innerHTML = `<div class="mbox"><h3 style="margin-top:0">Save blueprint</h3>
      <label>name <input class="inp" id="mn" value="${esc(m.name || "")}" style="width:100%"></label>
      <label>description <textarea class="inp" id="md" rows="3" style="width:100%">${esc(m.description || "")}</textarea></label>
      <label>tags <input class="inp" id="mt" value="${esc(arr(m.tags).join(", "))}" placeholder="blacksmithing, blooded" style="width:100%"></label>
      <label>save to <select class="inp" id="mw">${arr(lib.targets).map((t) => `<option value="${t.key}">${esc(t.label)}${t.key === "mod" ? " (commit with the mod)" : ""}</option>`).join("")}</select></label>
      <div class="muted" style="font-size:11.5px;margin:4px 0">${arr(b.expect).length} expectation${arr(b.expect).length === 1 ? "" : "s"} included. Pin more from a card's inspector.</div>
      <div class="row" style="gap:6px;justify-content:flex-end"><button class="btn" id="mc">cancel</button><button class="btn primary" id="ms">save</button></div></div>`;
    document.body.appendChild(dlg);
    $("#mn", dlg).focus();
    $("#mw", dlg).value = m.source === "mod" ? "mod" : "local";
    $("#mc", dlg).onclick = () => dlg.remove();
    $("#ms", dlg).onclick = async () => {
      const meta = { name: $("#mn", dlg).value.trim(), description: $("#md", dlg).value.trim(), tags: $("#mt", dlg).value.split(",").map((s) => s.trim()).filter(Boolean) };
      if (!meta.name) { $("#mn", dlg).focus(); return; }
      const r = await fetch(`/api/wb/${S.mod}/blueprints`, { method: "POST", body: JSON.stringify({ target: $("#mw", dlg).value, blueprint: this.toBlueprint(meta) }) }).then((x) => x.json());
      dlg.remove();
      if (r.error) { this.say(r.error); return; }
      b.meta = { ...meta, source: $("#mw", dlg).value, id: r.id };
      this.save(); this.st.lib = null;
      this.say(`saved "${meta.name}"`);
      if (this.st.palTab === "lib") this.library();
    };
  },
  async loadBlueprint(bp, insert) {
    if (!insert && this.board().cards.length && !confirm(`Replace the board with "${bp.name}"?`)) return;
    if (!insert) { this.st.b = { ...this.emptyBoard(), mod: S.mod }; }
    const b = this.board(), map = new Map();
    const dx = insert && b.cards.length ? Math.max(...b.cards.map((c) => c.y)) + 160 : 0;
    for (const t of arr(bp.cards)) {
      const c = { ...JSON.parse(JSON.stringify(t)), tid: t.id };
      delete c.id;
      const nc = this.newCard(c);
      map.set(t.id, nc.id);
    }
    for (const t of arr(bp.cards)) {
      const c = this.card(map.get(t.id));
      if (c.kind === "recipe") { c.inputs = arr(t.inputs).map((i) => map.get(i)).filter(Boolean); c.outputs = arr(t.outputs).map((i) => map.get(i)).filter(Boolean); c.crafted = true; }
      if (c.kind === "action") {
        const def = (await this.actionCatalog()).find((x) => x.addon === c.addon && x.id === c.action);
        c.slotDefs = def ? def.slots : Object.keys(t.slots || {}).map((n) => ({ name: n, label: n }));
        c.paramDefs = def ? def.params : []; c.doc = def && def.doc; c.akind = def ? def.kind : "timed"; c.label = c.label || (def && def.label) || c.action;
        c.slots = {}; for (const [k, v] of Object.entries(t.slots || {})) c.slots[k] = map.get(v);
        c.outMap = {}; for (const [k, v] of Object.entries(t.outMap || {})) c.outMap[k] = map.get(v);
        c.outputs = Object.values(c.outMap).filter(Boolean);
        this.syncSlots(c); c.crafted = true;
      }
      if (c.origin) c.origin = map.get(c.origin);
      if (c.kind === "object" && c.from) c.from = map.get(c.from) || null;
    }
    const fresh = arr(bp.cards).map((t) => this.card(map.get(t.id)));
    if (fresh.some((c) => c.x == null)) this.layout(fresh);
    await Promise.all(fresh.filter((c) => c.kind === "recipe" && !c.label).map(async (c) => {
      const d = await call("recipe", { name: c.recipe }).catch(() => null);
      if (d) { c.label = d.label || d.name; c.lines = arr(d.inputs).map((i) => i.line || i.resource); }
    }));
    if (dx) for (const c of fresh) c.y += dx;
    b.expect = (insert ? arr(b.expect) : []).concat(arr(bp.expect).map((e) => ({ ...e, card: e.card && map.get(e.card), recipe: e.recipe && map.get(e.recipe), outputsOf: e.outputsOf && map.get(e.outputsOf) })));
    if (!insert) { b.meta = { name: bp.name, description: bp.description, tags: bp.tags, source: bp.source, id: bp.id }; b.rng = bp.rng ? { ...bp.rng } : { mode: "seeded", seed: 1 }; }
    b.sel = null;
    this.save(); this.draw(); this.fit(); this.inspect();
    await this.replay(true);
    const r = this.showExpect();
    if (r && bp.id) { this.st.libResults = { ...(this.st.libResults || {}), [bp.id]: r }; if (this.st.palTab === "lib") this.library(); }
  },
  // Columns by dependency depth: root items, recipe, its outputs, next recipe...
  layout(cards) {
    const by = new Map(cards.map((c) => [c.id, c])), depth = new Map();
    const recipes = cards.filter((c) => this.isProc(c));
    const rdepth = (r, seen = new Set()) => {
      if (depth.has(r.id)) return depth.get(r.id);
      if (seen.has(r.id)) return 1;
      seen.add(r.id);
      let d = 1;
      for (const i of r.inputs) { const c = by.get(i); if (c && c.origin && by.get(c.origin)) d = Math.max(d, rdepth(by.get(c.origin), seen) + 2); }
      depth.set(r.id, d);
      return d;
    };
    recipes.forEach((r) => rdepth(r));
    for (const r of recipes) for (const o of r.outputs) depth.set(o, depth.get(r.id) + 1);
    for (const c of cards) if (c.kind === "item" && !depth.has(c.id)) {
      const users = recipes.filter((r) => r.inputs.includes(c.id)).map((r) => depth.get(r.id));
      depth.set(c.id, users.length ? Math.min(...users) - 1 : 0);
    }
    const cols = new Map();
    for (const c of cards) { const d = depth.get(c.id) || 0; if (!cols.has(d)) cols.set(d, []); cols.get(d).push(c); }
    for (const [d, list] of cols) list.forEach((c, i) => { c.x = 40 + d * 280; c.y = 40 + i * (c.kind === "recipe" ? 150 : 96); });
  },
  // Evaluate the board's expectations; paint the toolbar and failing cards.
  showExpect() {
    const b = this.board(), el = $("#bexp");
    const list = arr(b.expect);
    if (!el) return null;
    if (!list.length) { el.innerHTML = ""; return null; }
    const badges = (c) => arr(c && c.snap && c.snap.badges).map((x) => x.text).join(" | ");
    const results = list.map((e) => {
      let ok = false, what = "";
      if (e.card) { const c = this.card(e.card), t = badges(c), n = (c && (c.snap && c.snap.name)) || (c && c.type) || "?";
        if (e.badge) { ok = t.includes(e.badge); what = `${n} has "${e.badge}"`; }
        if (e.noBadge) { ok = !t.includes(e.noBadge); what = `${n} has no "${e.noBadge}"`; }
        if (e.uses != null) { const u = c && c.snap && c.snap.uses; ok = u === e.uses; what = `${n} has ${e.uses} uses (got ${u == null ? "?" : u})`; }
        if (e.condition != null) { const u = c && c.snap && c.snap.condition; ok = u === e.condition; what = `${n} has condition ${e.condition} (got ${u == null ? "?" : u})`; } }
      if (e.outputsOf) { const r = this.card(e.outputsOf), outs = arr(r && r.outputs).map((id) => this.card(id));
        const n = outs.filter((c) => badges(c).includes(e.badge)).length; ok = n === e.count; what = `${e.count} output(s) of ${(r && (r.label || r.recipe)) || "?"} with "${e.badge}" (got ${n})`; }
      if (e.recipe && e.command) { const r = this.card(e.recipe); ok = !!(r && r.result && arr(r.result.commands).some((x) => x.command === e.command)); what = `${(r && (r.label || r.recipe)) || "?"} sends ${e.command}`; }
      else if (e.recipe && e.crafted != null) { const r = this.card(e.recipe), got = !!(r && r.result && r.result.ok); ok = got === e.crafted;
        what = `${(r && (r.label || r.recipe)) || "?"} ${e.crafted ? "crafts" : "is refused"}${r && r.result ? (got ? " (crafted)" : r.result.gated ? " (the game refused)" : " (refused)") : " (not run)"}`; }
      return { ok, what, card: e.card || e.outputsOf || e.recipe };
    });
    const pass = results.filter((r) => r.ok).length, fail = results.length - pass;
    const ran = b.cards.some((c) => this.isProc(c) && c.result);
    el.innerHTML = ran ? `<span class="bexp ${fail ? "bad" : "good"}" title="${esc(results.map((r) => (r.ok ? "✓ " : "✗ ") + r.what).join("\n"))}">${fail ? "✗" : "✓"} ${pass}/${results.length} expectations</span>`
      : `<span class="bexp" title="${esc(results.map((r) => "· " + r.what).join("\n"))}">${results.length} expectations (run to check)</span>`;
    for (const x of $$(".bc.expfail")) x.classList.remove("expfail");
    if (ran) for (const r of results) if (!r.ok && r.card) { const x = $(`.bc[data-id="${r.card}"]`); if (x) x.classList.add("expfail"); }
    this.st.lastExpect = results;
    return ran ? { pass, fail, total: results.length } : null;
  },

  // ── adding cards ──
  // First spot at or below (x, y) that overlaps no card, by each card's real
  // rendered height (world cards are taller than item cards). h = the new
  // card's expected height.
  freshSpot(x, y, h = 96) {
    const cards = this.board().cards;
    const hOf = (c) => { const el = $(`.bc[data-id="${c.id}"]`); return el ? el.offsetHeight : 96; };
    for (let i = 0; i < 200; i++) {
      const hit = cards.find((c) => Math.abs(c.x - x) < 240 && y < c.y + hOf(c) + 10 && c.y < y + h + 10);
      if (!hit) break;
      y = hit.y + hOf(hit) + 12;
    }
    return { x, y };
  },
  async add(kind, key, x, y, extra) {
    ({ x, y } = this.freshSpot(x, y));
    if (kind === "script") {
      const [stype, name] = key.split(/:(.*)/s);
      const c = this.newCard({ kind: "script", stype, name, x, y });
      this.board().sel = c.id; this.save(); this.draw(); this.inspect();
      return c;
    }
    if (kind === "action") {
      const [addon, id] = key.split("/");
      const def = (await this.actionCatalog()).find((a) => a.addon === addon && a.id === id);
      if (!def) { this.say("unknown action " + key); return null; }
      const params = {};
      for (const pd of arr(def.params)) params[pd.name] = pd.default;
      const c = this.newCard({ kind: "action", addon, action: id, label: def.label, doc: def.doc, akind: def.kind, slotDefs: def.slots, paramDefs: def.params,
                               params, slots: {}, inputs: [], outputs: [], outMap: {}, mode: "sp", x, y });
      this.board().sel = c.id;
      this.save(); this.draw(); this.inspect();
      return c;
    }
    const c = this.newCard(kind === "recipe" ? { kind, recipe: key, x, y, inputs: [], outputs: [] } : { kind, type: key, x, y, steps: [], ...(extra || {}) });
    this.board().sel = c.id;
    this.save(); this.draw(); this.inspect();
    if (kind === "recipe") {
      const d = await call("recipe", { name: key }).catch(() => null);
      if (d) { c.label = d.label || d.name; c.lines = arr(d.inputs).map((i) => i.line || i.resource); }
    } else if (!this.isStock(c)) {
      await this.instance(c);
    }
    this.save(); this.draw(); this.inspect();
    return c;
  },
  // Mint the live item and re-apply its recorded steps (root cards).
  async instance(c) {
    await this.applyRng(false);
    try {
      const r = await call("addonPanels", { type: c.type });
      c.ref = r.ref; c.snap = r; c.stale = false; c.consumed = false; c.err = null;
      await this.applySteps(c);
    } catch (e) { c.err = e.message; }
  },
  async applySteps(c) {
    for (const st of arr(c.steps)) {
      const r = await call("addonRun", { ref: c.ref, addon: st.addon, action: st.action, params: st.params || {} });
      if (!r.ok) { c.err = st.addon + "/" + st.action + ": " + r.err; break; }
      c.snap = r.item;
    }
  },
  async fill(r) {
    const plan = await call("craftPlan", { recipe: r.recipe }).catch((e) => { this.say(e.message); return null; });
    if (!plan) return;
    let i = 0;
    for (const p of arr(plan.items)) {
      const c = await this.add("item", p.type, r.x - 270, r.y + (i++) * 96 - 20, (p.count || 1) > 1 ? { count: p.count } : null);
      r.inputs.push(c.id);
    }
    if (arr(plan.notes).length) this.say(arr(plan.notes).join(" · "));
    this.board().sel = r.id;
    this.save(); this.draw(); this.inspect();
  },

  // ── recipe slots: consumed vs kept ──
  // Recipe definitions are cached per VM session (not saved with the board).
  rdef(r) {
    const st = this.st;
    st.rdefs = st.rdefs || {};
    if (st.rdefs[r.recipe] !== undefined) return st.rdefs[r.recipe];
    st.rdefs[r.recipe] = null;
    call("recipe", { name: r.recipe }).then((d) => { st.rdefs[r.recipe] = d; this.draw(); if (this.board().sel === r.id) this.inspect(); }).catch(() => {});
    return null;
  },
  // Match attached cards to recipe inputs: each card fills the first input
  // that accepts its type and still needs more. Returns rows (one per input)
  // + the cards that fit nothing.
  slotsOf(r) {
    const d = this.rdef(r);
    if (!d) return null;
    const rows = arr(d.inputs).map((inp) => ({ inp, role: inp.resource !== "Item" ? "other" : inp.keep ? "keep" : "use", cards: [], have: 0,
                                              need: Math.max(1, inp.itemsNeeded || inp.intAmount || Math.ceil(inp.amount || 1)), uses: inp.intAmount }));
    const extra = [];
    for (const id of r.inputs) {
      const c = this.card(id);
      if (!c) continue;
      const fits = rows.filter((row) => row.role !== "other" && (row.inp.anyItem || arr(row.inp.items).includes(c.type)));
      const row = fits.find((x) => x.have < x.need) || fits[0];
      if (!row) { extra.push(c); continue; }
      row.cards.push(c);
      row.have += this.isStock(c) ? (c.count || 1) : 1;
    }
    return { rows, extra };
  },
  roleOf(r, cardId) {
    const sl = this.slotsOf(r);
    const row = sl && sl.rows.find((x) => x.cards.some((c) => c.id === cardId));
    return row ? row.role : null;
  },
  roleChip(role) { return `<span class="role ${role}" title="${role === "keep" ? "kept: a tool, comes back after the craft" : role === "use" ? "consumed by the craft" : "not an item input"}">${role === "keep" ? "KEEP" : role === "use" ? "USE" : "—"}</span>`; },
  shortType(t) { return String(t || "").replace(/^Base\./, ""); },

  // ── crafting ──
  ready(c) { return this.isStock(c) ? !c.consumed : (c.ref && !c.consumed && !c.stale); },
  async craft(r, replaying) {
    if (!replaying) await this.applyRng(false);
    if (r.kind === "action") return this.runAction(r, replaying);
    const ins = r.inputs.map((id) => this.card(id)).filter(Boolean);
    if (!ins.length) { this.say("Attach inputs first: drag item cards onto the recipe, or fill inputs."); return; }
    if (!replaying && ins.some((c) => !this.ready(c))) { this.say("Inputs were used up by an earlier craft: re-running the board.", true); await this.replay(false, r.id); return; }
    this.say("crafting " + (r.label || r.recipe) + "…", true);
    let res;
    // Pin each card to the input slot the board shows it in, so the engine
    // fills exactly those (vanilla's manual-select path).
    if (!this.st.rdefs || !this.st.rdefs[r.recipe]) {
      const d = await call("recipe", { name: r.recipe }).catch(() => null);
      (this.st.rdefs = this.st.rdefs || {})[r.recipe] = d;
    }
    const sl = this.slotsOf(r), slotOf = new Map();
    if (sl && !sl.extra.length) for (const row of sl.rows) for (const k of row.cards) slotOf.set(k.id, row.inp.index);
    const specs = ins.map((c) => ({ ...(this.isStock(c) ? { type: c.type, count: c.count, steps: c.steps } : { ref: c.ref, type: c.type }), input: slotOf.get(c.id) }));
    try { res = await call("craft", { recipe: r.recipe, items: specs, qualify: true, mode: "action", monitor: !!r.monitor, bench: r.bench, enforce: true }); }
    catch (e) { r.result = { ok: false, err: e.message }; this.say(""); this.save(); this.draw(); this.inspect(); return; }
    const byRef = (list) => new Map(arr(list).map((i) => [i.ref, i]));
    const consumed = byRef(res.consumed), kept = byRef(res.kept);
    for (const c of ins) {
      if (this.isStock(c)) { if (res.ok) c.consumed = true; continue; }
      if (consumed.has(c.ref)) { c.consumed = true; c.before = consumed.get(c.ref).panelsBefore; }
      if (kept.has(c.ref)) c.snap = { ...c.snap, ...kept.get(c.ref) };
    }
    // Map outputs onto the recipe's existing output cards by TYPE, then by
    // order: a blueprint's expected cards (and their downstream wires, post-
    // steps and positions) survive, whatever order the engine returns.
    const old = r.outputs.map((id) => this.card(id)).filter(Boolean), outs = arr(res.outputs), used = new Set();
    r.outputs = [];
    outs.forEach((o, i) => {
      let c = old.find((x) => !used.has(x.id) && x.type === o.fullType) || old.find((x) => !used.has(x.id) && !x.type);
      if (!c) { const p = this.freshSpot(r.x + 300, r.y + i * 104 - 20); c = this.newCard({ kind: "item", x: p.x, y: p.y, steps: [], origin: r.id }); }
      used.add(c.id);
      Object.assign(c, { type: o.fullType, ref: o.ref, snap: o, consumed: false, stale: false, err: null, origin: r.id, onFloor: !!o.onFloor });
      r.outputs.push(c.id);
    });
    for (const c of old) if (!used.has(c.id)) { c.ref = null; c.snap = null; c.stale = true; r.outputs.push(c.id); c.err = "not produced this time"; }
    for (const id of r.outputs) { const c = this.card(id); if (c.ref && arr(c.steps).length) await this.applySteps(c); }
    r.result = { ok: res.ok, ran: res.ran, err: res.err, why: res.why, commands: res.commands, hooks: res.hooks, monitor: res.monitor,
                 ms: res.ms, initErrors: res.initErrors, hooked: res.hooked, out: res._out,
                 canPerform: res.canPerform, gated: res.gated, needsWorkstation: res.needsWorkstation, atWorkstation: res.atWorkstation, workstation: res.workstation };
    r.crafted = true;
    if (!replaying) { this.board().sel = r.id; this.say(res.ok ? `✓ ${r.label || r.recipe}: ${outs.length} output${outs.length === 1 ? "" : "s"}` : `✗ ${r.label || r.recipe} refused`); }
    this.save(); this.draw(); this.inspect(); this.showExpect();
  },
  // Board action: slot items in, "after" cards out (the same live objects,
  // changed), plus anything the action created. Input cards dim: their state
  // is now the after card's.
  async runAction(a, replaying) {
    const missing = arr(a.slotDefs).filter((s) => !a.slots[s.name]);
    if (missing.length) { this.say(`Fill the slot${missing.length > 1 ? "s" : ""} first: ${missing.map((s) => s.label).join(", ")} (drop an item card on the action)`); return; }
    const ins = a.inputs.map((id) => this.card(id)).filter(Boolean);
    if (!replaying && ins.some((c) => !this.ready(c))) { this.say("Inputs were changed or used by an earlier step: re-running the board.", true); await this.replay(false, a.id); return; }
    this.say(`${a.label} (${a.mode === "mp" ? "MP: client + server" : "SP"})…`, true);
    const slots = {};
    for (const [k, v] of Object.entries(a.slots)) { const c = this.card(v); if (c) slots[k] = c.ref; }
    let res;
    try { res = await call("boardActionRun", { addon: a.addon, action: a.action, slots, params: a.params || {}, mode: a.mode || "sp" }); }
    catch (e) { a.result = { ok: false, err: e.message }; this.say(""); this.save(); this.draw(); this.inspect(); return; }
    const outKey = [];
    const place = (key, info, i) => {
      let c = a.outMap[key] && this.card(a.outMap[key]);
      if (!c) { const p = this.freshSpot(a.x + 300, a.y + i * 104 - 20); c = this.newCard({ kind: "item", x: p.x, y: p.y, steps: [], origin: a.id }); a.outMap[key] = c.id; }
      Object.assign(c, { type: info.fullType, ref: info.ref, snap: info, origin: a.id, stale: false, err: null, consumed: !!info.gone, gone: !!info.gone, before: info.panelsBefore,
                         unchanged: key.startsWith("slot:") && info.changed === false });
      outKey.push(c.id);
    };
    let i = 0;
    for (const s of arr(a.slotDefs)) {
      const info = res.slots && res.slots[s.name];
      const inCard = this.card(a.slots[s.name]);
      if (!info || !inCard) continue;
      inCard.consumed = true; inCard.changedBy = a.id;
      place("slot:" + s.name, info, i++);
    }
    arr(res.created).forEach((info, k) => place("new:" + k, info, i++));
    for (const [k, id] of Object.entries(a.outMap)) if (!outKey.includes(id)) { const c = this.card(id); if (c) { c.stale = true; c.ref = null; c.err = "not produced this time"; } }
    a.outputs = Object.values(a.outMap).filter(Boolean);
    const r0 = res.result || {};
    const changedAny = Object.values(res.slots || {}).some((x) => x.changed) || arr(res.created).length > 0;
    a.result = { ok: res.ok, err: res.err, steps: r0.steps, valid: r0.valid, commands: res.commands, log: res.log, mode: res.mode, noChange: res.ok && !changedAny,
                 handlerCount: r0.listeners, handlerErrors: r0.errors, out: res._out };
    a.crafted = true;
    if (!replaying) { this.board().sel = a.id; this.say(res.ok ? `✓ ${a.label}` : `✗ ${a.label}`); }
    this.save(); this.draw(); this.inspect(); this.showExpect();
  },
  // Rebuild every live object: root items (+steps), then each recipe once all
  // its inputs exist, in dependency order. all=true runs every recipe.
  async replay(all, thenCraftId) {
    const b = this.board();
    this.say("running…", true);
    await this.applyRng(true);
    for (const c of b.cards) if (c.kind === "item") { c.ref = c.origin ? null : c.ref; c.consumed = false; c.changedBy = null; c.gone = false; c.unchanged = false; c.stale = false; if (c.origin) c.snap = null; }
    for (const c of b.cards) if (c.kind === "item" && !c.origin && !this.isStock(c)) await this.instance(c);
    this.draw();
    const todo = b.cards.filter((c) => this.isProc(c) && (all || c.crafted || c.id === thenCraftId));
    let progressed = true;
    while (todo.length && progressed) {
      progressed = false;
      for (let i = 0; i < todo.length; i++) {
        const r = todo[i], ins = r.inputs.map((id) => this.card(id)).filter(Boolean);
        if (ins.length && ins.every((c) => this.ready(c))) { todo.splice(i--, 1); await this.craft(r, true); progressed = true; }
      }
    }
    const fails = b.cards.filter((c) => this.isProc(c) && c.result && !c.result.ok).length;
    if (this.rng().mode === "random" && this.st.lastSeed) this.say(`(random seed ${this.st.lastSeed}: set mode to seeded + this seed to replay these rolls)`);
    this.say(todo.length ? `${todo.length} recipe(s) couldn't run (inputs missing or used twice)` : fails ? `${fails} recipe(s) refused` : "all recipes ran");
    this.save(); this.draw(); this.inspect();
    return this.showExpect();
  },
  remove(id, quiet) {
    const b = this.board();
    b.cards = b.cards.filter((c) => c.id !== id);
    for (const c of b.cards) if (this.isProc(c)) {
      c.inputs = c.inputs.filter((x) => x !== id); c.outputs = c.outputs.filter((x) => x !== id);
      if (c.slots) for (const k of Object.keys(c.slots)) if (c.slots[k] === id) delete c.slots[k];
      if (c.outMap) for (const k of Object.keys(c.outMap)) if (c.outMap[k] === id) delete c.outMap[k];
    }
    for (const c of b.cards) { if (c.origin === id) c.origin = null; if (c.from === id) { c.rootRef = c.rootRef || c.ref; c.from = null; } if (c.linkFrom === id) c.linkFrom = null; }
    b.expect = arr(b.expect).filter((e) => e.card !== id && e.recipe !== id && e.outputsOf !== id);
    if (b.sel === id) b.sel = null;
    if (!quiet) { this.save(); this.draw(); this.inspect(); this.showExpect(); }
  },

  // ── drawing (deferred while a drag is in progress) ──
  draw() {
    if (this.drag) { this.pendingDraw = true; return; }
    const b = this.board(), el = $("#bcards");
    if (!el) return;
    const badges = (c) => arr(c.snap && c.snap.badges).map((x) => `<div class="bb ${esc(x.tone || "")}">${esc(x.text)}</div>`).join("");
    el.innerHTML = b.cards.map((c) => {
      const cls = `bc ${c.kind} ${b.sel === c.id ? "sel" : ""} ${c.consumed ? "gone" : ""} ${c.stale ? "stale" : ""}`;
      if (c.kind === "world") {
        const objs = arr(c.info && c.info.objects);
        return `<div class="${cls}" data-id="${c.id}" style="left:${c.x}px;top:${c.y}px"><canvas width="128" height="160" data-wsq="${c.id}"></canvas>
          <div class="bch">▦ ${esc(c.label)}</div><div class="bcs">${esc(c.info ? (c.info.room ? "room: " + c.info.room : c.info.outside ? "outside" : "no room") : c.err ? "error" : "loading…")}</div>
          <div>${objs.slice(0, 6).map((o) => `<span class="wchip ${o.entity ? "ent" : ""}" title="${esc(o.sprite || "")}">${esc(o.entity || String(o.sprite || o.class || "").replace(/_\d+$/, ""))}</span>`).join("")}${objs.length > 6 ? `<span class="wchip">+${objs.length - 6}</span>` : ""}</div>
          ${c.err ? `<div class="bres fail" title="${esc(c.err)}">${esc(c.err.slice(0, 40))}</div>` : ""}</div>`;
      }
      if (c.kind === "object") {
        return `<div class="${cls}" data-id="${c.id}" style="left:${c.x}px;top:${c.y}px">
          <div class="bch">◎ ${esc(c.label)}</div><div class="bcs">${esc(c.cls || (c.expr ? "expression" : "object"))}</div>
          ${c.str ? `<div class="bslot">${esc(c.str)}</div>` : ""}${!c.expr && !c.from ? `<div class="bres dim">live ref: this VM only</div>` : ""}</div>`;
      }
      if (c.kind === "script") {
        const tl = (arr(this.st.scrTypes).find((t) => t.id === c.stype) || {}).label || c.stype;
        return `<div class="${cls}" data-id="${c.id}" style="left:${c.x}px;top:${c.y}px"><div class="bch">≡ ${esc(String(c.name).replace(/^Base\./, ""))}</div><div class="bcs">${esc(tl)}</div></div>`;
      }
      if (c.kind === "action") {
        const r = c.result, hooks = arr(r && r.steps), bad = hooks.filter((h) => !h.ok).length;
        return `<div class="${cls}" data-id="${c.id}" style="left:${c.x}px;top:${c.y}px">
          <div class="bch">⚡ ${esc(c.label)}</div>
          <div class="bcs">${esc(c.addon)} · ${esc(c.akind || "timed")}</div>
          ${arr(c.slotDefs).map((s) => { const it = this.card(c.slots[s.name]); return `<div class="bslot">${esc(s.label)}: <b>${it ? esc((it.snap && it.snap.name) || it.type) : "—"}</b></div>`; }).join("")}
          <div class="row" style="gap:4px;margin-top:5px"><button class="btn small primary" data-craft>▶ Run</button>
            ${c.akind === "timed" ? `<span class="bmode ${c.mode === "mp" ? "mp" : ""}" data-mode title="SP: one machine runs perform then complete. MP: client runs perform only; the server runs serverStart + complete">${c.mode === "mp" ? "MP" : "SP"}</span>` : `<span class="bmode" title="client -> server command">cmd</span>`}</div>
          ${r ? `<div class="bres ${r.noChange ? "warn" : r.ok && !bad ? "pass" : "fail"}">${r.noChange ? "◌ ran, nothing changed" : r.ok && !bad ? "✓ ran" : r.ok ? `✗ ${bad} hook${bad > 1 ? "s" : ""} threw` : "✗ failed"}${hooks.length ? ` <span class="dim">${hooks.length} hooks</span>` : ""}${arr(r.commands).length ? ` <span class="acc">· ${arr(r.commands).map((x) => esc(x.command)).join(", ")}</span>` : ""}</div>` : ""}
        </div>`;
      }
      if (c.kind === "recipe") {
        const r = c.result;
        return `<div class="${cls}" data-id="${c.id}" style="left:${c.x}px;top:${c.y}px">
          <div class="bch">⚒ ${esc(c.label || c.recipe)}</div>
          <div class="bcs">${esc(c.recipe)}</div>
          ${(() => {
            const sl = this.slotsOf(c);
            if (!sl) return `<div class="bslot">${c.inputs.length} input${c.inputs.length === 1 ? "" : "s"} attached</div>`;
            const rows = sl.rows.filter((x) => x.role !== "other");
            const line = (x) => {
              const got = x.cards.map((k) => esc(((k.snap && k.snap.name) || this.shortType(k.type)) + (this.isStock(k) && k.count > 1 ? " ×" + k.count : ""))).join(", ");
              const want = arr(x.inp.items).length === 1 ? this.shortType(x.inp.items[0]) : arr(x.inp.items).length + " kinds";
              return `<div class="rslot">${this.roleChip(x.role)}${got && x.have >= x.need ? `<b>${got}</b>` : `<span class="miss">${got ? got + " · " : ""}needs ${esc(want)}${x.need > 1 ? " ×" + (x.need - x.have) : ""}</span>`}</div>`;
            };
            return rows.slice(0, 6).map(line).join("") + (rows.length > 6 ? `<div class="bslot">+${rows.length - 6} more inputs</div>` : "")
              + (sl.extra.length ? `<div class="rslot"><span class="role other">??</span><span class="miss">${sl.extra.length} card${sl.extra.length > 1 ? "s" : ""} fit no input</span></div>` : "");
          })()}
          <div class="row" style="gap:4px;margin-top:5px"><button class="btn small primary" data-craft>▶ Craft</button>${c.inputs.length ? "" : `<button class="btn small" data-fill>fill inputs</button>`}</div>
          ${r && r.needsWorkstation ? `<div class="bslot" title="${esc((r.workstation && r.workstation.sprite) || "")}">⌂ ${r.atWorkstation ? `<b>${esc(String((r.workstation && r.workstation.name) || "").replace(/^Base\./, ""))}</b>` : `<span class="miss">needs a workstation</span>`}</div>` : ""}
          ${r ? `<div class="bres ${r.ok ? "pass" : "fail"}">${r.ok ? "✓ crafted" : r.gated ? "✗ the game would refuse" : r.ran ? "✗ refused" : "✗ threw"}${r.ms != null ? ` <span class="dim">${r.ms.toFixed(1)}ms</span>` : ""}${arr(r.commands).length ? ` <span class="acc">· ${arr(r.commands).map((x) => esc(x.command)).join(", ")}</span>` : ""}</div>` : ""}
        </div>`;
      }
      const name = (c.snap && c.snap.name) || c.type || "(output)";
      const vis = c.snap && c.snap.visual;
      const thumb = vis && vis.model ? `<img class="bthumb" loading="lazy" draggable="false" alt="" src="/api/wb/${encodeURIComponent(S.mod)}/model?ref=${encodeURIComponent(vis.model)}&fmt=png" onerror="this.remove()"${vis.glow ? ` style="filter: drop-shadow(0 0 5px ${esc(vis.glow)})"` : ""}>` : "";
      return `<div class="${cls}" data-id="${c.id}" style="left:${c.x}px;top:${c.y}px">${thumb}
        <div class="bch">◇ ${esc(name)}${this.isStock(c) ? ` <span class="acc">×${c.count}</span>` : ""}</div><div class="bcs">${esc(c.type || "")}${arr(c.steps).length ? ` · ${c.steps.length} step${c.steps.length === 1 ? "" : "s"}` : ""}</div>
        ${badges(c)}${c.unchanged ? `<div class="bres warn">unchanged by ${esc((this.card(c.origin) || {}).label || "the action")}</div>` : ""}${c.consumed ? `<div class="bres dim">${c.changedBy ? "→ after card holds its new state" : c.gone ? "gone (inside / used up)" : "consumed"}</div>` : ""}${c.onFloor && !c.consumed ? `<div class="bres dim" title="too heavy to carry: vanilla addOrDropItem put it on the ground">⤓ dropped at your feet</div>` : ""}${c.stale && !c.err ? `<div class="bres warn">stale: run all</div>` : ""}${c.err ? `<div class="bres fail" title="${esc(c.err)}">${esc(c.err.length > 34 ? "error" : c.err)}</div>` : ""}
      </div>`;
    }).join("");
    for (const cv of $$("[data-wsq]", el)) {
      const c = this.card(cv.dataset.wsq);
      if (!c) continue;
      // Restored (storage, blueprint): fetch the square, then its sprite pages.
      if (!c.info && !c.err) { const L = (this._wloading = this._wloading || new Set()); if (!L.has(c.id)) { L.add(c.id); this.refreshWorld(c).finally(() => L.delete(c.id)); } continue; }
      const names = arr(c.info && c.info.objects).map((o) => o.sprite).filter(Boolean);
      const sp = this.st.sprites || {};
      if (names.some((n) => !(n in sp))) { if (!this._spriteFetch) this._spriteFetch = this.ensureSprites(names).then(() => { this._spriteFetch = null; this.draw(); }); continue; }
      this.paintSquare(cv, names);
    }
    for (const btn of $$("[data-craft]", el)) btn.onclick = (e) => { e.stopPropagation(); this.craft(this.card(btn.closest(".bc").dataset.id)); };
    for (const btn of $$("[data-fill]", el)) btn.onclick = (e) => { e.stopPropagation(); this.fill(this.card(btn.closest(".bc").dataset.id)); };
    for (const m of $$("[data-mode]", el)) m.onclick = (e) => { e.stopPropagation(); const c = this.card(m.closest(".bc").dataset.id); c.mode = c.mode === "mp" ? "sp" : "mp"; this.save(); this.draw(); if (this.board().sel === c.id) this.inspect(); };
    this.applyView();
    this.wires();
    if (this.st.lastExpect) this.showExpect();
    const empty = $("#bempty");
    empty.style.display = b.cards.length ? "none" : "flex";
    if (!b.cards.length) {
      empty.innerHTML = `<div><b>Empty board.</b><br>Open the <b>Library</b> for ready-made blueprints, or find items, recipes, actions and scripts on the left.<br>Explore any object as cards (click a value chip), or run Lua in the <b>console</b> below.</div>`;
    }
  },
  wires() {
    const b = this.board(), svg = $("#bwires");
    if (!svg) return;
    const box = (id) => { const el = $(`.bc[data-id="${id}"]`); return el && { x: el.offsetLeft, y: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight }; };
    const soul = (c) => c && (arr(c.snap && c.snap.badges).some((x) => x.tone === "accent") || arr(c.before).some((p) => p.addon === "vps" && p.data && p.data.blooded));
    const path = (a, z, cls) => {
      const x1 = a.x + a.w, y1 = a.y + Math.min(a.h / 2, 28), x2 = z.x, y2 = z.y + Math.min(z.h / 2, 28), dx = Math.max(40, Math.abs(x2 - x1) / 2);
      return `<path class="${cls}" d="M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}"/>`;
    };
    let h = "";
    for (const r of b.cards.filter((c) => this.isProc(c))) {
      const rb = box(r.id);
      if (!rb) continue;
      for (const id of r.inputs) {
        const c = this.card(id), cb = box(id), role = r.kind === "recipe" ? this.roleOf(r, id) : null;
        if (cb) h += path(cb, rb, "w in" + (role ? " " + role : "") + (soul(c) ? " soul" : "") + (c && c.consumed ? " used" : ""));
      }
      for (const id of r.outputs) { const c = this.card(id), cb = box(id); if (cb) h += path(rb, cb, "w out" + (soul(c) ? " soul" : "")); }
    }
    for (const it of b.cards.filter((c) => c.kind === "item" && c.fromWorld)) {
      const wb = box(it.fromWorld), ib = box(it.id);
      if (wb && ib) h += path(wb, ib, "w out");
    }
    // Explore edges: source card -> object card, labelled with the path step.
    for (const o of b.cards.filter((c) => c.kind === "object" && (c.from || c.linkFrom))) {
      const fb = box(o.from || o.linkFrom), ob = box(o.id);
      if (!fb || !ob) continue;
      h += path(fb, ob, "w obj");
      const lbl = o.steps.length ? o.steps.map((st) => st.startsWith("#") ? "[" + st.slice(1) + "]" : st.startsWith(".") ? st : ":" + st + "()").join("") : o.from ? "explore" : "ref";
      h += `<text class="wl" x="${(fb.x + fb.w + ob.x) / 2}" y="${(fb.y + Math.min(fb.h / 2, 28) + ob.y + Math.min(ob.h / 2, 28)) / 2 - 4}" text-anchor="middle">${esc(lbl)}</text>`;
    }
    svg.innerHTML = h;
  },
  applyView() {
    const v = this.board().view, w = $("#bworld"), can = $("#bcan");
    if (!w) return;
    w.style.transform = `translate(${v.x}px,${v.y}px) scale(${v.z})`;

  // ── pointer: pan, zoom, drag, drop-to-attach ──
  // Pointer capture keeps the gesture even when the cursor leaves the canvas;
  // moves are applied once per animation frame; the card element is looked up
  // fresh each frame (a re-render can't strand a drag on a detached node).
  bindCanvas() {
    const can = $("#bcan"), self = this;
    can.onwheel = (e) => {
      if (e.target.closest(".bdock")) return;   // the dock scrolls itself
      e.preventDefault();
      const v = self.board().view, r = can.getBoundingClientRect();
      if (!e.ctrlKey && Math.abs(e.deltaX) > Math.abs(e.deltaY)) { v.x -= e.deltaX; self.applyView(); return; }   // trackpad sideways = pan
      const mx = e.clientX - r.left, my = e.clientY - r.top;
      const z2 = Math.max(0.25, Math.min(2, v.z * Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0018))));
      v.x = mx - (mx - v.x) * (z2 / v.z); v.y = my - (my - v.y) * (z2 / v.z); v.z = z2;
      self.applyView(); clearTimeout(self._zt); self._zt = setTimeout(() => self.save(), 300);
    };

      if (e.target.closest("button, input, select, textarea, .bbar, .bdock")) return;

      const pan = e.button === 1 || (e.button === 0 && (self.space || !cardEl));

      can.setPointerCapture(e.pointerId);

      self.drag = { id: c && c.id };
      if (pan) can.classList.add("panning");
      const frame = () => {
        raf = 0;
        const dxs = last.clientX - sx, dys = last.clientY - sy;
        if (Math.abs(dxs) + Math.abs(dys) > 3) moved = true;
        if (pan) { v.x = ox + dxs; v.y = oy + dys; self.applyView(); return; }
        c.x = Math.round(ox + dxs / v.z); c.y = Math.round(oy + dys / v.z);
        const el = $(`.bc[data-id="${c.id}"]`);
        if (el) { el.style.left = c.x + "px"; el.style.top = c.y + "px"; el.classList.add("dragging"); }
        self.wires();
        for (const t of $$(".bc.recipe, .bc.action")) t.classList.toggle("drop", c.kind === "item" && t.dataset.id !== c.id && hit(t, last));
      };
      const move = (ev) => { last = ev; if (!raf) raf = requestAnimationFrame(frame); };
      const up = (ev) => {
        can.removeEventListener("pointermove", move); can.removeEventListener("pointerup", up); can.removeEventListener("pointercancel", up);
        if (raf) { cancelAnimationFrame(raf); frame(); }

        self.drag = null;
        for (const t of $$(".bc.drop, .bc.dragging")) t.classList.remove("drop", "dragging");
        if (pan) { if (!moved && !cardEl && b.sel) self.select(null); self.save(); if (self.pendingDraw) { self.pendingDraw = false; self.draw(); } return; }
        if (!moved) { self.select(c.id); if (self.pendingDraw) { self.pendingDraw = false; self.draw(); } return; }
        const target = c.kind === "item" && $$(".bc.recipe, .bc.action").find((t) => t.dataset.id !== c.id && hit(t, ev));
        if (target && self.card(target.dataset.id).kind === "action") {
          const a = self.card(target.dataset.id);
          c.x = ox; c.y = oy;
          self.attachToAction(a, c);
          self.save();
          return;
        }
        if (target) {
          const r = self.card(target.dataset.id);
          if (!r.inputs.includes(c.id)) r.inputs.push(c.id);
          c.x = ox; c.y = oy;
          self.say(`attached ${(c.snap && c.snap.name) || c.type} → ${r.label || r.recipe}`);
          b.sel = r.id; self.pendingDraw = true; self.inspect();

    };

    can.ondrop = (e) => {
      const raw = e.dataTransfer.getData("text/wb-add");

    };
    function hit(el, ev) { const r = el.getBoundingClientRect(); return ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom; }
    if (!self._keys) {
      self._keys = true;
      document.addEventListener("keydown", (e) => {
        if (S.tool !== "board" || e.target.closest("input, textarea, select")) return;
        if (e.code === "Space") { self.space = true; const c = $("#bcan"); if (c) c.classList.add("spacepan"); e.preventDefault(); }

      document.addEventListener("keyup", (e) => { if (e.code === "Space") { self.space = false; const c = $("#bcan"); if (c) c.classList.remove("spacepan"); } });
    }
  },

          <label>speed <select class="inp" data-v="speed">${[1, 4, 8, 32, 0].map((s) => `<option value="${s}" ${+V.speed === s ? "selected" : ""}>${s ? s + "×" : "instant"}</option>`).join("")}</select></label>

        return head + `<div class="li" data-vid="${esc(t.id)}" style="padding:2px 6px;cursor:pointer;${V.id === t.id ? "background:rgba(217,164,65,.18)" : ""}"><span class="t">${esc(t.title)}</span>${t.subtitle ? ` <span class="dim">· ${esc(t.subtitle)}</span>` : ""} <span class="s dim" style="font-size:10.5px">${t.lines} lines${t.author ? " · " + esc(t.author) : ""} · <span class="mono">${esc(t.id.length > 28 ? t.id.slice(0, 8) + "…" : t.id)}</span></span></div>`;

  // PZ chat markup: [col=r,g,b]..[/], [img=music], [br/]
  vhsMarkup(s) {
    let open = 0;
    let h = esc(s).replace(/\[col=(\d+),(\d+),(\d+)\]/g, (_, r, g, b) => { open++; return `<span style="color:rgb(${r},${g},${b})">`; })
      .replace(/\[\/\]/g, () => { if (!open) return ""; open--; return "</span>"; })
      .replace(/\[img=music\]/g, "♪").replace(/\[br\/\]/g, " ");
    return h + "</span>".repeat(open);
  },
  async vhsPlay(V) {
    const out = $("#vout");
    if (!out) return;
    const token = (this.st.vhsToken = (this.st.vhsToken || 0) + 1);
    out.innerHTML = `<div class="dim" style="font-size:12px;margin-top:6px"><span class="spin"></span> playing the tape in the engine…</div>`;
    let r;
    try {
      r = await call("vhsPlay", { id: V.id, tv: V.tv ? V.tv.ref : undefined, dx: V.dx, dy: V.dy, dz: V.dz, volume: V.tv ? V.volume : undefined, forget: V.forget, asleep: V.asleep });
    } catch (e) { out.innerHTML = `<pre class="fail">${esc(e.message)}</pre>`; return; }
    if (token !== this.st.vhsToken || !out.isConnected) return;
    const s = r.source || {};
    const errs = new Map();
    for (const l of arr(r.lines)) for (const e of arr(l.errors)) errs.set(e, (errs.get(e) || 0) + 1);
    const num = (v) => typeof v === "number" ? (Math.abs(v) >= 100 ? v.toFixed(0) : v.toFixed(3).replace(/\.?0+$/, "")) : v;
    const chip = (c) => c.kind === "stat" ? `<span class="${c.to > c.from ? "dn" : "up"}">${esc(c.key.toLowerCase())} ${num(c.from)}→${num(c.to)}</span>`
      : c.kind === "xp" ? `<span class="up">+${num(c.to - c.from)} ${esc(c.key)} xp</span>`
      : c.kind === "recipe" ? `<span class="up">learned ${esc(c.key)}</span>`
      : `<span class="md" title="${esc(c.key)}: ${esc(c.from ?? "∅")} → ${esc(c.to ?? "∅")}">modData ${esc(c.key.split(".").slice(-2).join("."))}</span>`;
    const fx = (l) => {
      const parts = [...arr(l.halos).map((h) => `<span class="${h.up === false ? "dn" : "up"}">${h.up === false ? "↓" : h.up ? "↑" : "✦"} ${esc(h.text)}</span>`),
        ...arr(l.changes).filter((c) => c.kind !== "modData" || !arr(l.halos).length).map(chip),
        ...arr(l.commands).map((c) => `<span class="md">→ ${esc(c.module)}/${esc(c.command)}</span>`)];
      const meta = `<span style="border:none;color:#5d6a5d;padding:0">${esc(l.codes)}${l.heardBefore ? " · heard before" : ""}</span>`;
      return `<div class="fx">${parts.join("")}${meta}</div>`;
    };
    const mmss = (t) => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, "0")}`;
    out.innerHTML = `<div style="margin:8px 0 4px"><b>${esc(r.title)}</b>${r.subtitle ? ` <span class="dim">· ${esc(r.subtitle)}</span>` : ""}${r.author ? ` <span class="dim">· ${esc(r.author)}</span>` : ""} <span class="dim mono" style="font-size:11px">${esc(r.category)} · ${r.played}/${r.lineCount} lines · ${mmss(r.seconds)} at 1×</span></div>
      <div class="dim" style="font-size:11px;margin-bottom:4px">${esc(s.kind || "")}${s.x != null ? ` at ${s.x},${s.y},${s.z} · listener ${s.listener.x},${s.listener.y},${s.listener.z} · ${s.inVanillaBox ? `<span class="pass">inside</span>` : `<span class="warn">outside</span>`} vanilla's 5-tile box${s.volumeRange != null ? ` · volume range ${s.volumeRange}` : ""}${s.sameSide === false ? ` · <span class="warn">other side of a wall</span>` : ""}` : ""}
        · ${r.listeners} OnDeviceText listener(s)${arr(r.modules).map((m) => ` · ${esc(m.module)}${m.ok ? "" : ` <span class="fail">failed: ${esc(m.err)}</span>`}`).join("")}</div>
      ${errs.size ? `<div class="warn" style="font-size:11.5px;margin-bottom:4px">${[...errs].map(([e, n]) => `⚠ ${n} line(s): ${esc(e)}`).join("<br>")}${[...errs.keys()].some((e) => /CharacterStat, got String/.test(e)) ? `<div class="dim">This VM booted before the kit's CharacterStat fix: restart it and vanilla's stat codes apply.</div>` : ""}</div>` : ""}
      <div class="crt" id="vcrt"></div>
      <h3>Over the whole tape</h3>
      <div style="font-size:12px">${arr(r.totals).map((c) => `<div>${c.kind === "stat" ? `${esc(c.key.toLowerCase())} <span class="mono">${num(c.from)} → ${num(c.to)}</span>` : c.kind === "xp" ? `<span class="pass">+${num(c.to - (c.from || 0))}</span> ${esc(c.key)} xp` : c.kind === "recipe" ? `learned <b>${esc(c.key)}</b>` : `<span class="mono dim">${esc(c.key)}</span> = <span class="mono">${esc(c.to ?? "∅")}</span>`}</div>`).join("") || `<div class="dim">nothing changed for this listener${V.forget ? "" : " (lines already heard? tick fresh ears)"}</div>`}</div>`;
    const crt = $("#vcrt");
    const lines = arr(r.lines);
    const show = (l) => {
      const d = document.createElement("div");
      d.innerHTML = `<div class="ln" style="color:rgb(${Math.round(l.r * 255)},${Math.round(l.g * 255)},${Math.round(l.b * 255)})"><span class="t">${mmss(l.at)}</span>${this.vhsMarkup(l.text)}</div>${l.codes && (arr(l.halos).length || arr(l.changes).length || arr(l.commands).length || l.heardBefore) ? fx(l) : ""}`;
      crt.appendChild(d);
      crt.scrollTop = crt.scrollHeight;
    };
    if (!+V.speed) { lines.forEach(show); return; }
    const t0 = performance.now();
    let i = 0;
    const step = () => {
      if (token !== this.st.vhsToken || !crt.isConnected) return;
      const now = (performance.now() - t0) / 1000 * V.speed;
      while (i < lines.length && lines[i].at <= now) show(lines[i++]);
      if (i < lines.length) setTimeout(step, 50);
    };
    step();
  },

        <button class="btn small" id="rdnew" title="start over">new</button></div>
      <div class="ibody">
        <div class="pform">${f("name", "name", 180, "MyRecipe")}${f("category", "category", 110, "Carpentry")}${f("time", "time", 60, "50")}${f("timedAction", "action", 100, "Making")}</div>
        <div class="pform">${f("tags", "Tags", 220, "InHandCraft", "where it crafts: InHandCraft, AnySurfaceCraft, or a workstation tag (e.g. one from the entity binder)")}
          <label><input type="checkbox" data-rd="needToBeLearn" ${d.needToBeLearn ? "checked" : ""}> must be learned</label></div>
        <div class="pform">${f("skillRequired", "skill", 120, "Woodwork:2")}${f("xpAward", "xp", 120, "Woodwork:10")}${f("onCreate", "OnCreate", 200, "MyMod.onCreate", "a Lua function the recipe calls on completion")}</div>
        ${d.extra.length ? `<div class="pform">${d.extra.map((x, n) => `<input class="inp mono" data-rx="${n}" value="${esc(x)}" style="width:220px" title="kept verbatim">`).join("")}</div>` : ""}
        <h3>Inputs <span class="dim" style="text-transform:none;letter-spacing:0">${this.roleChip("use")}use up ${this.roleChip("keep")}keep (tool)</span></h3>

      if (!el.isConnected) return;
      $("#rdprev").textContent = last.text || last.error || "";
      $("#rdfile").textContent = last.path ? "→ " + last.path : "";
      const w = arr(last.warnings).map((x) => `<div class="warn">⚠ ${esc(x)}</div>`);
      if (last.exists) w.unshift(`<div class="warn">⚠ ${esc(last.full)} already exists. A second craftRecipe block APPENDS to its input/output lists rather than replacing them: unless this file IS that recipe's file, pick a new name.</div>`);
      $("#rdwarn").innerHTML = w.join("");
    }, 250);
    for (const x of $$("input,select", el)) { x.oninput = preview; x.onchange = preview; }
    for (const b of $$("[data-rdel]", el)) b.onclick = () => { read(); const k = b.dataset.rdel; (k[0] === "i" ? d.inputs : d.outputs).splice(+k.slice(1), 1); this.recipeBuilder(d); };
    $("#rdaddi").onclick = () => { read(); d.inputs.push({ amount: 1, items: "", mode: "", flags: "" }); this.recipeBuilder(d); };
    $("#rdaddo").onclick = () => { read(); d.outputs.push({ amount: 1, item: "" }); this.recipeBuilder(d); };
    $("#rdnew").onclick = () => { this.st.rdraft = null; this.recipeBuilder(); };
    preview();
    $("#rdgo").onclick = async () => {
      read();
      last = await call("recipeDraft", { draft: d, mod: S.mod }).catch((e) => ({ error: e.message }));
      if (!last.text) { this.say("✗ " + (last.error || "nothing to write")); return; }
      if (last.exists && !confirm(`${last.full} already exists; writing a second definition appends to its lists. Write anyway?`)) return;
      const post = (body) => fetch(`/api/wb/${encodeURIComponent(S.mod)}/mod-file`, { method: "POST", body: JSON.stringify(body) })
        .then((x) => x.json().catch(() => ({})).then((j) => ({ status: x.status, ...j })));
      let w = await post({ path: last.path, text: last.text }).catch((e) => ({ error: e.message }));
      if (w.status === 404) { this.say("✗ this dashboard predates the mod-file endpoint: restart the dashboard once"); return; }
      if (w.status === 409) { if (!confirm(w.error + "\n\nOverwrite it?")) return; w = await post({ path: last.path, text: last.text, overwrite: true }); }
      if (w.error) { this.say("✗ " + w.error); return; }
      this.say(`wrote ${w.file}; reloading recipes…`, true);
      const rl = await call("devReload", { scripts: ["CraftRecipe"] }).catch((e) => ({ error: e.message }));
      if (rl.error || (rl.scripts && rl.scripts.err)) { this.say("✗ reload: " + (rl.error || rl.scripts.err)); return; }
      const chk = await call("recipe", { name: last.full }).catch(() => null);
      if (!chk) { this.say(`✗ wrote ${w.file} but ${last.full} did not load: check the script (the debug log names the parse error)`); return; }
      this.say(`✓ ${last.full} loaded · craft it on the board`);
      await this.add("recipe", last.full, 60, 60);
    };
  },
  inspectRecipe(el, r) {
    const res = r.result, ins = r.inputs.map((id) => this.card(id)).filter(Boolean);
    el.innerHTML = `<div class="ihead"><div style="flex:1;min-width:0"><b>⚒ ${esc(r.label || r.recipe)}</b><div class="mono dim" style="font-size:11px">${esc(r.recipe)}</div></div>
        <button class="btn small" id="ifork" title="Open this recipe in the recipe builder as a starting point">✎ fork</button><button class="btn small" id="idel">✕</button></div>
      <div class="ibody">
        <div class="row" style="gap:6px"><button class="btn primary" id="icraft">▶ Craft</button><button class="btn small" id="ifill">fill inputs</button>
          <label class="muted" style="font-size:11.5px" title="Turn on Core.debug so CraftRecipeMonitor logs the engine's account of the craft"><input type="checkbox" id="imon" ${r.monitor ? "checked" : ""}> engine monitor</label></div>
        <h3>Inputs <span class="dim" style="text-transform:none;letter-spacing:0">${this.roleChip("use")}consumed ${this.roleChip("keep")}kept (tool)</span></h3>
        <div id="rslots">${this.slotsHtml(r)}</div>
        ${this.stationHtml(r)}
        <div id="rdetail"></div>
        ${arr(r.lines).length ? `<details style="margin-top:6px"><summary style="font-size:12px">recipe wants</summary>${r.lines.map((l) => `<div class="mono" style="font-size:11px">${esc(l)}</div>`).join("")}</details>` : ""}
        ${res ? `<h3>Last craft</h3><div class="verdict ${res.ok ? "ok" : "bad"}" style="padding:6px 9px"><b>${res.ok ? "Crafted" : res.gated ? "The game would refuse" : res.ran ? "Refused" : "Threw"}</b>
            ${res.gated ? `<div class="muted" style="font-size:11.5px">canPerformCurrentRecipe is false, so no action starts in game.${res.needsWorkstation && !res.atWorkstation ? " This recipe needs a workstation: pick one above." : " Tick <b>engine monitor</b> and craft again to see which input fails."}</div>` : ""}${res.ms != null ? ` <span class="dim mono">${res.ms.toFixed(2)}ms</span>` : ""}
            ${arr(res.why).length ? `<div class="warn mono" style="font-size:11.5px">${arr(res.why).slice(0, 4).map(esc).join("<br>")}</div>` : ""}${res.err ? `<pre class="fail">${esc(res.err)}</pre>` : ""}
            ${!res.ok && res.ran && !arr(res.monitor).length ? `<div class="muted" style="font-size:11.5px">No reason recorded: tick <b>engine monitor</b> and craft again to see why. Check inputs for a <span class="fail">broken</span> badge.</div>` : ""}
            ${arr(res.initErrors).length ? `<pre class="warn">${arr(res.initErrors).map(esc).join("\n")}</pre>` : ""}</div>
          ${arr(res.commands).length ? `<h3>Commands sent</h3>${res.commands.map((x) => `<div style="font-size:12px"><span class="mono acc">${esc(x.module)}/${esc(x.command)}</span> ${val(x.args, 1)}</div>`).join("")}` : ""}
          ${arr(res.hooks).length ? `<h3>Lua hooks</h3>${res.hooks.map((h) => `<div style="font-size:12px"><span class="mono">${esc(h.kind)}</span> ${h.resolved ? (h.calls ? `<span class="pass">×${h.calls}</span>` : `<span class="warn">not called</span>`) : `<span class="fail">unresolved</span>`}</div>`).join("")}` : ""}
          <details style="margin-top:8px"><summary style="font-size:12px">CraftRecipeMonitor · ${arr(res.monitor).length ? arr(res.monitor).length + " lines" : "off (tick engine monitor)"}</summary><div class="monitor">${arr(res.monitor).map((l) => `<div class="${/WARN|FAIL|NOT /.test(l) ? "why" : ""}">${esc(l)}</div>`).join("")}</div></details>
          ${arr(res.out).length ? `<details><summary style="font-size:12px">print output · ${res.out.length}</summary><pre class="box">${esc(res.out.join("\n"))}</pre></details>` : ""}` : ""}
      </div>`;
    $("#icraft").onclick = () => this.craft(r);
    $("#ifill").onclick = () => this.fill(r);
    $("#ifork").onclick = async () => {
      const d = await call("recipe", { name: r.recipe }).catch(() => null);
      const text = d && d.source && arr(d.source.defs).map((x) => x.text).join("\n");
      if (!text) { this.say("✗ no script source found for " + r.recipe); return; }
      const draft = await call("recipeParse", { text }).catch((e) => ({ error: e.message }));
      if (draft.error) { this.say("✗ " + draft.error); return; }
      draft.name = draft.name + "_Fork";
      this.recipeBuilder(draft);
    };
    $("#imon").onchange = (e) => { r.monitor = e.target.checked; this.save(); };
    if ($("#ibench")) $("#ibench").onchange = (e) => { const v = e.target.value; r.bench = v === "" ? undefined : v === "-" ? false : v; this.save(); this.inspect(); };
    $("#idel").onclick = () => this.remove(r.id);
    this.recipeDetail(r);
    for (const a of $$("[data-sel]", el)) a.onclick = () => this.select(a.dataset.sel);
    for (const a of $$("[data-det]", el)) a.onclick = () => { r.inputs = r.inputs.filter((x) => x !== a.dataset.det); this.save(); this.draw(); this.inspect(); };
    this.bindSlots(r, el);
  },
  // Workstation: recipes whose Tags match a CraftBench's Recipes list craft at
  // one (the game's entity window). Several identical tiles (8 propane tanks)
  // collapse to their distinct sprites in the list; the first is the default.
  stationHtml(r) {
    const d = this.rdef(r), ws = arr(d && d.workstations);
    if (!ws.length) return "";
    const cur = r.bench === false ? "-" : r.bench || "";
    const short = (f) => String(f).replace(/^Base\./, "");
    return `<h3>Workstation</h3><div class="row" style="gap:6px"><select class="inp" id="ibench" style="flex:1">
        <option value="" ${cur === "" ? "selected" : ""}>${esc(short(ws[0].full))} (default)</option>
        ${ws.map((w) => `<option value="${esc(w.full)}" ${cur === w.full ? "selected" : ""}>${esc(short(w.full))} · ${esc(w.sprite)}${w.origin === "mod" ? "" : " (vanilla)"}</option>`).join("")}
        <option value="-" ${cur === "-" ? "selected" : ""}>in hand, no workstation (the game refuses)</option></select></div>
      <div class="muted" style="font-size:11px;margin-top:2px">built as a real tile entity on the craft square; HandcraftLogic gets its CraftBench</div>`;
  },
  slotsHtml(r) {
    const sl = this.slotsOf(r);
    const nm = (c) => esc(((c.snap && c.snap.name) || this.shortType(c.type)) + (this.isStock(c) ? " ×" + c.count : ""));
    if (!sl) return `<span class="spin"></span>`;
    const free = this.board().cards.filter((c) => c.kind === "item" && !c.consumed);
    return sl.rows.map((x, i) => {
      if (x.role === "other") return `<div class="rrow other"><div>${this.roleChip("other")}<span class="muted" style="font-size:12px">${esc(x.inp.resource || "?")} input</span></div><div class="rl" title="${esc(x.inp.line || "")}">${esc(x.inp.line || "")}</div><div class="dim" style="font-size:11px">not simulated: the board fills Item inputs only</div></div>`;
      const types = arr(x.inp.items);
      const fit = free.filter((c) => !x.cards.includes(c) && (x.inp.anyItem || types.includes(c.type)));
      return `<div class="rrow ${x.role}"><div style="font-size:12px">${this.roleChip(x.role)}<b>${x.role === "keep" ? (x.inp.tool ? "tool" : "kept") : "consumed"}</b> <span class="muted">×${x.need}${x.uses && x.uses !== x.need ? ` (${x.uses} uses)` : ""}</span>
          ${x.have >= x.need ? `<span class="pass">✓</span>` : `<span class="warn">${x.have}/${x.need}</span>`}</div>
        <div class="rl" title="${esc(x.inp.line || "")}">${esc(types.length ? types.slice(0, 6).map((t) => this.shortType(t)).join(" | ") + (types.length > 6 ? ` | …${types.length - 6} more` : "") : x.inp.line || "")}</div>
        ${x.cards.map((c) => `<div class="row" style="gap:6px;font-size:12px"><a class="lnk" data-sel="${c.id}">◇ ${nm(c)}</a>${c.consumed ? `<span class="dim">used</span>` : ""}<span style="flex:1"></span><a class="lnk" data-det="${c.id}" title="detach">✕</a></div>`).join("")}
        ${x.have < x.need ? `<div class="row" style="gap:4px;margin-top:3px">
          ${fit.length ? `<select class="inp" data-pick="${i}" style="flex:1;font-size:11.5px"><option value="">attach a card on the board…</option>${fit.map((c) => `<option value="${c.id}">${nm(c)}</option>`).join("")}</select>` : ""}
          ${types.length > 1 ? `<select class="inp" data-newt="${i}" style="flex:1;font-size:11.5px">${types.slice(0, 80).map((t) => `<option value="${esc(t)}">${esc(this.shortType(t))}</option>`).join("")}</select>` : ""}
          <button class="btn small" data-new="${i}" title="make a fresh card of this type and attach it">+ new</button></div>` : ""}
      </div>`;
    }).join("") + (sl.extra.length ? `<div class="rrow other"><div class="warn" style="font-size:12px">fits no input of this recipe</div>${sl.extra.map((c) => `<div class="row" style="gap:6px;font-size:12px"><a class="lnk" data-sel="${c.id}">◇ ${nm(c)}</a><span style="flex:1"></span><a class="lnk" data-det="${c.id}" title="detach">✕</a></div>`).join("")}</div>` : "")
      + (!r.inputs.length ? `<div class="dim" style="font-size:11.5px">or drop item cards on the recipe, or <b>fill inputs</b></div>` : "");
  },
  bindSlots(r, el) {
    const sl = this.slotsOf(r);
    if (!sl) return;
    for (const s of $$("[data-pick]", el)) s.onchange = () => { if (s.value && !r.inputs.includes(s.value)) r.inputs.push(s.value); this.save(); this.draw(); this.inspect(); };
    for (const b of $$("[data-new]", el)) b.onclick = async () => {
      const x = sl.rows[+b.dataset.new], pick = $(`[data-newt="${b.dataset.new}"]`, el);
      const type = pick ? pick.value : arr(x.inp.items)[0];
      if (!type) return;
      const n = Math.max(1, x.need - x.have);
      const c = await this.add("item", type, r.x - 270, r.y + r.inputs.length * 96 - 20, n > 1 ? { count: n } : null);
      r.inputs.push(c.id);
      this.board().sel = r.id;
      this.save(); this.draw(); this.inspect();
    };
  },
});

const ADDON_TEMPLATE = `-- Lives outside media/: dev tooling, never deployed. ASCII only (Kahlua's lexer).
local MyMod   -- bound below, after WB.addon has required it

WB.addon {
    id = "mymod", name = "MyMod",
    description = "what these tools are for",
    requires = { "MyMod/Core" },                       -- failure disables the addon, with the reason shown
    appliesTo = function(item) return instanceof(item, "HandWeapon") end,

    panels = {                                         -- shown on every matching item, before + after crafts
        { id = "state", title = "MyMod state",

    actions = {                                        -- craft input steps + live-item buttons
        { id = "setLevel", label = "Set level",

MyMod = _G.MyMod`;

function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

// ── shell ──────────────────────────────────────────────────────────────────
async function selectMod(id) {
  S.mod = id;
  S.addonCache = {};
  localStorage.wbMod = id;
  $("#mod").value = id;
  writeHash();
  pollStatus();
  await TOOLS[S.tool].render($("#view"));
}

async function boot() {
  S.mods = await fetch("/api/wb/mods").then((r) => r.json());
  const h = readHash();
  $("#mod").innerHTML = S.mods.slice().sort((a, b) => (b.engine - a.engine) || a.name.localeCompare(b.name))
    .map((m) => `<option value="${esc(m.id)}">${esc(m.name)}${m.engine ? "" : " (no engine)"}</option>`).join("");
  $("#mod").onchange = (e) => selectMod(e.target.value);
  const pref = h.mod || localStorage.wbMod || (S.mods.find((m) => m.id === "VorpallySauced") || S.mods.find((m) => m.engine) || S.mods[0]).id;
  S.mod = S.mods.some((m) => m.id === pref) ? pref : S.mods[0].id;
  $("#mod").value = S.mod;

  $("#restart").onclick = async () => {
    await fetch(`/api/wb/${S.mod}/stop`, { method: "POST" });
    S.addonCache = {};
    await new Promise((r) => setTimeout(r, 1800));
    await TOOLS[S.tool].render($("#view"));
  };
  $("#reloadTools").onclick = async () => {
    S.addonCache = {};
    const r = await fetch(`/api/wb/${S.mod}/reload`, { method: "POST" }).then((r) => r.json());
    $("#binfo").textContent = r.error ? r.error : "tools reloaded";
    pollStatusSoon();
  };
  pollStatus();
  $("#view").classList.add("bleed");
  await TOOLS.board.render($("#view"));
}
boot();
</script>
