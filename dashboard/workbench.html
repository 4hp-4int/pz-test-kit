<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PZ Engine Workbench</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
  --bg: #0e1012; --panel: #15181b; --panel2: #1b1f23; --line: #272c31; --line2: #33393f;
  --text: #d5d8db; --muted: #858c93; --dim: #5d646b;
  --pass: #5fb36b; --fail: #e0564f; --err: #e0913c; --skip: #7d8590; --accent: #d9a441; --link: #7fb2e0;
  --mono: "JetBrains Mono", "Cascadia Mono", Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.45 system-ui, "Segoe UI", sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--link); text-decoration: none; } a:hover { text-decoration: underline; }
.mono { font-family: var(--mono); font-size: 12px; }
.muted { color: var(--muted); } .dim { color: var(--dim); }
.pass { color: var(--pass); } .fail { color: var(--fail); } .warn { color: var(--err); } .acc { color: var(--accent); }

#app { display: grid; grid-template-columns: 64px 1fr; grid-template-rows: 44px 1fr; height: 100vh; }
header { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 0 14px; border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 13px; letter-spacing: .14em; margin: 0; color: var(--accent); font-weight: 700; white-space: nowrap; }
header h1 small { color: var(--muted); letter-spacing: .05em; font-weight: 400; margin-left: 6px; }
header select, .inp, textarea { background: var(--bg); border: 1px solid var(--line2); border-radius: 3px; padding: 3px 7px; }
.inp:focus, textarea:focus, select:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
.badge { font-family: var(--mono); font-size: 11px; padding: 2px 7px; border: 1px solid var(--line2); border-radius: 3px; color: var(--muted); white-space: nowrap; }
.badge.ok { border-color: var(--pass); color: var(--pass); } .badge.bad { border-color: var(--fail); color: var(--fail); } .badge.run { border-color: var(--accent); color: var(--accent); }
.btn { background: var(--panel2); border: 1px solid var(--line2); border-radius: 3px; padding: 4px 10px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: #17130a; border-color: var(--accent); font-weight: 600; }
.btn.small { padding: 1px 7px; font-size: 11px; }
.btn:disabled { opacity: .5; cursor: default; }
.spin { display: inline-block; width: 10px; height: 10px; border: 2px solid var(--accent); border-right-color: transparent; border-radius: 50%; animation: rot .8s linear infinite; vertical-align: -1px; }
@keyframes rot { to { transform: rotate(360deg); } }

nav#rail { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding-top: 6px; }
.tool { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 9px 0; cursor: pointer; color: var(--muted); font-size: 10px; letter-spacing: .04em; border-left: 3px solid transparent; }
.tool b { font-size: 18px; line-height: 1; font-weight: 400; font-family: var(--mono); }
.tool:hover { color: var(--text); background: var(--panel2); }
.tool.on { color: var(--accent); border-left-color: var(--accent); background: var(--panel2); }

main { overflow: hidden; display: flex; min-width: 0; position: relative; }
#view { flex: 1; overflow: auto; padding: 14px 18px 60px; min-width: 0; }
#boot { position: absolute; inset: 0; background: rgba(14,16,18,.92); display: none; align-items: center; justify-content: center; z-index: 5; }
#boot.show { display: flex; }
#boot .box { width: min(760px, 90%); background: var(--panel); border: 1px solid var(--line2); border-radius: 4px; padding: 14px 16px; }
#boot pre { max-height: 300px; overflow: auto; background: var(--bg); border: 1px solid var(--line); padding: 8px; font-size: 11px; color: var(--muted); }


/* board */
#view.bleed { padding: 0; overflow: hidden; }
.bd { display: grid; grid-template-columns: 240px minmax(0, 1fr) 380px; height: 100%; }
.bpal { border-right: 1px solid var(--line); background: var(--panel); padding: 8px; overflow: auto; }
.bpal .inp { width: 100%; }
.bph { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; margin: 8px 0 3px; }
.bpi { border-radius: 3px; border-bottom: 0; } .bpi .t { font-size: 11.5px; }
.bcan { position: relative; overflow: hidden; cursor: grab; background-color: var(--bg);
  background-image: radial-gradient(circle, #252a30 1px, transparent 1.2px); }
.bcan.panning { cursor: grabbing; }
.bbar { position: absolute; top: 8px; left: 10px; right: 10px; z-index: 3; display: flex; gap: 6px; align-items: center; pointer-events: none; }
.bbar > * { pointer-events: auto; }
.bworld { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.bwires { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; }
.bwires .w { fill: none; stroke: var(--line2); stroke-width: 2; }
.bwires .w.out { stroke: #4f6f8f; } .bwires .w.soul { stroke: var(--accent); stroke-width: 2.5; } .bwires .w.used { stroke-dasharray: 5 4; }
.bc { position: absolute; width: 210px; background: var(--panel); border: 1px solid var(--line2); border-radius: 6px; padding: 6px 9px 8px; cursor: default; box-shadow: 0 2px 8px rgba(0,0,0,.35); user-select: none; }
.bc.recipe { width: 230px; border-color: #5a4a2a; background: #1a1712; }
.bc.action { width: 230px; border-color: #3d5378; background: #121823; }
.bslot { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .bslot b { color: var(--text); font-weight: 500; }
.brng { display: inline-flex; gap: 4px; align-items: center; font-size: 12px; } .brng select, .brng input { padding: 1px 5px; font-size: 11.5px; }
.bmode { font-family: var(--mono); font-size: 10px; border: 1px solid var(--line2); border-radius: 3px; padding: 0 5px; cursor: pointer; color: var(--muted); }
.bmode.mp { border-color: var(--link); color: var(--link); }
.hk { display: grid; grid-template-columns: 56px 1fr; gap: 2px 8px; font-size: 11.5px; } .hk .sd { color: var(--dim); font-family: var(--mono); font-size: 10.5px; }
.bc.sel { outline: 2px solid var(--link); }
.bc.drop { outline: 2px dashed var(--accent); }
.bc.gone { opacity: .45; } .bc.stale { border-style: dashed; }
.bch { font-weight: 600; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bcs { font-family: var(--mono); font-size: 10.5px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bb { display: inline-block; margin-top: 4px; font-family: var(--mono); font-size: 10.5px; border: 1px solid var(--line2); border-radius: 9px; padding: 0 7px; color: var(--muted); }
.bb.accent { border-color: var(--accent); color: var(--accent); } .bb.pass { border-color: var(--pass); color: var(--pass); } .bb.fail { border-color: var(--fail); color: var(--fail); }
.bres { font-size: 11px; margin-top: 4px; }
.bempty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--muted); pointer-events: none; }
.bempty button { pointer-events: auto; }
.binsp { border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-width: 0; }
.ihead { display: flex; gap: 6px; align-items: flex-start; padding: 9px 10px; border-bottom: 1px solid var(--line); }
.ibody { overflow: auto; padding: 8px 10px 40px; flex: 1; }
.blib { border: 1px solid var(--line); border-radius: 4px; padding: 6px 7px; margin-bottom: 6px; background: var(--bg); }
.blib .tree { font-family: var(--mono); font-size: 10.5px; color: var(--muted); white-space: pre-wrap; margin: 3px 0; }
.bexp { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line2); border-radius: 3px; padding: 1px 7px; background: var(--panel); cursor: help; }
.bexp.good { border-color: var(--pass); color: var(--pass); } .bexp.bad { border-color: var(--fail); color: var(--fail); }
.bc.expfail { box-shadow: 0 0 0 2px var(--fail), 0 2px 8px rgba(0,0,0,.35); }
.bc.dragging { opacity: .85; box-shadow: 0 8px 24px rgba(0,0,0,.5); z-index: 2; }
.bc .bch { cursor: grab; } .bcan.spacepan, .bcan.spacepan .bc { cursor: grab; }
.bcan { touch-action: none; }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 20; }
.mbox { width: min(460px, 92vw); background: var(--panel); border: 1px solid var(--line2); border-radius: 6px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.mbox label { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--muted); }
/* explorer drawer */
#drawer { width: 0; overflow: hidden; border-left: 1px solid var(--line); background: var(--panel); transition: width .15s; display: flex; flex-direction: column; }
#drawer.open { width: min(560px, 46vw); }
#drawer .dh { padding: 8px 10px; border-bottom: 1px solid var(--line); display: flex; gap: 6px; align-items: center; }
#drawer .db { overflow: auto; flex: 1; padding: 8px 10px 40px; }

h2 { font-size: 16px; margin: 0 0 10px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
h2 small { font-family: var(--mono); font-size: 11px; color: var(--dim); font-weight: 400; }
h3 { margin: 16px 0 6px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; font-weight: 500; }
.cols { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 16px; align-items: start; }
.cols3 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; margin-bottom: 12px; }
.list { border: 1px solid var(--line); border-radius: 4px; background: var(--panel); max-height: calc(100vh - 170px); overflow: auto; }
.li { padding: 4px 9px; border-bottom: 1px solid var(--line); cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
.li:hover { background: var(--panel2); } .li.sel { background: var(--panel2); box-shadow: inset 3px 0 var(--accent); }
.li .t { font-family: var(--mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.li .s { font-size: 11px; color: var(--muted); white-space: nowrap; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 3px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
td.k { font-family: var(--mono); font-size: 12px; color: var(--link); white-space: nowrap; }
pre { margin: 0; white-space: pre-wrap; word-break: break-word; font-family: var(--mono); font-size: 12px; }
pre.box { background: var(--bg); border: 1px solid var(--line); padding: 8px 10px; border-radius: 3px; max-height: 420px; overflow: auto; }
.chip { display: inline-flex; gap: 4px; align-items: baseline; font-family: var(--mono); font-size: 11.5px; border: 1px solid var(--line2); border-radius: 3px; padding: 0 6px; cursor: pointer; background: var(--panel2); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: middle; }
.chip:hover { border-color: var(--accent); }
.chip .c { color: var(--accent); } .chip .r { color: var(--dim); }
.tag { display: inline-block; font-family: var(--mono); font-size: 11px; border: 1px solid var(--line2); border-radius: 10px; padding: 0 7px; margin: 1px 2px; color: var(--muted); }
.lnk { cursor: pointer; color: var(--link); font-family: var(--mono); font-size: 12px; }
.lnk:hover { text-decoration: underline; }
.verdict { padding: 9px 12px; border-radius: 4px; margin-bottom: 12px; border: 1px solid var(--line); border-left-width: 4px; background: var(--panel); }
.verdict.ok { border-left-color: var(--pass); } .verdict.bad { border-left-color: var(--fail); } .verdict.warn { border-left-color: var(--err); }
.verdict b { font-size: 14px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.inv td { padding: 3px 4px; } .inv input { width: 100%; }
.str { color: #c3a86b; } .num { color: #b392d6; } .bool { color: #d68a92; } .nil { color: var(--dim); font-style: italic; }
details > summary { cursor: pointer; color: var(--muted); }
.meth { display: grid; grid-template-columns: 1fr auto; gap: 6px; padding: 3px 0; border-bottom: 1px solid var(--line); align-items: start; }
.meth .sig { font-family: var(--mono); font-size: 11.5px; overflow-wrap: anywhere; }
.meth .sig .n { color: var(--link); } .meth .res { grid-column: 1 / -1; padding-left: 12px; }
.monitor div { white-space: pre-wrap; font-family: var(--mono); font-size: 11.5px; }
.monitor .why { color: var(--err); }
.crumbs { font-family: var(--mono); font-size: 11.5px; color: var(--muted); overflow-wrap: anywhere; }
.crumbs a { color: var(--link); cursor: pointer; }
.consoleout .entry { border-bottom: 1px solid var(--line); padding: 6px 0; }
.consoleout .src { color: var(--accent); font-family: var(--mono); font-size: 12px; white-space: pre-wrap; }
.empty { color: var(--muted); padding: 30px; text-align: center; }
.tabs { display: flex; gap: 2px; margin-bottom: 10px; border-bottom: 1px solid var(--line); }
.tab { padding: 5px 12px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; }
.tab.on { color: var(--text); border-bottom-color: var(--accent); }
.step { display: inline-flex; gap: 4px; align-items: center; font-family: var(--mono); font-size: 11px; border: 1px solid var(--accent); color: var(--accent); border-radius: 10px; padding: 0 4px 0 7px; margin: 1px 2px; }
.step b { cursor: pointer; color: var(--muted); font-weight: 400; } .step b:hover { color: var(--fail); }
.panel { border: 1px solid var(--line); border-radius: 3px; margin: 4px 0; background: var(--bg); }
.panel .ph { font-size: 11px; color: var(--muted); padding: 2px 8px; border-bottom: 1px solid var(--line); text-transform: uppercase; letter-spacing: .05em; }
.panel table { table-layout: fixed; width: 100%; } .panel table td { padding: 1px 8px; font-size: 12px; overflow-wrap: anywhere; } .panel table td.k { width: 38%; } .panel tr.chg td { background: rgba(217,164,65,.10); } .panel .was { color: var(--dim); text-decoration: line-through; margin-right: 6px; }
.pform { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 4px 0; } .pform label { font-size: 11.5px; color: var(--muted); display: flex; gap: 4px; align-items: center; }
.act { border-bottom: 1px solid var(--line); padding: 5px 0; } .act .doc { font-size: 11.5px; color: var(--muted); }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>PZ ENGINE WORKBENCH<small>real engine, in the browser</small></h1>
    <select id="mod" title="Mod context: its scripts, Lua and hooks are loaded into the VM"></select>
    <span id="bstate" class="badge">idle</span>
    <span id="binfo" class="muted mono" style="font-size:11px"></span>
    <span style="flex:1"></span>
    <button class="btn small" id="reloadTools" title="Re-run dashboard/workbench/*.lua in the live VM">reload tools</button>
    <button class="btn small" id="restart" title="Kill and re-boot this mod's VM">restart VM</button>
    <a class="btn small" href="/">← tests dashboard</a>
  </header>
  <nav id="rail"></nav>
  <main>
    <div id="view"></div>
    <aside id="drawer"><div class="dh"><b class="acc" style="font-size:12px;letter-spacing:.08em">OBJECT</b><span style="flex:1"></span>
      <button class="btn small" id="dlink" title="Copy a link that re-resolves this object">link</button>
      <button class="btn small" id="dclose">✕</button></div><div class="db" id="dbody"></div></aside>
    <div id="boot"><div class="box"><div class="row"><span class="spin"></span><b id="bootTitle">Booting engine…</b><span id="bootTime" class="muted mono"></span></div>
      <p class="muted" style="margin:6px 0">A resident Kahlua VM is starting with this mod loaded, and the real PZ engine (projectzomboid.jar) is parsing every script file. Later calls are instant.</p>
      <pre id="bootLog"></pre></div></div>
  </main>
</div>
<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// Lua's JSON can't tell [] from {} for an empty table.
const arr = (x) => Array.isArray(x) ? x : (x && typeof x === "object" && !Object.keys(x).length ? [] : (x == null ? [] : x));
const short = (cls) => String(cls || "").split(".").pop();

// ── state + deep links ─────────────────────────────────────────────────────
const S = { mods: [], mod: null, tool: "board", st: {}, pending: 0, status: null };
function readHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  const o = {};
  for (const [k, v] of h) o[k] = v;
  return o;
}
function writeHash(extra) {
  const o = { mod: S.mod, tool: S.tool, ...(TOOLS[S.tool].hash ? TOOLS[S.tool].hash() : {}), ...(extra || {}) };
  if (S.explore) o.x = JSON.stringify(S.explore.root ? { e: S.explore.root.expr, r: S.explore.root.ref, p: S.explore.steps } : null);
  const p = new URLSearchParams();
  for (const [k, v] of Object.entries(o)) if (v !== undefined && v !== null && v !== "") p.set(k, v);
  history.replaceState(null, "", "#" + p.toString());
}

// ── API ────────────────────────────────────────────────────────────────────
async function call(tool, args) {
  S.pending++;
  pollStatusSoon();
  try {
    const r = await fetch(`/api/wb/${S.mod}/call`, { method: "POST", body: JSON.stringify({ tool, args: args || {} }) }).then((r) => r.json());
    if (!r.ok) throw Object.assign(new Error(r.error || "call failed"), { out: r.out });
    if (r.value && r.value.error) throw Object.assign(new Error(r.value.error), { out: r.out });
    return Object.assign(r.value ?? {}, { _out: r.out, _ms: r.ms });
  } finally {
    S.pending--;
    pollStatusSoon();
  }
}

let pollTimer = null;
function pollStatusSoon() { clearTimeout(pollTimer); pollTimer = setTimeout(pollStatus, 150); }
async function pollStatus() {
  if (!S.mod) return;
  const st = S.status = await fetch(`/api/wb/${S.mod}/status`).then((r) => r.json()).catch(() => null);
  if (!st) return;
  const b = $("#bstate");
  b.className = "badge " + ({ ready: "ok", dead: "bad", booting: "run", loading: "run" }[st.state] || "");
  b.textContent = st.state === "ready" ? "engine ready" + (st.info && !st.info.engine ? " (no engine)" : "") : st.state;
  b.title = st.error || "";
  $("#binfo").textContent = st.state === "ready" && st.info ? `${st.info.gameVersion || ""} · boot ${(st.bootMs / 1000).toFixed(1)}s · ${arr(st.info.tools).length} tools`
    : st.state === "dead" && st.error ? st.error : "";
  const booting = st.state === "booting" || st.state === "loading";
  $("#boot").classList.toggle("show", booting && S.pending > 0);
  if (booting) {
    $("#bootTitle").textContent = st.state === "loading" ? "Loading workbench tools…" : "Booting engine for " + S.mod + "…";
    $("#bootTime").textContent = st.elapsedMs ? (st.elapsedMs / 1000).toFixed(1) + "s" : "";
    const pre = $("#bootLog");
    pre.textContent = arr(st.bootLog).join("\n");
    pre.scrollTop = pre.scrollHeight;
  }
  if (booting || S.pending > 0) pollTimer = setTimeout(pollStatus, 600);
}

// ── value rendering (everything Java is clickable into the explorer) ──────
function val(v, depth = 0) {
  if (v === null || v === undefined) return `<span class="nil">nil</span>`;
  if (typeof v === "string") return `<span class="str">"${esc(v.length > 400 ? v.slice(0, 400) + "…" : v)}"</span>`;
  if (typeof v === "number") return `<span class="num">${v}</span>`;
  if (typeof v === "boolean") return `<span class="bool">${v}</span>`;
  if (v.$nil) return `<span class="nil">nil</span>`;
  if (v.$fn) return `<span class="dim">function</span>`;
  if (v.$java) {
    // "Base.Axe:zombie.…HandWeapon@1a2b" -> "Base.Axe"; bare "pkg.Class@1a2b" -> "@1a2b"
    const s = String(v.str || "");
    let label = s.replace(/:?[\w.$]+@[0-9a-f]+$/, "");
    if (!label) label = (s.match(/@[0-9a-f]+$/) || [""])[0];
    if (label.startsWith(short(v.class))) label = label.slice(short(v.class).length);
    return `<span class="chip" data-ref="${v.ref}" title="${esc(v.class)}\n${esc(s)}"><span class="c">${esc(short(v.class))}</span>${esc(label.slice(0, 60))}<span class="r">$${v.ref}</span></span>`;
  }
  if (v.$table) return `<span class="chip" data-ref="${v.ref}"><span class="c">table</span>${v.count} entr${v.count === 1 ? "y" : "ies"}<span class="r">$${v.ref}</span></span>`;
  if (Array.isArray(v)) {
    if (!v.length) return `<span class="dim">[]</span>`;
    if (depth > 2) return `<span class="dim">[${v.length}]</span>`;
    return `<span class="dim">[</span>${v.map((x) => val(x, depth + 1)).join(", ")}<span class="dim">]</span>`;
  }
  const ks = Object.keys(v);
  if (!ks.length) return `<span class="dim">{}</span>`;
  if (depth > 2) return `<span class="dim">{${ks.length}}</span>`;
  return `<details ${depth < 1 ? "open" : ""} style="display:inline-block;vertical-align:top"><summary class="dim">{${ks.length}}</summary><table>${ks.map((k) => `<tr><td class="k">${esc(k)}</td><td>${val(v[k], depth + 1)}</td></tr>`).join("")}</table></details>`;
}
document.addEventListener("click", (e) => {
  const c = e.target.closest("[data-ref]");
  if (c && !e.target.closest("button")) { openExplorer({ ref: +c.dataset.ref, label: "$" + c.dataset.ref }); e.preventDefault(); }
  const bench = e.target.closest("[data-bench]");
  if (bench) { e.preventDefault(); const b = JSON.parse(bench.dataset.bench); TOOLS.items.st.live = { ref: b.ref, type: b.type }; switchTool("items", { item: b.type }); return; }
  const go = e.target.closest("[data-go]");
  if (go) { e.preventDefault(); const g = JSON.parse(go.dataset.go); switchTool(g.tool, g); }
});

// ── explorer drawer ────────────────────────────────────────────────────────
// root = { expr } (re-resolvable, linkable) or { ref } (this VM only); steps = path.
async function openExplorer(root, steps) {
  S.explore = { root, steps: steps || [] };
  $("#drawer").classList.add("open");
  writeHash();
  await renderExplorer();
}
async function renderExplorer() {
  const ex = S.explore, body = $("#dbody");
  if (!ex) return;
  body.innerHTML = `<span class="spin"></span>`;
  let r;
  try {
    r = await call("resolvePath", { expr: ex.root.expr, ref: ex.root.ref, steps: ex.steps });
  } catch (e) { body.innerHTML = `<pre class="fail">${esc(e.message)}</pre>`; return; }
  const crumbs = [`<a data-step="0">${esc(ex.root.expr ? ex.root.expr : "$" + ex.root.ref)}</a>`]
    .concat(ex.steps.map((s, i) => `<a data-step="${i + 1}">${esc(s.startsWith("#") || s.startsWith(".") ? s.startsWith("#") ? "[" + s.slice(1) + "]" : s : ":" + s + "()")}</a>`)).join(" ");
  if (r.failedAt) { body.innerHTML = `<div class="crumbs">${crumbs}</div><pre class="fail" style="margin-top:8px">step ${r.failedAt} (${esc(r.step)}): ${esc(r.error)}</pre>`; bindCrumbs(); return; }
  const v = r.value;
  if (!v || (!v.$java && !v.$table)) { body.innerHTML = `<div class="crumbs">${crumbs}</div><div style="margin-top:10px">${val(v)}</div>`; bindCrumbs(); return; }
  const ins = await call("inspect", { ref: v.ref }).catch((e) => ({ error: e.message }));
  if (ins.error) { body.innerHTML = `<pre class="fail">${esc(ins.error)}</pre>`; return; }
  ex.ref = v.ref;
  let h = `<div class="crumbs">${crumbs}</div>`;
  if (ins.kind === "table") {
    h += `<h3>table · ${ins.count} entries</h3><table>${arr(ins.entries).map((e) => `<tr><td class="k"><a class="lnk" data-sub=".${esc(e.key)}">${esc(e.key)}</a></td><td>${val(e.value)}</td></tr>`).join("")}</table>`;
    body.innerHTML = h; bindCrumbs(); bindSub(); return;
  }
  const api = ins.api;
  h += `<div style="margin:8px 0 4px"><b class="mono" style="color:var(--accent)">${esc(ins.class)}</b>${api && api.inferred ? ` <span class="badge" title="toString gave no class; matched by method set">inferred ${api.inferred}</span>` : ""}</div>
    <div class="mono muted" style="font-size:11px;overflow-wrap:anywhere">${esc(ins.str)}</div>
    ${api ? `<div class="muted" style="font-size:11px;margin-top:3px">${api.chain.map(esc).join(" → ")}</div>` : `<div class="warn" style="font-size:11px">no API index entry — signatures unknown</div>`}`;
  if (ins.size != null) h += `<h3>elements · ${ins.size}</h3>${arr(ins.elements).map((e, i) => `<div class="row" style="padding:1px 0"><a class="lnk" data-sub="#${i}">[${i}]</a> ${val(e)}</div>`).join("") || `<span class="dim">empty</span>`}`;
  const methods = arr(ins.methods);
  const sigs = (m) => (api && api.methods[m]) || null;
  const zero = methods.filter((m) => { const s = sigs(m); return s ? s.some((x) => x.arity === 0 && !x.static) : /^(get|is|has|can)[A-Z]/.test(m); });
  const getters = zero.filter((m) => /^(get|is|has|can)[A-Z]/.test(m));
  h += `<h3>methods · ${methods.length} Lua-exposed</h3>
    <div class="row" style="margin-bottom:6px"><input class="inp" id="mq" placeholder="filter methods" style="flex:1">
      <button class="btn small" id="snap" title="Call every zero-arg getter (${getters.length}) and show the values">snapshot ${getters.length} getters</button></div>
    <div id="snapout"></div><div id="mlist"></div>`;
  body.innerHTML = h;
  bindCrumbs(); bindSub();
  const renderMethods = (q) => {
    $("#mlist").innerHTML = methods.filter((m) => !q || m.toLowerCase().includes(q.toLowerCase())).map((m) => {
      const s = sigs(m);
      const z = zero.includes(m);
      const sigTxt = s ? s.map((x) => esc(x.sig).replace(esc(m), `<span class="n">${esc(m)}</span>`) + (x.declaredIn ? ` <span class="dim">· ${esc(x.declaredIn)}</span>` : "")).join("<br>") : `<span class="n">${esc(m)}</span><span class="dim">(?)</span>`;
      return `<div class="meth" data-m="${esc(m)}"><div class="sig">${sigTxt}</div><div>${z ? `<button class="btn small" data-call="${esc(m)}" title="call with no arguments">▶</button>` : ""}
        <button class="btn small" data-args="${esc(m)}" title="call with arguments">ƒ(…)</button></div><div class="res"></div></div>`;
    }).join("");
  };
  renderMethods("");
  $("#mq").oninput = (e) => renderMethods(e.target.value);
  $("#mlist").onclick = async (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    const row = b.closest(".meth"), res = $(".res", row), m = row.dataset.m;
    let args = [];
    if (b.dataset.args !== undefined) {
      const s = sigs(m), hint = s ? s.map((x) => x.sig).join("\n") : m + "(?)";
      const raw = prompt(`Arguments for ${m} as JSON array. $N = an explored object, e.g. [1, "Base.Axe", "$12"]\n\n${hint}`, "[]");
      if (raw == null) return;
      try { args = JSON.parse(raw).map((a) => typeof a === "string" && /^\$\d+$/.test(a) ? { $ref: +a.slice(1) } : a); }
      catch (err) { res.innerHTML = `<span class="fail">bad JSON: ${esc(err.message)}</span>`; return; }
    }
    res.innerHTML = `<span class="spin"></span>`;
    const r2 = await call("invoke", { ref: ex.ref, method: m, args }).catch((er) => ({ ok: false, error: er.message }));
    res.innerHTML = r2.ok ? `→ ${val(r2.value)} <span class="dim">${r2.ms != null ? r2.ms.toFixed(2) + "ms" : ""}</span>${!args.length && (r2.value?.$java || r2.value?.$table) ? ` <a class="lnk" data-sub="${esc(m)}">open as path</a>` : ""}`
      : `<span class="fail">${esc(r2.error)}</span>`;
    bindSub();
  };
  $("#snap").onclick = async () => {
    $("#snapout").innerHTML = `<span class="spin"></span>`;
    const r3 = await call("getters", { ref: ex.ref, methods: getters });
    const vals = r3.values || {};
    $("#snapout").innerHTML = `<table style="margin-bottom:10px">${Object.keys(vals).sort().map((k) => `<tr><td class="k"><a class="lnk" data-sub="${esc(k)}">${esc(k)}</a></td><td>${val(vals[k])}</td></tr>`).join("")}</table>
      ${Object.keys(r3.failed || {}).length ? `<details><summary>${Object.keys(r3.failed).length} getter(s) threw</summary><table>${Object.entries(r3.failed).map(([k, e]) => `<tr><td class="k">${esc(k)}</td><td class="fail mono" style="font-size:11px">${esc(e)}</td></tr>`).join("")}</table></details>` : ""}`;
    bindSub();
  };
}
function bindCrumbs() { for (const a of $$("#dbody [data-step]")) a.onclick = () => { S.explore.steps = S.explore.steps.slice(0, +a.dataset.step); writeHash(); renderExplorer(); }; }
function bindSub() { for (const a of $$("#dbody [data-sub]")) a.onclick = (e) => { e.preventDefault(); S.explore.steps.push(a.dataset.sub); writeHash(); renderExplorer(); }; }
$("#dclose").onclick = () => { $("#drawer").classList.remove("open"); S.explore = null; writeHash(); };
$("#dlink").onclick = () => {
  navigator.clipboard?.writeText(location.href);
  $("#dlink").textContent = S.explore?.root?.expr ? "copied" : "copied (ref: this VM only)";
  setTimeout(() => ($("#dlink").textContent = "link"), 1500);
};

// ── addons (dashboard/workbench/40_addons.lua) ─────────────────────────────
// Addons are declared in Lua (WB.addon{...}); everything here is generated
// from that declaration: param forms, step chips, panels.
async function addonsFor(type) {
  S.addonCache = S.addonCache || {};
  const key = S.mod + "|" + (type || "");
  if (!S.addonCache[key]) S.addonCache[key] = call("addons", type ? { type } : {}).catch((e) => ({ addons: [], loadErrors: [], error: e.message }));
  return S.addonCache[key];
}
function paramForm(act, values) {
  return arr(act.params).map((p) => {
    const v = values && values[p.name] !== undefined ? values[p.name] : p.default;
    const name = `data-pn="${esc(p.name)}" data-pt="${esc(p.type || "string")}"`;
    let inp;
    if (p.type === "select") inp = `<select class="inp" ${name}>${arr(p.options).map((o) => `<option ${String(o) === String(v) ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
    else if (p.type === "bool") inp = `<input type="checkbox" ${name} ${v ? "checked" : ""}>`;
    else if (p.type === "json") inp = `<input class="inp mono" ${name} style="width:200px" value="${esc(v === undefined ? "" : JSON.stringify(v))}">`;
    else inp = `<input class="inp mono" ${name} ${p.type === "number" ? `type="number" style="width:90px"` : `style="width:140px"`} value="${esc(v ?? "")}">`;
    return `<label title="${esc(p.doc || "")}">${esc(p.label || p.name)} ${inp}</label>`;
  }).join("");
}
function readParams(el) {
  const out = {};
  for (const i of $$("[data-pn]", el)) {
    const t = i.dataset.pt;
    let v = t === "bool" ? i.checked : i.value;
    if (t === "number") v = v === "" ? undefined : +v;
    if (t === "json") { try { v = v.trim() ? JSON.parse(v) : undefined; } catch (e) { throw new Error(i.dataset.pn + ": bad JSON (" + e.message + ")"); } }
    out[i.dataset.pn] = v;
  }
  return out;
}
const stepText = (st) => `${st.addon}/${st.action}${Object.keys(st.params || {}).length ? " " + Object.entries(st.params).map(([k, v]) => k + "=" + (typeof v === "object" ? JSON.stringify(v) : v)).join(" ") : ""}`;
// Panels with an optional "before" set: changed keys are highlighted, with the old value struck through.
function panelsHtml(panels, before) {
  const prev = {};
  for (const p of arr(before)) prev[p.addon + "/" + p.id] = p.data;
  return arr(panels).filter((p) => p.data != null || p.error).map((p) => {
    const was = before ? prev[p.addon + "/" + p.id] : undefined;
    if (p.error) return `<div class="panel"><div class="ph">${esc(p.title)}</div><pre class="fail" style="padding:4px 8px">${esc(p.error)}</pre></div>`;
    const d = p.data;
    if (typeof d !== "object" || Array.isArray(d)) return `<div class="panel"><div class="ph">${esc(p.title)}</div><div style="padding:3px 8px">${val(d)}</div></div>`;
    const keys = Array.from(new Set([...Object.keys(d), ...Object.keys(was || {})])).sort();
    return `<div class="panel"><div class="ph">${esc(p.title)} <span class="dim" style="text-transform:none">· ${esc(p.addonName || p.addon)}</span></div><table>${keys.map((k) => {
      const changed = was && JSON.stringify(was[k]) !== JSON.stringify(d[k]);
      return `<tr class="${changed ? "chg" : ""}"><td class="k">${esc(k)}</td><td>${changed && was[k] !== undefined ? `<span class="was">${esc(typeof was[k] === "object" ? JSON.stringify(was[k]) : String(was[k]))}</span>` : ""}${d[k] === undefined ? `<span class="dim">(gone)</span>` : val(d[k], 1)}</td></tr>`;
    }).join("")}</table></div>`;
  }).join("");
}

// ── tools (pluggable: add an entry here + a dashboard/workbench/*.lua) ────
const TOOLS = {};
function tool(id, def) { TOOLS[id] = def; }

// Board: a crafting canvas ---------------------------------------------------
// Cards are live engine objects (items) and recipes. Crafting spawns the
// outputs as new cards wired to the recipe; outputs feed the next recipe, so a
// chain runs on the SAME objects. Details live in ONE inspector for the
// selected card. The board is a replayable scenario (types + addon steps +
// crafts), because live refs die with the VM; saved boards are BLUEPRINTS
// (library: mod templates + your own), optionally with `expect` checks.
tool("board", {
  icon: "▦", label: "Board",
  st: { b: null, pal: null, palQ: "", palTab: "find", lib: null, msg: "", busy: false },
  key() { return "wbBoard:" + S.mod; },
  board() {
    const st = this.st;
    if (!st.b || st.b.mod !== S.mod) {
      let b = null;
      try { b = JSON.parse(localStorage[this.key()] || "null"); } catch (_) {}
      st.b = b && b.cards ? b : this.emptyBoard();
      st.b.mod = S.mod;
      st.checked = false; st.lib = null;
    }
    return st.b;
  },
  emptyBoard() { return { cards: [], view: { x: 60, y: 60, z: 1 }, sel: null, seq: 1, expect: [], meta: null, results: null }; },
  save() { localStorage[this.key()] = JSON.stringify(this.board()); },
  card(id) { return this.board().cards.find((c) => c.id === id); },
  newCard(c) { const b = this.board(); c.id = "c" + b.seq++; b.cards.push(c); return c; },
  say(msg, busy) { this.st.msg = msg || ""; this.st.busy = !!busy; const el = $("#bmsg"); if (el) el.innerHTML = (busy ? `<span class="spin"></span> ` : "") + esc(this.st.msg); },
  isStock(c) { return c.kind === "item" && (c.count || 1) > 1; },
  // Random rolls. Boards default to seeded (varied, replayable); blueprints
  // carry their rng. reset=true restarts the seed's sequence.
  rng() { const b = this.board(); if (!b.rng) b.rng = { mode: "seeded", seed: 1 }; return b.rng; },
  async applyRng(reset) {
    const r = this.rng();
    if (!reset && this.st.rngApplied === JSON.stringify(r) + S.mod) return;
    let seed = r.seed;
    if (r.mode === "random") seed = Math.floor(Math.random() * 2147483646) + 1;
    const res = await call("setRandom", { mode: r.mode === "midpoint" ? "midpoint" : "seeded", seed }).catch(() => null);
    this.st.rngApplied = JSON.stringify(r) + S.mod;
    if (res && r.mode === "random") this.st.lastSeed = res.seed;
  },
  // Recipes and board actions are both "process" cards: inputs -> outputs.
  isProc(c) { return c && (c.kind === "recipe" || c.kind === "action"); },
  syncSlots(a) { a.inputs = arr(a.slotDefs).map((s) => a.slots[s.name]).filter(Boolean); },
  async actionCatalog() {
    if (!this.st.bact || this.st.bactMod !== S.mod) { this.st.bactMod = S.mod; this.st.bact = (await call("boardActions").catch(() => ({ actions: [] }))).actions || []; }
    return arr(this.st.bact);
  },

  async render(v) {
    this.board();
    v.innerHTML = `<div class="bd">
      <div class="bpal"><div class="tabs" style="margin-bottom:6px">${[["find", "Find"], ["lib", "Library"]].map(([k, l]) => `<div class="tab ${this.st.palTab === k ? "on" : ""}" data-pt="${k}">${l}</div>`).join("")}</div><div id="bpl"></div></div>
      <div class="bcan" id="bcan">
        <div class="bbar"><button class="btn small" id="breplay" title="Rebuild every live object and re-run every recipe in order">↻ run all</button>
          <button class="btn small" id="bsave" title="Save this board to the library as a blueprint">save blueprint</button>
          <button class="btn small" id="bfit" title="Fit everything (f)">fit</button><button class="btn small" id="bclear">clear</button>
          <span class="brng" title="Random rolls (ZombRand). seeded: varied, and run all replays the same rolls. random: a new seed every run all. fixed: the test kit's midpoint, every roll identical">🎲
            <select class="inp" id="brngm"><option value="seeded">seeded</option><option value="random">random</option><option value="midpoint">fixed (kit)</option></select>
            <input class="inp mono" id="brngs" style="width:70px" title="seed"></span>
          <span id="bexp"></span><span id="bmsg" class="muted" style="font-size:12px"></span></div>
        <div class="bworld" id="bworld"><svg class="bwires" id="bwires"></svg><div id="bcards"></div></div>
        <div class="bempty" id="bempty"></div>
      </div>
      <div class="binsp" id="binsp"></div></div>`;
    for (const t of $$("[data-pt]", v)) t.onclick = () => { this.st.palTab = t.dataset.pt; for (const x of $$("[data-pt]", v)) x.classList.toggle("on", x === t); this.palette(); };
    $("#breplay").onclick = () => this.replay(true);
    $("#bsave").onclick = () => this.saveDialog();
    $("#bfit").onclick = () => this.fit();
    const rng = this.rng();

    this.bindCanvas();
    this.palette();
    this.draw();
    this.inspect();
    this.showExpect();
    this.say(this.st.msg, this.st.busy);
    this.checkLive();
  },

  // Live refs die with the VM (idle shutdown, restart). Probe one; if it's
  // gone, mark everything stale rather than failing on each click.
  async checkLive() {
    const st = this.st, b = this.board();
    if (st.checked) return;
    st.checked = true;
    const probe = b.cards.find((c) => c.kind === "item" && c.ref && !c.consumed);

      for (const c of b.cards) if (c.kind === "item") { c.stale = true; c.ref = null; }

        const r = res[bp.id];
        return `<div class="blib" data-bp="${esc(bp.id)}"><div class="row" style="gap:4px"><b style="flex:1;font-size:12px">${esc(bp.name)}</b>
            ${r ? `<span class="${r.fail ? "fail" : "pass"}" title="last run: ${r.pass}/${r.total} expectations">${r.fail ? "✗" : "✓"} ${r.pass}/${r.total}</span>` : ""}</div>
          ${bp.error ? `<div class="fail" style="font-size:11px">${esc(bp.error)}</div>` : ""}
          <div style="line-height:1.2">${arr(bp.tags).map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</div>
          <details><summary style="font-size:11px">tree · ${arr(bp.cards).filter((c) => c.kind === "recipe" || c.kind === "action").length} step(s)${arr(bp.expect).length ? " · " + bp.expect.length + " checks" : ""}</summary>
            ${bp.description ? `<div class="muted" style="font-size:11px;margin:3px 0">${esc(bp.description)}</div>` : ""}<div class="tree">${esc(treeText(bp.cards))}</div></details>
          <div class="row" style="gap:4px;margin-top:3px"><button class="btn small primary" data-load title="Replace the board with this blueprint and run it">open + run</button>
            <button class="btn small" data-insert title="Add it next to what's on the board">add</button>
            ${bp.source === "local" ? `<button class="btn small" data-delbp title="Delete from my library">✕</button>` : ""}</div></div>`;
      }).join("")}`).join("") || `<div class="dim" style="font-size:12px">No blueprints yet. Build a board and <b>save blueprint</b>.</div>`}
      <div class="muted" style="font-size:11px;margin-top:10px">Templates come from <span class="mono">&lt;mod&gt;/workbench/blueprints/</span>; yours from <span class="mono">dashboard/.blueprints/</span>.</div>`;
    $("#blq").oninput = debounce((e) => { this.st.libQ = e.target.value; this.library().then(() => { const i = $("#blq"); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }); }, 150);
    for (const box of $$("[data-bp]", el)) {
      const bp = arr(lib.blueprints).find((x) => x.id === box.dataset.bp);
      const L = $("[data-load]", box), I = $("[data-insert]", box), D = $("[data-delbp]", box);
      if (L) L.onclick = () => this.loadBlueprint(bp, false);
      if (I) I.onclick = () => this.loadBlueprint(bp, true);
      if (D) D.onclick = async () => { if (!confirm(`Delete "${bp.name}"?`)) return; await fetch(`/api/wb/${S.mod}/blueprints?id=${encodeURIComponent(bp.id)}`, { method: "DELETE" }); this.st.lib = null; this.library(); };
    }
    function treeText(cards) {
      const by = new Map(arr(cards).map((c) => [c.id, c]));
      const name = (c) => c ? (c.kind === "recipe" || c.kind === "action" ? (c.label || c.recipe || c.action || "").replace(/^Base\./, "") : (c.type || "").replace(/^Base\./, "") + ((c.count || 1) > 1 ? " ×" + c.count : "") + (arr(c.steps).length ? "*" : "")) : "?";
      return arr(cards).filter((c) => c.kind === "recipe" || c.kind === "action").map((r) => `${r.kind === "action" ? "⚡" : "⚒"} ${name(r)}${r.mode === "mp" ? " [MP]" : ""}\n   ← ${arr(r.inputs).map((i) => name(by.get(i))).join(", ")}${arr(r.outputs).length ? `\n   → ${arr(r.outputs).map((i) => name(by.get(i))).join(", ")}` : ""}`).join("\n");
    }
  },

  // ── blueprints ──
  toBlueprint(meta) {
    const b = this.board(), tid = (id) => { const c = this.card(id); return c ? (c.tid || c.id) : id; };
    const cards = b.cards.map((c) => {
      const o = { id: c.tid || c.id, kind: c.kind, x: Math.round(c.x), y: Math.round(c.y) };
      if (c.kind === "recipe") Object.assign(o, { recipe: c.recipe, label: c.label, inputs: c.inputs.map(tid), outputs: c.outputs.map(tid) });
      else if (c.kind === "action") {
        const slots = {}, outMap = {};
        for (const [k, v] of Object.entries(c.slots || {})) if (v) slots[k] = tid(v);
        for (const [k, v] of Object.entries(c.outMap || {})) outMap[k] = tid(v);
        Object.assign(o, { addon: c.addon, action: c.action, label: c.label, slots, params: c.params || {}, mode: c.mode || "sp", outMap });
      }
      else Object.assign(o, { type: c.type }, (c.count || 1) > 1 ? { count: c.count } : {}, arr(c.steps).length ? { steps: c.steps } : {}, c.origin ? { origin: tid(c.origin) } : {});
      return o;
    });
    return { ...meta, rng: this.rng(), cards, expect: arr(b.expect).map((e) => ({ ...e, card: e.card && tid(e.card), recipe: e.recipe && tid(e.recipe), outputsOf: e.outputsOf && tid(e.outputsOf) })) };
  },
  async saveDialog() {
    const b = this.board();
    if (!b.cards.length) { this.say("Nothing to save yet."); return; }
    const lib = this.st.lib || await fetch(`/api/wb/${S.mod}/blueprints`).then((r) => r.json());
    const m = b.meta || {};
    const dlg = document.createElement("div");
    dlg.className = "modal";
    dlg.innerHTML = `<div class="mbox"><h3 style="margin-top:0">Save blueprint</h3>
      <label>name <input class="inp" id="mn" value="${esc(m.name || "")}" style="width:100%"></label>
      <label>description <textarea class="inp" id="md" rows="3" style="width:100%">${esc(m.description || "")}</textarea></label>
      <label>tags <input class="inp" id="mt" value="${esc(arr(m.tags).join(", "))}" placeholder="blacksmithing, blooded" style="width:100%"></label>
      <label>save to <select class="inp" id="mw">${arr(lib.targets).map((t) => `<option value="${t.key}">${esc(t.label)}${t.key === "mod" ? " (commit with the mod)" : ""}</option>`).join("")}</select></label>
      <div class="muted" style="font-size:11.5px;margin:4px 0">${arr(b.expect).length} expectation${arr(b.expect).length === 1 ? "" : "s"} included. Pin more from a card's inspector.</div>
      <div class="row" style="gap:6px;justify-content:flex-end"><button class="btn" id="mc">cancel</button><button class="btn primary" id="ms">save</button></div></div>`;
    document.body.appendChild(dlg);
    $("#mn", dlg).focus();
    $("#mw", dlg).value = m.source === "mod" ? "mod" : "local";
    $("#mc", dlg).onclick = () => dlg.remove();
    $("#ms", dlg).onclick = async () => {
      const meta = { name: $("#mn", dlg).value.trim(), description: $("#md", dlg).value.trim(), tags: $("#mt", dlg).value.split(",").map((s) => s.trim()).filter(Boolean) };
      if (!meta.name) { $("#mn", dlg).focus(); return; }
      const r = await fetch(`/api/wb/${S.mod}/blueprints`, { method: "POST", body: JSON.stringify({ target: $("#mw", dlg).value, blueprint: this.toBlueprint(meta) }) }).then((x) => x.json());
      dlg.remove();
      if (r.error) { this.say(r.error); return; }
      b.meta = { ...meta, source: $("#mw", dlg).value, id: r.id };
      this.save(); this.st.lib = null;
      this.say(`saved "${meta.name}"`);
      if (this.st.palTab === "lib") this.library();
    };
  },
  async loadBlueprint(bp, insert) {
    if (!insert && this.board().cards.length && !confirm(`Replace the board with "${bp.name}"?`)) return;
    if (!insert) { this.st.b = { ...this.emptyBoard(), mod: S.mod }; }
    const b = this.board(), map = new Map();
    const dx = insert && b.cards.length ? Math.max(...b.cards.map((c) => c.y)) + 160 : 0;
    for (const t of arr(bp.cards)) {
      const c = { ...JSON.parse(JSON.stringify(t)), tid: t.id };
      delete c.id;
      const nc = this.newCard(c);
      map.set(t.id, nc.id);
    }
    for (const t of arr(bp.cards)) {
      const c = this.card(map.get(t.id));
      if (c.kind === "recipe") { c.inputs = arr(t.inputs).map((i) => map.get(i)).filter(Boolean); c.outputs = arr(t.outputs).map((i) => map.get(i)).filter(Boolean); c.crafted = true; }
      if (c.kind === "action") {
        const def = (await this.actionCatalog()).find((x) => x.addon === c.addon && x.id === c.action);
        c.slotDefs = def ? def.slots : Object.keys(t.slots || {}).map((n) => ({ name: n, label: n }));
        c.paramDefs = def ? def.params : []; c.doc = def && def.doc; c.akind = def ? def.kind : "timed"; c.label = c.label || (def && def.label) || c.action;
        c.slots = {}; for (const [k, v] of Object.entries(t.slots || {})) c.slots[k] = map.get(v);
        c.outMap = {}; for (const [k, v] of Object.entries(t.outMap || {})) c.outMap[k] = map.get(v);
        c.outputs = Object.values(c.outMap).filter(Boolean);
        this.syncSlots(c); c.crafted = true;
      }
      if (c.origin) c.origin = map.get(c.origin);
    }
    const fresh = arr(bp.cards).map((t) => this.card(map.get(t.id)));
    if (fresh.some((c) => c.x == null)) this.layout(fresh);
    await Promise.all(fresh.filter((c) => c.kind === "recipe" && !c.label).map(async (c) => {
      const d = await call("recipe", { name: c.recipe }).catch(() => null);
      if (d) { c.label = d.label || d.name; c.lines = arr(d.inputs).map((i) => i.line || i.resource); }
    }));
    if (dx) for (const c of fresh) c.y += dx;
    b.expect = (insert ? arr(b.expect) : []).concat(arr(bp.expect).map((e) => ({ ...e, card: e.card && map.get(e.card), recipe: e.recipe && map.get(e.recipe), outputsOf: e.outputsOf && map.get(e.outputsOf) })));
    if (!insert) { b.meta = { name: bp.name, description: bp.description, tags: bp.tags, source: bp.source, id: bp.id }; b.rng = bp.rng ? { ...bp.rng } : { mode: "seeded", seed: 1 }; }
    b.sel = null;
    this.save(); this.draw(); this.fit(); this.inspect();
    await this.replay(true);
    const r = this.showExpect();
    if (r && bp.id) { this.st.libResults = { ...(this.st.libResults || {}), [bp.id]: r }; if (this.st.palTab === "lib") this.library(); }
  },
  // Columns by dependency depth: root items, recipe, its outputs, next recipe...
  layout(cards) {
    const by = new Map(cards.map((c) => [c.id, c])), depth = new Map();
    const recipes = cards.filter((c) => this.isProc(c));
    const rdepth = (r, seen = new Set()) => {
      if (depth.has(r.id)) return depth.get(r.id);
      if (seen.has(r.id)) return 1;
      seen.add(r.id);
      let d = 1;
      for (const i of r.inputs) { const c = by.get(i); if (c && c.origin && by.get(c.origin)) d = Math.max(d, rdepth(by.get(c.origin), seen) + 2); }
      depth.set(r.id, d);
      return d;
    };
    recipes.forEach((r) => rdepth(r));
    for (const r of recipes) for (const o of r.outputs) depth.set(o, depth.get(r.id) + 1);
    for (const c of cards) if (c.kind === "item" && !depth.has(c.id)) {
      const users = recipes.filter((r) => r.inputs.includes(c.id)).map((r) => depth.get(r.id));
      depth.set(c.id, users.length ? Math.min(...users) - 1 : 0);
    }
    const cols = new Map();
    for (const c of cards) { const d = depth.get(c.id) || 0; if (!cols.has(d)) cols.set(d, []); cols.get(d).push(c); }
    for (const [d, list] of cols) list.forEach((c, i) => { c.x = 40 + d * 280; c.y = 40 + i * (c.kind === "recipe" ? 150 : 96); });
  },
  // Evaluate the board's expectations; paint the toolbar and failing cards.
  showExpect() {
    const b = this.board(), el = $("#bexp");
    const list = arr(b.expect);
    if (!el) return null;
    if (!list.length) { el.innerHTML = ""; return null; }
    const badges = (c) => arr(c && c.snap && c.snap.badges).map((x) => x.text).join(" | ");
    const results = list.map((e) => {
      let ok = false, what = "";
      if (e.card) { const c = this.card(e.card), t = badges(c), n = (c && (c.snap && c.snap.name)) || (c && c.type) || "?";
        if (e.badge) { ok = t.includes(e.badge); what = `${n} has "${e.badge}"`; }
        if (e.noBadge) { ok = !t.includes(e.noBadge); what = `${n} has no "${e.noBadge}"`; }
        if (e.uses != null) { const u = c && c.snap && c.snap.uses; ok = u === e.uses; what = `${n} has ${e.uses} uses (got ${u == null ? "?" : u})`; }
        if (e.condition != null) { const u = c && c.snap && c.snap.condition; ok = u === e.condition; what = `${n} has condition ${e.condition} (got ${u == null ? "?" : u})`; } }
      if (e.outputsOf) { const r = this.card(e.outputsOf), outs = arr(r && r.outputs).map((id) => this.card(id));
        const n = outs.filter((c) => badges(c).includes(e.badge)).length; ok = n === e.count; what = `${e.count} output(s) of ${(r && (r.label || r.recipe)) || "?"} with "${e.badge}" (got ${n})`; }
      if (e.recipe) { const r = this.card(e.recipe); ok = !!(r && r.result && arr(r.result.commands).some((x) => x.command === e.command)); what = `${(r && (r.label || r.recipe)) || "?"} sends ${e.command}`; }
      return { ok, what, card: e.card || e.outputsOf || e.recipe };
    });
    const pass = results.filter((r) => r.ok).length, fail = results.length - pass;
    const ran = b.cards.some((c) => this.isProc(c) && c.result);
    el.innerHTML = ran ? `<span class="bexp ${fail ? "bad" : "good"}" title="${esc(results.map((r) => (r.ok ? "✓ " : "✗ ") + r.what).join("\n"))}">${fail ? "✗" : "✓"} ${pass}/${results.length} expectations</span>`
      : `<span class="bexp" title="${esc(results.map((r) => "· " + r.what).join("\n"))}">${results.length} expectations (run to check)</span>`;
    for (const x of $$(".bc.expfail")) x.classList.remove("expfail");
    if (ran) for (const r of results) if (!r.ok && r.card) { const x = $(`.bc[data-id="${r.card}"]`); if (x) x.classList.add("expfail"); }
    this.st.lastExpect = results;
    return ran ? { pass, fail, total: results.length } : null;
  },

  // ── adding cards ──
  freshSpot(x, y) {
    const cards = this.board().cards;
    for (let i = 0; i < 40; i++) { if (!cards.some((c) => Math.abs(c.x - x) < 220 && Math.abs(c.y - y) < 84)) break; y += 92; }
    return { x, y };
  },
  async add(kind, key, x, y, extra) {
    ({ x, y } = this.freshSpot(x, y));
    if (kind === "action") {
      const [addon, id] = key.split("/");
      const def = (await this.actionCatalog()).find((a) => a.addon === addon && a.id === id);
      if (!def) { this.say("unknown action " + key); return null; }
      const params = {};
      for (const pd of arr(def.params)) params[pd.name] = pd.default;
      const c = this.newCard({ kind: "action", addon, action: id, label: def.label, doc: def.doc, akind: def.kind, slotDefs: def.slots, paramDefs: def.params,
                               params, slots: {}, inputs: [], outputs: [], outMap: {}, mode: "sp", x, y });
      this.board().sel = c.id;
      this.save(); this.draw(); this.inspect();
      return c;
    }
    const c = this.newCard(kind === "recipe" ? { kind, recipe: key, x, y, inputs: [], outputs: [] } : { kind, type: key, x, y, steps: [], ...(extra || {}) });
    this.board().sel = c.id;
    this.save(); this.draw(); this.inspect();
    if (kind === "recipe") {
      const d = await call("recipe", { name: key }).catch(() => null);
      if (d) { c.label = d.label || d.name; c.lines = arr(d.inputs).map((i) => i.line || i.resource); }
    } else if (!this.isStock(c)) {
      await this.instance(c);
    }
    this.save(); this.draw(); this.inspect();
    return c;
  },
  // Mint the live item and re-apply its recorded steps (root cards).
  async instance(c) {
    await this.applyRng(false);
    try {
      const r = await call("addonPanels", { type: c.type });
      c.ref = r.ref; c.snap = r; c.stale = false; c.consumed = false; c.err = null;
      await this.applySteps(c);
    } catch (e) { c.err = e.message; }
  },
  async applySteps(c) {
    for (const st of arr(c.steps)) {
      const r = await call("addonRun", { ref: c.ref, addon: st.addon, action: st.action, params: st.params || {} });
      if (!r.ok) { c.err = st.addon + "/" + st.action + ": " + r.err; break; }
      c.snap = r.item;
    }
  },
  async fill(r) {
    const plan = await call("craftPlan", { recipe: r.recipe }).catch((e) => { this.say(e.message); return null; });
    if (!plan) return;
    let i = 0;
    for (const p of arr(plan.items)) {
      const c = await this.add("item", p.type, r.x - 270, r.y + (i++) * 96 - 20, (p.count || 1) > 1 ? { count: p.count } : null);
      r.inputs.push(c.id);
    }
    if (arr(plan.notes).length) this.say(arr(plan.notes).join(" · "));
    this.board().sel = r.id;
    this.save(); this.draw(); this.inspect();
  },

  // ── crafting ──
  ready(c) { return this.isStock(c) ? !c.consumed : (c.ref && !c.consumed && !c.stale); },
  async craft(r, replaying) {
    if (!replaying) await this.applyRng(false);
    if (r.kind === "action") return this.runAction(r, replaying);
    const ins = r.inputs.map((id) => this.card(id)).filter(Boolean);
    if (!ins.length) { this.say("Attach inputs first: drag item cards onto the recipe, or fill inputs."); return; }
    if (!replaying && ins.some((c) => !this.ready(c))) { this.say("Inputs were used up by an earlier craft: re-running the board.", true); await this.replay(false, r.id); return; }
    this.say("crafting " + (r.label || r.recipe) + "…", true);
    let res;
    const specs = ins.map((c) => this.isStock(c) ? { type: c.type, count: c.count, steps: c.steps } : { ref: c.ref, type: c.type });
    try { res = await call("craft", { recipe: r.recipe, items: specs, qualify: true, mode: "action", monitor: !!r.monitor }); }
    catch (e) { r.result = { ok: false, err: e.message }; this.say(""); this.save(); this.draw(); this.inspect(); return; }
    const byRef = (list) => new Map(arr(list).map((i) => [i.ref, i]));
    const consumed = byRef(res.consumed), kept = byRef(res.kept);
    for (const c of ins) {
      if (this.isStock(c)) { if (res.ok) c.consumed = true; continue; }
      if (consumed.has(c.ref)) { c.consumed = true; c.before = consumed.get(c.ref).panelsBefore; }
      if (kept.has(c.ref)) c.snap = { ...c.snap, ...kept.get(c.ref) };
    }
    // Map outputs onto the recipe's existing output cards by TYPE, then by
    // order: a blueprint's expected cards (and their downstream wires, post-
    // steps and positions) survive, whatever order the engine returns.
    const old = r.outputs.map((id) => this.card(id)).filter(Boolean), outs = arr(res.outputs), used = new Set();
    r.outputs = [];
    outs.forEach((o, i) => {
      let c = old.find((x) => !used.has(x.id) && x.type === o.fullType) || old.find((x) => !used.has(x.id) && !x.type);
      if (!c) { const p = this.freshSpot(r.x + 300, r.y + i * 104 - 20); c = this.newCard({ kind: "item", x: p.x, y: p.y, steps: [], origin: r.id }); }
      used.add(c.id);
      Object.assign(c, { type: o.fullType, ref: o.ref, snap: o, consumed: false, stale: false, err: null, origin: r.id });
      r.outputs.push(c.id);
    });
    for (const c of old) if (!used.has(c.id)) { c.ref = null; c.snap = null; c.stale = true; r.outputs.push(c.id); c.err = "not produced this time"; }
    for (const id of r.outputs) { const c = this.card(id); if (c.ref && arr(c.steps).length) await this.applySteps(c); }
    r.result = { ok: res.ok, ran: res.ran, err: res.err, why: res.why, commands: res.commands, hooks: res.hooks, monitor: res.monitor,
                 ms: res.ms, initErrors: res.initErrors, hooked: res.hooked, out: res._out };
    r.crafted = true;
    if (!replaying) { this.board().sel = r.id; this.say(res.ok ? `✓ ${r.label || r.recipe}: ${outs.length} output${outs.length === 1 ? "" : "s"}` : `✗ ${r.label || r.recipe} refused`); }
    this.save(); this.draw(); this.inspect(); this.showExpect();
  },
  // Board action: slot items in, "after" cards out (the same live objects,
  // changed), plus anything the action created. Input cards dim: their state
  // is now the after card's.
  async runAction(a, replaying) {
    const missing = arr(a.slotDefs).filter((s) => !a.slots[s.name]);
    if (missing.length) { this.say(`Fill the slot${missing.length > 1 ? "s" : ""} first: ${missing.map((s) => s.label).join(", ")} (drop an item card on the action)`); return; }
    const ins = a.inputs.map((id) => this.card(id)).filter(Boolean);
    if (!replaying && ins.some((c) => !this.ready(c))) { this.say("Inputs were changed or used by an earlier step: re-running the board.", true); await this.replay(false, a.id); return; }
    this.say(`${a.label} (${a.mode === "mp" ? "MP: client + server" : "SP"})…`, true);
    const slots = {};
    for (const [k, v] of Object.entries(a.slots)) { const c = this.card(v); if (c) slots[k] = c.ref; }
    let res;
    try { res = await call("boardActionRun", { addon: a.addon, action: a.action, slots, params: a.params || {}, mode: a.mode || "sp" }); }
    catch (e) { a.result = { ok: false, err: e.message }; this.say(""); this.save(); this.draw(); this.inspect(); return; }
    const outKey = [];
    const place = (key, info, i) => {
      let c = a.outMap[key] && this.card(a.outMap[key]);
      if (!c) { const p = this.freshSpot(a.x + 300, a.y + i * 104 - 20); c = this.newCard({ kind: "item", x: p.x, y: p.y, steps: [], origin: a.id }); a.outMap[key] = c.id; }
      Object.assign(c, { type: info.fullType, ref: info.ref, snap: info, origin: a.id, stale: false, err: null, consumed: !!info.gone, gone: !!info.gone, before: info.panelsBefore,
                         unchanged: key.startsWith("slot:") && info.changed === false });
      outKey.push(c.id);
    };
    let i = 0;
    for (const s of arr(a.slotDefs)) {
      const info = res.slots && res.slots[s.name];
      const inCard = this.card(a.slots[s.name]);
      if (!info || !inCard) continue;
      inCard.consumed = true; inCard.changedBy = a.id;
      place("slot:" + s.name, info, i++);
    }
    arr(res.created).forEach((info, k) => place("new:" + k, info, i++));
    for (const [k, id] of Object.entries(a.outMap)) if (!outKey.includes(id)) { const c = this.card(id); if (c) { c.stale = true; c.ref = null; c.err = "not produced this time"; } }
    a.outputs = Object.values(a.outMap).filter(Boolean);
    const r0 = res.result || {};
    const changedAny = Object.values(res.slots || {}).some((x) => x.changed) || arr(res.created).length > 0;
    a.result = { ok: res.ok, err: res.err, steps: r0.steps, valid: r0.valid, commands: res.commands, log: res.log, mode: res.mode, noChange: res.ok && !changedAny,
                 handlerCount: r0.listeners, handlerErrors: r0.errors, out: res._out };
    a.crafted = true;
    if (!replaying) { this.board().sel = a.id; this.say(res.ok ? `✓ ${a.label}` : `✗ ${a.label}`); }
    this.save(); this.draw(); this.inspect(); this.showExpect();
  },
  // Rebuild every live object: root items (+steps), then each recipe once all
  // its inputs exist, in dependency order. all=true runs every recipe.
  async replay(all, thenCraftId) {
    const b = this.board();
    this.say("running…", true);
    await this.applyRng(true);
    for (const c of b.cards) if (c.kind === "item") { c.ref = c.origin ? null : c.ref; c.consumed = false; c.changedBy = null; c.gone = false; c.unchanged = false; c.stale = false; if (c.origin) c.snap = null; }
    for (const c of b.cards) if (c.kind === "item" && !c.origin && !this.isStock(c)) await this.instance(c);
    this.draw();
    const todo = b.cards.filter((c) => this.isProc(c) && (all || c.crafted || c.id === thenCraftId));
    let progressed = true;
    while (todo.length && progressed) {
      progressed = false;
      for (let i = 0; i < todo.length; i++) {
        const r = todo[i], ins = r.inputs.map((id) => this.card(id)).filter(Boolean);
        if (ins.length && ins.every((c) => this.ready(c))) { todo.splice(i--, 1); await this.craft(r, true); progressed = true; }
      }
    }
    const fails = b.cards.filter((c) => this.isProc(c) && c.result && !c.result.ok).length;
    if (this.rng().mode === "random" && this.st.lastSeed) this.say(`(random seed ${this.st.lastSeed}: set mode to seeded + this seed to replay these rolls)`);
    this.say(todo.length ? `${todo.length} recipe(s) couldn't run (inputs missing or used twice)` : fails ? `${fails} recipe(s) refused` : "all recipes ran");
    this.save(); this.draw(); this.inspect();
    return this.showExpect();
  },
  remove(id, quiet) {
    const b = this.board();
    b.cards = b.cards.filter((c) => c.id !== id);
    for (const c of b.cards) if (this.isProc(c)) {
      c.inputs = c.inputs.filter((x) => x !== id); c.outputs = c.outputs.filter((x) => x !== id);
      if (c.slots) for (const k of Object.keys(c.slots)) if (c.slots[k] === id) delete c.slots[k];
      if (c.outMap) for (const k of Object.keys(c.outMap)) if (c.outMap[k] === id) delete c.outMap[k];
    }
    for (const c of b.cards) if (c.origin === id) c.origin = null;
    b.expect = arr(b.expect).filter((e) => e.card !== id && e.recipe !== id && e.outputsOf !== id);
    if (b.sel === id) b.sel = null;
    if (!quiet) { this.save(); this.draw(); this.inspect(); this.showExpect(); }
  },

  // ── drawing (deferred while a drag is in progress) ──
  draw() {
    if (this.drag) { this.pendingDraw = true; return; }
    const b = this.board(), el = $("#bcards");
    if (!el) return;
    const badges = (c) => arr(c.snap && c.snap.badges).map((x) => `<div class="bb ${esc(x.tone || "")}">${esc(x.text)}</div>`).join("");
    el.innerHTML = b.cards.map((c) => {
      const cls = `bc ${c.kind} ${b.sel === c.id ? "sel" : ""} ${c.consumed ? "gone" : ""} ${c.stale ? "stale" : ""}`;
      if (c.kind === "action") {
        const r = c.result, hooks = arr(r && r.steps), bad = hooks.filter((h) => !h.ok).length;
        return `<div class="${cls}" data-id="${c.id}" style="left:${c.x}px;top:${c.y}px">
          <div class="bch">⚡ ${esc(c.label)}</div>
          <div class="bcs">${esc(c.addon)} · ${esc(c.akind || "timed")}</div>
          ${arr(c.slotDefs).map((s) => { const it = this.card(c.slots[s.name]); return `<div class="bslot">${esc(s.label)}: <b>${it ? esc((it.snap && it.snap.name) || it.type) : "—"}</b></div>`; }).join("")}
          <div class="row" style="gap:4px;margin-top:5px"><button class="btn small primary" data-craft>▶ Run</button>
            ${c.akind === "timed" ? `<span class="bmode ${c.mode === "mp" ? "mp" : ""}" data-mode title="SP: one machine runs perform then complete. MP: client runs perform only; the server runs serverStart + complete">${c.mode === "mp" ? "MP" : "SP"}</span>` : `<span class="bmode" title="client -> server command">cmd</span>`}</div>
          ${r ? `<div class="bres ${r.noChange ? "warn" : r.ok && !bad ? "pass" : "fail"}">${r.noChange ? "◌ ran, nothing changed" : r.ok && !bad ? "✓ ran" : r.ok ? `✗ ${bad} hook${bad > 1 ? "s" : ""} threw` : "✗ failed"}${hooks.length ? ` <span class="dim">${hooks.length} hooks</span>` : ""}${arr(r.commands).length ? ` <span class="acc">· ${arr(r.commands).map((x) => esc(x.command)).join(", ")}</span>` : ""}</div>` : ""}
        </div>`;
      }
      if (c.kind === "recipe") {
        const r = c.result;
        return `<div class="${cls}" data-id="${c.id}" style="left:${c.x}px;top:${c.y}px">
          <div class="bch">⚒ ${esc(c.label || c.recipe)}</div>
          <div class="bcs">${c.inputs.length} input${c.inputs.length === 1 ? "" : "s"} · ${esc(c.recipe)}</div>
          <div class="row" style="gap:4px;margin-top:5px"><button class="btn small primary" data-craft>▶ Craft</button>${c.inputs.length ? "" : `<button class="btn small" data-fill>fill inputs</button>`}</div>
          ${r ? `<div class="bres ${r.ok ? "pass" : "fail"}">${r.ok ? "✓ crafted" : r.ran ? "✗ refused" : "✗ threw"}${r.ms != null ? ` <span class="dim">${r.ms.toFixed(1)}ms</span>` : ""}${arr(r.commands).length ? ` <span class="acc">· ${arr(r.commands).map((x) => esc(x.command)).join(", ")}</span>` : ""}</div>` : ""}
        </div>`;
      }
      const name = (c.snap && c.snap.name) || c.type || "(output)";
      return `<div class="${cls}" data-id="${c.id}" style="left:${c.x}px;top:${c.y}px">
        <div class="bch">◇ ${esc(name)}${this.isStock(c) ? ` <span class="acc">×${c.count}</span>` : ""}</div><div class="bcs">${esc(c.type || "")}${arr(c.steps).length ? ` · ${c.steps.length} step${c.steps.length === 1 ? "" : "s"}` : ""}</div>
        ${badges(c)}${c.unchanged ? `<div class="bres warn">unchanged by ${esc((this.card(c.origin) || {}).label || "the action")}</div>` : ""}${c.consumed ? `<div class="bres dim">${c.changedBy ? "→ after card holds its new state" : c.gone ? "gone (inside / used up)" : "consumed"}</div>` : ""}${c.stale && !c.err ? `<div class="bres warn">stale: run all</div>` : ""}${c.err ? `<div class="bres fail" title="${esc(c.err)}">${esc(c.err.length > 34 ? "error" : c.err)}</div>` : ""}
      </div>`;
    }).join("");
    for (const btn of $$("[data-craft]", el)) btn.onclick = (e) => { e.stopPropagation(); this.craft(this.card(btn.closest(".bc").dataset.id)); };
    for (const btn of $$("[data-fill]", el)) btn.onclick = (e) => { e.stopPropagation(); this.fill(this.card(btn.closest(".bc").dataset.id)); };
    for (const m of $$("[data-mode]", el)) m.onclick = (e) => { e.stopPropagation(); const c = this.card(m.closest(".bc").dataset.id); c.mode = c.mode === "mp" ? "sp" : "mp"; this.save(); this.draw(); if (this.board().sel === c.id) this.inspect(); };
    this.applyView();
    this.wires();
    if (this.st.lastExpect) this.showExpect();
    const empty = $("#bempty");
    empty.style.display = b.cards.length ? "none" : "flex";
    if (!b.cards.length) {
      empty.innerHTML = `<div><b>Empty board.</b><br>Open the <b>Library</b> for ready-made blueprints, or find a recipe on the left,<br>click it, then <b>fill inputs</b> and <b>▶ Craft</b>. Outputs become cards you can feed onward.</div>`;
    }
  },
  wires() {
    const b = this.board(), svg = $("#bwires");
    if (!svg) return;
    const box = (id) => { const el = $(`.bc[data-id="${id}"]`); return el && { x: el.offsetLeft, y: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight }; };
    const soul = (c) => c && (arr(c.snap && c.snap.badges).some((x) => x.tone === "accent") || arr(c.before).some((p) => p.addon === "vps" && p.data && p.data.blooded));
    const path = (a, z, cls) => {
      const x1 = a.x + a.w, y1 = a.y + Math.min(a.h / 2, 28), x2 = z.x, y2 = z.y + Math.min(z.h / 2, 28), dx = Math.max(40, Math.abs(x2 - x1) / 2);
      return `<path class="${cls}" d="M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}"/>`;
    };
    let h = "";
    for (const r of b.cards.filter((c) => this.isProc(c))) {
      const rb = box(r.id);
      if (!rb) continue;
      for (const id of r.inputs) { const c = this.card(id), cb = box(id); if (cb) h += path(cb, rb, "w in" + (soul(c) ? " soul" : "") + (c && c.consumed ? " used" : "")); }
      for (const id of r.outputs) { const c = this.card(id), cb = box(id); if (cb) h += path(rb, cb, "w out" + (soul(c) ? " soul" : "")); }
    }
    svg.innerHTML = h;
  },
  applyView() {
    const v = this.board().view, w = $("#bworld"), can = $("#bcan");
    if (!w) return;
    w.style.transform = `translate(${v.x}px,${v.y}px) scale(${v.z})`;
    can.style.backgroundSize = `${22 * v.z}px ${22 * v.z}px`;
    can.style.backgroundPosition = `${v.x}px ${v.y}px`;
  },
  centerWorld() {
    const can = $("#bcan"), v = this.board().view;
    return { x: (can.clientWidth / 2 - v.x) / v.z - 100, y: (can.clientHeight / 2 - v.y) / v.z - 40 };
  },
  fit() {
    const b = this.board(), can = $("#bcan");
    if (!b.cards.length || !can) return;
    const xs = b.cards.map((c) => c.x), ys = b.cards.map((c) => c.y);
    const minX = Math.min(...xs) - 40, minY = Math.min(...ys) - 60, maxX = Math.max(...xs) + 280, maxY = Math.max(...ys) + 160;
    const z = Math.max(0.3, Math.min(1.1, Math.min(can.clientWidth / (maxX - minX), can.clientHeight / (maxY - minY))));
    b.view = { z, x: -minX * z + (can.clientWidth - (maxX - minX) * z) / 2, y: -minY * z + 40 };
    this.save(); this.applyView();
  },
  select(id) {
    const b = this.board();
    if (b.sel === id) return;
    b.sel = id;
    for (const el of $$("#bcards .bc")) el.classList.toggle("sel", el.dataset.id === id);
    this.save(); this.inspect();
  },

  // ── pointer: pan, zoom, drag, drop-to-attach ──
  // Pointer capture keeps the gesture even when the cursor leaves the canvas;
  // moves are applied once per animation frame; the card element is looked up
  // fresh each frame (a re-render can't strand a drag on a detached node).
  bindCanvas() {
    const can = $("#bcan"), self = this;
    can.onwheel = (e) => {
      e.preventDefault();
      const v = self.board().view, r = can.getBoundingClientRect();
      if (!e.ctrlKey && Math.abs(e.deltaX) > Math.abs(e.deltaY)) { v.x -= e.deltaX; self.applyView(); return; }   // trackpad sideways = pan
      const mx = e.clientX - r.left, my = e.clientY - r.top;
      const z2 = Math.max(0.25, Math.min(2, v.z * Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0018))));
      v.x = mx - (mx - v.x) * (z2 / v.z); v.y = my - (my - v.y) * (z2 / v.z); v.z = z2;
      self.applyView(); clearTimeout(self._zt); self._zt = setTimeout(() => self.save(), 300);
    };
    can.onpointerdown = (e) => {
      if (e.target.closest("button, input, select, textarea, .bbar")) return;
      const b = self.board(), v = b.view, cardEl = e.target.closest(".bc");
      const pan = e.button === 1 || (e.button === 0 && (self.space || !cardEl));
      if (e.button !== 0 && !pan) return;
      e.preventDefault();
      can.setPointerCapture(e.pointerId);
      const sx = e.clientX, sy = e.clientY;
      let last = e, raf = 0, moved = false;
      const c = !pan && self.card(cardEl.dataset.id), ox = c ? c.x : v.x, oy = c ? c.y : v.y;
      self.drag = { id: c && c.id };
      if (pan) can.classList.add("panning");
      const frame = () => {
        raf = 0;
        const dxs = last.clientX - sx, dys = last.clientY - sy;
        if (Math.abs(dxs) + Math.abs(dys) > 3) moved = true;
        if (pan) { v.x = ox + dxs; v.y = oy + dys; self.applyView(); return; }
        c.x = Math.round(ox + dxs / v.z); c.y = Math.round(oy + dys / v.z);
        const el = $(`.bc[data-id="${c.id}"]`);
        if (el) { el.style.left = c.x + "px"; el.style.top = c.y + "px"; el.classList.add("dragging"); }
        self.wires();
        for (const t of $$(".bc.recipe, .bc.action")) t.classList.toggle("drop", c.kind === "item" && t.dataset.id !== c.id && hit(t, last));
      };
      const move = (ev) => { last = ev; if (!raf) raf = requestAnimationFrame(frame); };
      const up = (ev) => {
        can.removeEventListener("pointermove", move); can.removeEventListener("pointerup", up); can.removeEventListener("pointercancel", up);
        if (raf) { cancelAnimationFrame(raf); frame(); }
        can.classList.remove("panning");
        try { can.releasePointerCapture(e.pointerId); } catch (_) {}
        self.drag = null;
        for (const t of $$(".bc.drop, .bc.dragging")) t.classList.remove("drop", "dragging");
        if (pan) { if (!moved && !cardEl && b.sel) self.select(null); self.save(); if (self.pendingDraw) { self.pendingDraw = false; self.draw(); } return; }
        if (!moved) { self.select(c.id); if (self.pendingDraw) { self.pendingDraw = false; self.draw(); } return; }
        const target = c.kind === "item" && $$(".bc.recipe, .bc.action").find((t) => t.dataset.id !== c.id && hit(t, ev));
        if (target && self.card(target.dataset.id).kind === "action") {
          const a = self.card(target.dataset.id);
          c.x = ox; c.y = oy;
          self.attachToAction(a, c);
          self.save();
          return;
        }
        if (target) {
          const r = self.card(target.dataset.id);
          if (!r.inputs.includes(c.id)) r.inputs.push(c.id);
          c.x = ox; c.y = oy;
          self.say(`attached ${(c.snap && c.snap.name) || c.type} → ${r.label || r.recipe}`);
          b.sel = r.id; self.pendingDraw = true; self.inspect();
        }
        self.save();
        if (self.pendingDraw) { self.pendingDraw = false; self.draw(); }
      };
      can.addEventListener("pointermove", move); can.addEventListener("pointerup", up); can.addEventListener("pointercancel", up);
    };
    can.ondragover = (e) => { if (e.dataTransfer.types.includes("text/wb-add")) e.preventDefault(); };
    can.ondrop = (e) => {
      const raw = e.dataTransfer.getData("text/wb-add");
      if (!raw) return;
      e.preventDefault();
      const a = JSON.parse(raw), v = self.board().view, r = can.getBoundingClientRect();
      self.add(a.kind, a.key, Math.round((e.clientX - r.left - v.x) / v.z - 20), Math.round((e.clientY - r.top - v.y) / v.z - 14));
    };
    function hit(el, ev) { const r = el.getBoundingClientRect(); return ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom; }
    if (!self._keys) {
      self._keys = true;
      document.addEventListener("keydown", (e) => {
        if (S.tool !== "board" || e.target.closest("input, textarea, select")) return;
        if (e.code === "Space") { self.space = true; const c = $("#bcan"); if (c) c.classList.add("spacepan"); e.preventDefault(); }
        const b = self.board();
        if ((e.key === "Delete" || e.key === "Backspace") && b.sel) self.remove(b.sel);
        if (e.key === "f") self.fit();
      });
      document.addEventListener("keyup", (e) => { if (e.code === "Space") { self.space = false; const c = $("#bcan"); if (c) c.classList.remove("spacepan"); } });
    }
  },

  // Put an item card into the action slot its addon says it fits (first
  // empty slot whose accepts() passes), else the first empty slot.
  async attachToAction(a, c) {
    const taken = Object.keys(a.slots).filter((k) => a.slots[k]);
    let slot = null;
    if (c.ref) { const r = await call("boardActionSlot", { addon: a.addon, action: a.action, ref: c.ref, taken }).catch(() => null); slot = r && r.slot; }
    if (!slot) { const free = arr(a.slotDefs).find((s) => !a.slots[s.name]); slot = free && free.name; }
    if (!slot) { this.say(`${a.label}: every slot is filled (change one in the inspector)`); return; }
    a.slots[slot] = c.id; this.syncSlots(a);
    this.say(`${(c.snap && c.snap.name) || c.type} → ${a.label} [${slot}]`);
    this.board().sel = a.id;
    this.save(); this.draw(); this.inspect();
  },

        ${c.err ? `<pre class="fail" style="margin-bottom:6px">${esc(c.err)}</pre>` : ""}
        ${c.consumed ? `<div class="warn" style="font-size:12px;margin-bottom:6px">Consumed by a craft. Panels show it as it went in; ↻ run all to get it back.</div>` : ""}
        ${c.stale ? `<div class="warn" style="font-size:12px;margin-bottom:6px">Stale: the VM restarted. ↻ run all rebuilds it.</div>` : ""}

        <div id="iact"></div>
        ${arr(c.steps).length ? `<h3>Steps <span class="dim" style="text-transform:none">(replayed in order)</span></h3>${c.steps.map((s, j) => `<span class="step">${esc(stepText(s))}<b data-sdel="${j}">✕</b></span>`).join("")}` : ""}
        ${c.lastRun ? `<div class="verdict ${c.lastRun.ok ? "ok" : "bad"}" style="margin:8px 0;padding:6px 9px"><span class="mono" style="font-size:12px">${esc(c.lastRun.addon)}/${esc(c.lastRun.action)}</span> ${c.lastRun.ok ? val(c.lastRun.result) : `<pre class="fail">${esc(c.lastRun.err)}</pre>`}
          ${arr(c.lastRun.commands).length ? `<div style="font-size:11.5px">sent: ${arr(c.lastRun.commands).map((x) => `<span class="mono">${esc(x.command)}</span>`).join(", ")}</div>` : ""}</div>` : ""}

    $("#idup").onclick = async () => { const d = this.newCard({ kind: "item", type: c.type, count: c.count, steps: JSON.parse(JSON.stringify(arr(c.steps))), x: c.x + 24, y: c.y + 120 }); b.sel = d.id; this.draw(); if (!this.isStock(d)) await this.instance(d); this.save(); this.draw(); this.inspect(); };
    for (const x of $$("[data-sdel]", el)) x.onclick = () => { c.steps.splice(+x.dataset.sdel, 1); this.save(); this.say("step removed: ↻ run all to rebuild from scratch"); this.draw(); this.inspect(); };
    // Numeric kinds prefill with the item's current value: pin what you see.
    $("#ekind").onchange = (e) => {
      const k = e.target.value;

    };

      const k = $("#ekind").value, t = $("#etext").value.trim();

      const v = k === "uses" || k === "condition" ? Number(t) : t;
      if (typeof v === "number" && !isFinite(v)) { alert(k + " must be a number"); return; }
      const e = { card: c.id, [k]: v };
      if (arr(b.expect).some((x) => JSON.stringify(x) === JSON.stringify(e))) { this.say("already pinned"); return; }
      (b.expect = arr(b.expect)).push(e);
      this.save(); this.inspect(); this.showExpect();
    };
    for (const x of $$("[data-edel]", el)) x.onclick = () => { const e = JSON.parse(x.dataset.edel); b.expect = arr(b.expect).filter((y) => JSON.stringify(y) !== JSON.stringify(e)); this.save(); this.inspect(); this.showExpect(); };
    if (!c.ref || c.consumed) return;
    // Actions: one picker + one form, not a wall of every action.
    const r = await addonsFor(c.type);
    const live = arr(r.addons).filter((a) => !a.disabled && a.applies !== false);
    const opts = live.map((a) => {
      const pre = arr(a.presets).filter((p) => p.applies !== false), acts = arr(a.actions).filter((x) => x.applies !== false);
      return (pre.length ? `<optgroup label="${esc(a.name)} presets">${pre.map((p, k) => `<option value='${esc(JSON.stringify({ p: [a.id, k] }))}'>★ ${esc(p.label)}</option>`).join("")}</optgroup>` : "")
        + (acts.length ? `<optgroup label="${esc(a.name)}">${acts.map((x) => `<option value='${esc(JSON.stringify({ a: a.id, x: x.id }))}'>${esc(x.label)}</option>`).join("")}</optgroup>` : "");
