<style>
:root {

}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.45 system-ui, "Segoe UI", sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--link); text-decoration: none; } a:hover { text-decoration: underline; }
.mono { font-family: var(--mono); font-size: 12px; }
.muted { color: var(--muted); } .dim { color: var(--dim); }
.pass { color: var(--pass); } .fail { color: var(--fail); } .warn { color: var(--err); } .acc { color: var(--accent); }

#app { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: 44px 1fr; height: 100vh; }
header { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 0 14px; border-bottom: 1px solid var(--line); background: var(--panel); }

.inp:focus, textarea:focus, select:focus { outline: 1px solid var(--accent); border-color: var(--accent); }

.badge.ok { border-color: var(--pass); color: var(--pass); } .badge.bad { border-color: var(--fail); color: var(--fail); } .badge.run { border-color: var(--accent); color: var(--accent); }
.btn { background: var(--panel2); border: 1px solid var(--line2); border-radius: 3px; padding: 4px 10px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: #17130a; border-color: var(--accent); font-weight: 600; }
.btn.small { padding: 1px 7px; font-size: 11px; }
.btn:disabled { opacity: .5; cursor: default; }
.crt { position: relative; background: #0a0d0a; border: 2px solid #2b2b2b; border-radius: 10px; padding: 10px 12px; height: 300px; overflow-y: auto; font: 13px/1.45 ui-monospace, Consolas, monospace; box-shadow: inset 0 0 40px rgba(0,0,0,.9); }

.crt .ln .t { color: #5d6a5d; font-size: 10px; margin-right: 6px; text-shadow: none; }
.crt .fx { margin: 1px 0 4px 34px; font-size: 11px; text-shadow: none; }
.crt .fx span { display: inline-block; border: 1px solid #333; border-radius: 3px; padding: 0 4px; margin: 0 3px 2px 0; }
.crt .fx .up { color: var(--pass); border-color: #2c5532; } .crt .fx .dn { color: var(--fail); border-color: #5a2a28; } .crt .fx .md { color: var(--link); border-color: #2a4258; }
.spin { display: inline-block; width: 10px; height: 10px; border: 2px solid var(--accent); border-right-color: transparent; border-radius: 50%; animation: rot .8s linear infinite; vertical-align: -1px; }
@keyframes rot { to { transform: rotate(360deg); } }


main { overflow: hidden; display: flex; min-width: 0; position: relative; }
#view { flex: 1; overflow: auto; padding: 14px 18px 60px; min-width: 0; }
#boot { position: absolute; inset: 0; background: rgba(14,16,18,.92); display: none; align-items: center; justify-content: center; z-index: 5; }
#boot.show { display: flex; }
#boot .box { width: min(760px, 90%); background: var(--panel); border: 1px solid var(--line2); border-radius: 4px; padding: 14px 16px; }
#boot pre { max-height: 300px; overflow: auto; background: var(--bg); border: 1px solid var(--line); padding: 8px; font-size: 11px; color: var(--muted); }


/* board */
#view.bleed { padding: 0; overflow: hidden; }
.bd { display: grid; grid-template-columns: var(--palw, 300px) minmax(0, 1fr) var(--inspw, 380px); height: 100%; }
.bd { position: relative; min-height: 0; }
.bd > * { min-height: 0; }   /* grid items default to min-height:auto and grow with content */
.bsplit { position: absolute; top: 0; bottom: 0; width: 7px; cursor: col-resize; z-index: 5; }
.bsplit:hover, .bsplit.on { background: color-mix(in srgb, var(--accent) 35%, transparent); }
.bd > .bsplit.pal { left: calc(var(--palw, 300px) - 4px); } .bd > .bsplit.insp { right: calc(var(--inspw, 380px) - 4px); }
.bpal { border-right: 1px solid var(--line); background: var(--panel); padding: 8px; overflow: auto; }
.bpal .inp { width: 100%; }
.bph { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; margin: 8px 0 3px; }
.bpi { border-radius: 3px; border-bottom: 0; flex-wrap: wrap; row-gap: 0; } .bpi .t { font-size: 11.5px; white-space: normal; overflow-wrap: anywhere; flex: 1 1 60%; } .bpi .s { white-space: normal; overflow-wrap: anywhere; }
.bcan { position: relative; overflow: hidden; cursor: grab; background-color: var(--bg);
  background-image: radial-gradient(circle, #252a30 1px, transparent 1.2px); }
.bcan.panning { cursor: grabbing; }
.bbar { position: absolute; top: 8px; left: 10px; right: 10px; z-index: 3; display: flex; gap: 6px; align-items: center; pointer-events: none; }
.bbar > * { pointer-events: auto; }
.bworld { position: absolute; left: 0; top: 0; transform-origin: 0 0; }

.bwires .w { fill: none; stroke: var(--line2); stroke-width: 2; }
.bwires .w.out { stroke: #4f6f8f; } .bwires .w.soul { stroke: var(--accent); stroke-width: 2.5; } .bwires .w.used { stroke-dasharray: 5 4; }
.bc { position: absolute; width: 210px; background: var(--panel); border: 1px solid var(--line2); border-radius: 6px; padding: 6px 9px 8px; cursor: default; box-shadow: 0 2px 8px rgba(0,0,0,.35); user-select: none; }
.bc.recipe { width: 230px; border-color: #5a4a2a; background: #1a1712; }
.bc.action { width: 230px; border-color: #3d5378; background: #121823; }
.bc.object { width: 220px; border-color: #3b4a3a; background: #121712; }
.bc.script { width: 220px; border-color: #4a3b52; background: #17121a; }
.bc.world { width: 230px; border-color: #3f5a3a; background: #111811; }
.bc.world canvas { float: right; width: 64px; height: 80px; margin: -4px -4px 0 4px; image-rendering: pixelated; }
.bc.world .wchip { display: inline-block; font: 10px var(--mono); color: var(--muted); border: 1px solid var(--line2); border-radius: 3px; padding: 0 3px; margin: 2px 2px 0 0; }
.bc.world .wchip.ent { color: #9fd18f; border-color: #3f5a3a; }
.wmap { position: absolute; inset: 40px 10px 54px 10px; z-index: 4; background: #0b0d0f; border: 1px solid var(--line2); border-radius: 6px; box-shadow: 0 8px 30px rgba(0,0,0,.6); display: flex; flex-direction: column; }
.wmap .wh { display: flex; gap: 8px; align-items: center; padding: 5px 8px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); }
.wmap iframe { flex: 1; border: 0; width: 100%; border-radius: 0 0 6px 6px; }
.warea { width: 100%; background: radial-gradient(circle at 50% 40%, #1a2018, #0c0f0b 80%); border: 1px solid var(--line); border-radius: 4px; display: block; cursor: crosshair; image-rendering: auto; }
.wobj { border: 1px solid var(--line); border-radius: 4px; padding: 5px 6px; margin-bottom: 5px; display: flex; gap: 8px; }
.wobj canvas { width: 48px; height: 64px; flex: none; }
.wobj .wbody { flex: 1; min-width: 0; font-size: 12px; }
.wobj .wbody .mono { font-size: 11px; }
.pztip { background: rgba(18, 18, 18, .94); border: 1px solid #3a3a3a; border-radius: 2px; padding: 6px 9px 8px; font: 13px/17px "Segoe UI", system-ui, sans-serif; color: #e6e6e6; box-shadow: 0 2px 10px rgba(0,0,0,.6); position: relative; }
.pztip .rail { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
.pztip .nm { color: #ffffcc; margin-bottom: 3px; }
.pztip .kv { display: flex; gap: 14px; } .pztip .kv .v { margin-left: auto; text-align: right; }
.pztip .hd { font-weight: 600; margin-top: 4px; }
.pztip .dv { border-top: 1px solid #555; margin: 4px 0; }
.pztip .bar { height: 7px; background: #333; margin: 3px 0 3px auto; width: 110px; } .pztip .bar i { display: block; height: 100%; }
.pztip .row { display: flex; align-items: center; gap: 10px; }
.pztip .pv { color: #6a6a6a; font: 10px var(--mono); margin-top: 5px; }
.bwires .wl { fill: var(--muted); font: 10px var(--mono); }
.bwires .w.obj { stroke: #4e6a4b; stroke-dasharray: 3 3; }
.bwires .w.keep { stroke: #5b86b8; stroke-dasharray: 2 4; stroke-width: 2.5; }
.bwires .w.use { stroke: #b0814a; }
.role { display: inline-block; min-width: 38px; text-align: center; font: 600 9.5px var(--mono); letter-spacing: .05em; border-radius: 3px; padding: 0 4px; margin-right: 5px; vertical-align: 1px; }
.role.use { background: #3b2a17; color: #e3a35a; border: 1px solid #6b4a24; }
.role.keep { background: #17263a; color: #84b4ea; border: 1px solid #2d4a6e; }
.role.other { background: #1c1c1c; color: var(--muted); border: 1px solid var(--line2); }
.rslot { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 17px; }
.rslot .miss { color: var(--warn, #d9a441); }
.rrow { border: 1px solid var(--line); border-radius: 4px; padding: 5px 6px; margin-bottom: 5px; }
.rrow.keep { border-left: 3px solid #5b86b8; } .rrow.use { border-left: 3px solid #b0814a; } .rrow.other { border-left: 3px solid var(--line2); }
.rrow .rl { font: 10.5px var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 2px 0 4px; }
.sfam { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; margin: 7px 0 2px; }
.stype { display: inline-block; font-size: 11px; padding: 1px 6px; margin: 0 3px 3px 0; border: 1px solid var(--line2); border-radius: 10px; cursor: pointer; color: var(--muted); }
.stype.on { border-color: var(--accent); color: var(--text); } .stype .n { color: var(--dim, #666); font-size: 10px; }
.sgrp > summary { font-size: 11.5px; cursor: pointer; padding: 2px 0; } .sgrp > summary .n { color: var(--muted); font-size: 10.5px; }
.bdock { position: absolute; left: 10px; right: 10px; bottom: 8px; z-index: 3; background: var(--panel); border: 1px solid var(--line2); border-radius: 6px; box-shadow: 0 4px 18px rgba(0,0,0,.5); }
.bdock .dh { display: flex; gap: 6px; align-items: center; padding: 4px 8px; cursor: pointer; font-size: 12px; color: var(--muted); }
.bdock .dbody { padding: 0 8px 8px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.bdock textarea { width: 100%; height: 86px; resize: vertical; }
.bdock .dout { max-height: 140px; overflow: auto; font-size: 12px; }
.bdock .dout .entry { border-bottom: 1px solid var(--line); padding: 3px 0; }
.bslot { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .bslot b { color: var(--text); font-weight: 500; }
.brng { display: inline-flex; gap: 4px; align-items: center; font-size: 12px; } .brng select, .brng input { padding: 1px 5px; font-size: 11.5px; }
.bmode { font-family: var(--mono); font-size: 10px; border: 1px solid var(--line2); border-radius: 3px; padding: 0 5px; cursor: pointer; color: var(--muted); }
.bmode.mp { border-color: var(--link); color: var(--link); }
.hk { display: grid; grid-template-columns: 56px 1fr; gap: 2px 8px; font-size: 11.5px; } .hk .sd { color: var(--dim); font-family: var(--mono); font-size: 10.5px; }
.bc.sel { outline: 2px solid var(--link); }
.bc.drop { outline: 2px dashed var(--accent); }
.bc.gone { opacity: .45; } .bc.stale { border-style: dashed; }
.bch { font-weight: 600; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bcs { font-family: var(--mono); font-size: 10.5px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bb { display: inline-block; margin-top: 4px; font-family: var(--mono); font-size: 10.5px; border: 1px solid var(--line2); border-radius: 9px; padding: 0 7px; color: var(--muted); }
.bb.accent { border-color: var(--accent); color: var(--accent); } .bb.pass { border-color: var(--pass); color: var(--pass); } .bb.fail { border-color: var(--fail); color: var(--fail); }
.bres { font-size: 11px; margin-top: 4px; }
.bthumb { float: right; width: 46px; height: 46px; margin: -2px -4px 0 4px; object-fit: contain; image-rendering: auto; }
.v3d { width: 100%; height: 230px; border: 1px solid var(--line); border-radius: 4px; background: radial-gradient(circle at 50% 40%, #1d2228, #0e1012 75%); display: block; }
.bempty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--muted); pointer-events: none; }
.bempty button { pointer-events: auto; }
.binsp { border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.ihead { display: flex; gap: 6px; align-items: flex-start; padding: 9px 10px; border-bottom: 1px solid var(--line); }
.ibody { overflow: auto; padding: 8px 10px 40px; flex: 1; min-height: 0; }
.blib { border: 1px solid var(--line); border-radius: 4px; padding: 6px 7px; margin-bottom: 6px; background: var(--bg); }
.blib .tree { font-family: var(--mono); font-size: 10.5px; color: var(--muted); white-space: pre-wrap; margin: 3px 0; }
.bexp { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line2); border-radius: 3px; padding: 1px 7px; background: var(--panel); cursor: help; }
.bexp.good { border-color: var(--pass); color: var(--pass); } .bexp.bad { border-color: var(--fail); color: var(--fail); }
.bc.expfail { box-shadow: 0 0 0 2px var(--fail), 0 2px 8px rgba(0,0,0,.35); }
.bc.dragging { opacity: .85; box-shadow: 0 8px 24px rgba(0,0,0,.5); z-index: 2; }
.bc .bch { cursor: grab; } .bcan.spacepan, .bcan.spacepan .bc { cursor: grab; }
.bcan { touch-action: none; }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 20; }
.mbox { width: min(460px, 92vw); background: var(--panel); border: 1px solid var(--line2); border-radius: 6px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.mbox label { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--muted); }

h2 { font-size: 16px; margin: 0 0 10px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
h2 small { font-family: var(--mono); font-size: 11px; color: var(--dim); font-weight: 400; }
h3 { margin: 16px 0 6px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; font-weight: 500; }
.cols { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 16px; align-items: start; }
.cols3 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; margin-bottom: 12px; }
.list { border: 1px solid var(--line); border-radius: 4px; background: var(--panel); max-height: calc(100vh - 170px); overflow: auto; }
.li { padding: 4px 9px; border-bottom: 1px solid var(--line); cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
.li:hover { background: var(--panel2); } .li.sel { background: var(--panel2); box-shadow: inset 3px 0 var(--accent); }
.li .t { font-family: var(--mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.li .s { font-size: 11px; color: var(--muted); white-space: nowrap; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 3px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
td.k { font-family: var(--mono); font-size: 12px; color: var(--link); white-space: nowrap; }
pre { margin: 0; white-space: pre-wrap; word-break: break-word; font-family: var(--mono); font-size: 12px; }
pre.box { background: var(--bg); border: 1px solid var(--line); padding: 8px 10px; border-radius: 3px; max-height: 420px; overflow: auto; }
.chip { display: inline-flex; gap: 4px; align-items: baseline; font-family: var(--mono); font-size: 11.5px; border: 1px solid var(--line2); border-radius: 3px; padding: 0 6px; cursor: pointer; background: var(--panel2); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: middle; }
.chip:hover { border-color: var(--accent); }
.chip .c { color: var(--accent); } .chip .r { color: var(--dim); }
.tag { display: inline-block; font-family: var(--mono); font-size: 11px; border: 1px solid var(--line2); border-radius: 10px; padding: 0 7px; margin: 1px 2px; color: var(--muted); }
.lnk { cursor: pointer; color: var(--link); font-family: var(--mono); font-size: 12px; }
.lnk:hover { text-decoration: underline; }
.verdict { padding: 9px 12px; border-radius: 4px; margin-bottom: 12px; border: 1px solid var(--line); border-left-width: 4px; background: var(--panel); }
.verdict.ok { border-left-color: var(--pass); } .verdict.bad { border-left-color: var(--fail); } .verdict.warn { border-left-color: var(--err); }
.verdict b { font-size: 14px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.inv td { padding: 3px 4px; } .inv input { width: 100%; }
.str { color: #c3a86b; } .num { color: #b392d6; } .bool { color: #d68a92; } .nil { color: var(--dim); font-style: italic; }
details > summary { cursor: pointer; color: var(--muted); }
.meth { display: grid; grid-template-columns: 1fr auto; gap: 6px; padding: 3px 0; border-bottom: 1px solid var(--line); align-items: start; }
.meth .sig { font-family: var(--mono); font-size: 11.5px; overflow-wrap: anywhere; }
.meth .sig .n { color: var(--link); } .meth .res { grid-column: 1 / -1; padding-left: 12px; }
.monitor div { white-space: pre-wrap; font-family: var(--mono); font-size: 11.5px; }
.monitor .why { color: var(--err); }
.crumbs { font-family: var(--mono); font-size: 11.5px; color: var(--muted); overflow-wrap: anywhere; }
.crumbs a { color: var(--link); cursor: pointer; }
.consoleout .entry { border-bottom: 1px solid var(--line); padding: 6px 0; }
.consoleout .src { color: var(--accent); font-family: var(--mono); font-size: 12px; white-space: pre-wrap; }
.empty { color: var(--muted); padding: 30px; text-align: center; }
.tabs { display: flex; gap: 2px; margin-bottom: 10px; border-bottom: 1px solid var(--line); }
.tab { padding: 5px 12px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; }
.tab.on { color: var(--text); border-bottom-color: var(--accent); }
.step { display: inline-flex; gap: 4px; align-items: center; font-family: var(--mono); font-size: 11px; border: 1px solid var(--accent); color: var(--accent); border-radius: 10px; padding: 0 4px 0 7px; margin: 1px 2px; }
.step b { cursor: pointer; color: var(--muted); font-weight: 400; } .step b:hover { color: var(--fail); }
.panel { border: 1px solid var(--line); border-radius: 3px; margin: 4px 0; background: var(--bg); }
.panel .ph { font-size: 11px; color: var(--muted); padding: 2px 8px; border-bottom: 1px solid var(--line); text-transform: uppercase; letter-spacing: .05em; }
.panel table { table-layout: fixed; width: 100%; } .panel table td { padding: 1px 8px; font-size: 12px; overflow-wrap: anywhere; } .panel table td.k { width: 38%; } .panel tr.chg td { background: rgba(217,164,65,.10); } .panel .was { color: var(--dim); text-decoration: line-through; margin-right: 6px; }
.pform { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 4px 0; } .pform label { font-size: 11.5px; color: var(--muted); display: flex; gap: 4px; align-items: center; }
.act { border-bottom: 1px solid var(--line); padding: 5px 0; } .act .doc { font-size: 11.5px; color: var(--muted); }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>PZ ENGINE WORKBENCH<small>real engine, in the browser</small></h1>
    <select id="mod" title="Mod context: its scripts, Lua and hooks are loaded into the VM"></select>
    <span id="bstate" class="badge">idle</span>
    <span id="binfo" class="muted mono" style="font-size:11px"></span>
    <span style="flex:1"></span>
    <button class="btn small" id="reloadTools" title="Re-run dashboard/workbench/*.lua in the live VM">reload tools</button>
    <button class="btn small" id="restart" title="Kill and re-boot this mod's VM">restart VM</button>
    <a class="btn small" href="/studio" title="Composer studio: listen, A/B and chart a mod's text generators">studio</a>
    <a class="btn small" href="/">← tests dashboard</a>
  </header>
  <main>
    <div id="view"></div>
    <div id="boot"><div class="box"><div class="row"><span class="spin"></span><b id="bootTitle">Booting engine…</b><span id="bootTime" class="muted mono"></span></div>
      <p class="muted" style="margin:6px 0">A resident Kahlua VM is starting with this mod loaded, and the real PZ engine (projectzomboid.jar) is parsing every script file. Later calls are instant.</p>
      <pre id="bootLog"></pre></div></div>
  </main>
</div>
<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// Lua's JSON can't tell [] from {} for an empty table.
const arr = (x) => Array.isArray(x) ? x : (x && typeof x === "object" && !Object.keys(x).length ? [] : (x == null ? [] : x));
const short = (cls) => String(cls || "").split(".").pop();

// ── state + deep links ─────────────────────────────────────────────────────
const S = { mods: [], mod: null, tool: "board", st: {}, pending: 0, status: null };
function readHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  const o = {};
  for (const [k, v] of h) o[k] = v;
  return o;
}
function writeHash(extra) {
  const o = { mod: S.mod, ...(extra || {}) };
  const p = new URLSearchParams();
  for (const [k, v] of Object.entries(o)) if (v !== undefined && v !== null && v !== "") p.set(k, v);
  history.replaceState(null, "", "#" + p.toString());
}

// ── API ────────────────────────────────────────────────────────────────────
async function call(tool, args) {
  S.pending++;
  pollStatusSoon();
  try {
    const r = await fetch(`/api/wb/${S.mod}/call`, { method: "POST", body: JSON.stringify({ tool, args: args || {} }) }).then((r) => r.json());
    if (!r.ok) throw Object.assign(new Error(r.error || "call failed"), { out: r.out });
    if (r.value && r.value.error) throw Object.assign(new Error(r.value.error), { out: r.out });
    return Object.assign(r.value ?? {}, { _out: r.out, _ms: r.ms });
  } finally {
    S.pending--;
    pollStatusSoon();
  }
}

let pollTimer = null;
function pollStatusSoon() { clearTimeout(pollTimer); pollTimer = setTimeout(pollStatus, 150); }
async function pollStatus() {
  if (!S.mod) return;
  const st = S.status = await fetch(`/api/wb/${S.mod}/status`).then((r) => r.json()).catch(() => null);
  if (!st) return;
  const b = $("#bstate");
  b.className = "badge " + ({ ready: "ok", dead: "bad", booting: "run", loading: "run" }[st.state] || "");
  b.textContent = st.state === "ready" ? "engine ready" + (st.info && !st.info.engine ? " (no engine)" : "") : st.state;
  b.title = st.error || "";
  $("#binfo").textContent = st.state === "ready" && st.info ? `${st.info.gameVersion || ""} · boot ${(st.bootMs / 1000).toFixed(1)}s · ${arr(st.info.tools).length} tools`
    : st.state === "dead" && st.error ? st.error : "";
  const booting = st.state === "booting" || st.state === "loading";
  $("#boot").classList.toggle("show", booting && S.pending > 0);
  if (booting) {
    $("#bootTitle").textContent = st.state === "loading" ? "Loading workbench tools…" : "Booting engine for " + S.mod + "…";
    $("#bootTime").textContent = st.elapsedMs ? (st.elapsedMs / 1000).toFixed(1) + "s" : "";
    const pre = $("#bootLog");
    pre.textContent = arr(st.bootLog).join("\n");
    pre.scrollTop = pre.scrollHeight;
  }
  if (booting || S.pending > 0) pollTimer = setTimeout(pollStatus, 600);
}

// ── value rendering (everything Java is clickable into the explorer) ──────
function val(v, depth = 0) {
  if (v === null || v === undefined) return `<span class="nil">nil</span>`;
  if (typeof v === "string") return `<span class="str">"${esc(v.length > 400 ? v.slice(0, 400) + "…" : v)}"</span>`;
  if (typeof v === "number") return `<span class="num">${v}</span>`;
  if (typeof v === "boolean") return `<span class="bool">${v}</span>`;
  if (v.$nil) return `<span class="nil">nil</span>`;
  if (v.$fn) return `<span class="dim">function</span>`;
  if (v.$java) {
    // "Base.Axe:zombie.…HandWeapon@1a2b" -> "Base.Axe"; bare "pkg.Class@1a2b" -> "@1a2b"
    const s = String(v.str || "");
    let label = s.replace(/:?[\w.$]+@[0-9a-f]+$/, "");
    if (!label) label = (s.match(/@[0-9a-f]+$/) || [""])[0];
    if (label.startsWith(short(v.class))) label = label.slice(short(v.class).length);
    return `<span class="chip" data-ref="${v.ref}" title="${esc(v.class)}\n${esc(s)}"><span class="c">${esc(short(v.class))}</span>${esc(label.slice(0, 60))}<span class="r">$${v.ref}</span></span>`;
  }
  if (v.$table) return `<span class="chip" data-ref="${v.ref}"><span class="c">table</span>${v.count} entr${v.count === 1 ? "y" : "ies"}<span class="r">$${v.ref}</span></span>`;
  if (Array.isArray(v)) {
    if (!v.length) return `<span class="dim">[]</span>`;
    if (depth > 2) return `<span class="dim">[${v.length}]</span>`;
    return `<span class="dim">[</span>${v.map((x) => val(x, depth + 1)).join(", ")}<span class="dim">]</span>`;
  }
  const ks = Object.keys(v);
  if (!ks.length) return `<span class="dim">{}</span>`;
  if (depth > 2) return `<span class="dim">{${ks.length}}</span>`;
  return `<details ${depth < 1 ? "open" : ""} style="display:inline-block;vertical-align:top"><summary class="dim">{${ks.length}}</summary><table>${ks.map((k) => `<tr><td class="k">${esc(k)}</td><td>${val(v[k], depth + 1)}</td></tr>`).join("")}</table></details>`;
}
document.addEventListener("click", (e) => {
  // Any Java/table chip anywhere opens as an object card, wired from the
  // card whose inspector it was shown in.
  const c = e.target.closest("[data-ref]");
  if (c && !e.target.closest("button")) {
    e.preventDefault();
    const B = TOOLS.board, from = c.closest("#binsp") ? B.board().sel : null;
    B.exploreRef(+c.dataset.ref, c.textContent.trim().slice(0, 40), from);
  }
});

// ── object explorer (renders into an object card's inspector) ──────────────
// root = { expr } (re-resolvable) or { ref } (this VM only); steps = path.
// hooks.child(step, label) opens a child object card for a sub-path.
async function explorerInto(body, root, steps, hooks) {
  body.innerHTML = `<span class="spin"></span>`;
  let r;
  try { r = await call("resolvePath", { expr: root.expr, ref: root.ref, steps }); }
  catch (e) { body.innerHTML = `<pre class="fail">${esc(e.message)}</pre>`; return null; }
  if (r.failedAt) { body.innerHTML = `<pre class="fail">step ${r.failedAt} (${esc(r.step)}): ${esc(r.error)}</pre>`; return null; }
  const v = r.value;
  if (!v || (!v.$java && !v.$table)) { body.innerHTML = `<div style="margin-top:6px">${val(v)}</div>`; return v; }
  const ins = await call("inspect", { ref: v.ref }).catch((e) => ({ error: e.message }));
  if (ins.error) { body.innerHTML = `<pre class="fail">${esc(ins.error)}</pre>`; return v; }
  const sub = (k, label) => `<a class="lnk" data-sub="${esc(k)}" title="open as a card">${label}</a>`;
  let h = "";
  if (ins.kind === "table") {
    h += `<h3>table · ${ins.count} entries</h3><table>${arr(ins.entries).map((e) => `<tr><td class="k">${sub("." + e.key, esc(e.key))}</td><td>${val(e.value)}</td></tr>`).join("")}</table>`;
    body.innerHTML = h; bindSubs(); return v;
  }
  const api = ins.api;
  h += `<div style="margin:2px 0 4px"><b class="mono" style="color:var(--accent)">${esc(ins.class)}</b>${api && api.inferred ? ` <span class="badge" title="toString gave no class; matched by method set">inferred ${api.inferred}</span>` : ""}</div>
    <div class="mono muted" style="font-size:11px;overflow-wrap:anywhere">${esc(ins.str)}</div>
    ${api ? `<div class="muted" style="font-size:11px;margin-top:3px">${api.chain.map(esc).join(" → ")}</div>` : `<div class="warn" style="font-size:11px">no API index entry: signatures unknown</div>`}`;
  if (ins.size != null) h += `<h3>elements · ${ins.size}</h3>${arr(ins.elements).map((e, i) => `<div class="row" style="padding:1px 0">${sub("#" + i, "[" + i + "]")} ${val(e)}</div>`).join("") || `<span class="dim">empty</span>`}`;
  const methods = arr(ins.methods);
  const sigs = (m) => (api && api.methods[m]) || null;
  const zero = methods.filter((m) => { const sg = sigs(m); return sg ? sg.some((x) => x.arity === 0 && !x.static) : /^(get|is|has|can)[A-Z]/.test(m); });
  const getters = zero.filter((m) => /^(get|is|has|can)[A-Z]/.test(m));
  h += `<h3>methods · ${methods.length} Lua-exposed</h3>
    <div class="row" style="margin-bottom:6px"><input class="inp" id="mq" placeholder="filter methods" style="flex:1">
      <button class="btn small" id="snap" title="Call every zero-arg getter (${getters.length}) and show the values">snapshot ${getters.length} getters</button></div>
    <div id="snapout"></div><div id="mlist"></div>`;
  body.innerHTML = h;
  function bindSubs() { for (const a of $$("[data-sub]", body)) a.onclick = (e) => { e.preventDefault(); hooks.child(a.dataset.sub); }; }
  bindSubs();
  const renderMethods = (q) => {
    $("#mlist", body).innerHTML = methods.filter((m) => !q || m.toLowerCase().includes(q.toLowerCase())).map((m) => {
      const sg = sigs(m), z = zero.includes(m);
      const sigTxt = sg ? sg.map((x) => esc(x.sig).replace(esc(m), `<span class="n">${esc(m)}</span>`) + (x.declaredIn ? ` <span class="dim">· ${esc(x.declaredIn)}</span>` : "")).join("<br>") : `<span class="n">${esc(m)}</span><span class="dim">(?)</span>`;
      return `<div class="meth" data-m="${esc(m)}"><div class="sig">${sigTxt}</div><div>${z ? `<button class="btn small" data-call="${esc(m)}" title="call with no arguments">▶</button>` : ""}
        <button class="btn small" data-args="${esc(m)}" title="call with arguments">ƒ(…)</button></div><div class="res"></div></div>`;
    }).join("");
  };
  renderMethods("");
  $("#mq", body).oninput = (e) => renderMethods(e.target.value);
  $("#mlist", body).onclick = async (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    const row = b.closest(".meth"), res = $(".res", row), m = row.dataset.m;
    let args = [];
    if (b.dataset.args !== undefined) {
      const sg = sigs(m), hint = sg ? sg.map((x) => x.sig).join("\n") : m + "(?)";
      const raw = prompt(`Arguments for ${m} as JSON array. $N = a live object, e.g. [1, "Base.Axe", "$12"]\n\n${hint}`, "[]");
      if (raw == null) return;
      try { args = JSON.parse(raw).map((a) => typeof a === "string" && /^\$\d+$/.test(a) ? { $ref: +a.slice(1) } : a); }
      catch (err) { res.innerHTML = `<span class="fail">bad JSON: ${esc(err.message)}</span>`; return; }
    }
    res.innerHTML = `<span class="spin"></span>`;
    const r2 = await call("invoke", { ref: v.ref, method: m, args }).catch((er) => ({ ok: false, error: er.message }));
    res.innerHTML = r2.ok ? `→ ${val(r2.value)} <span class="dim">${r2.ms != null ? r2.ms.toFixed(2) + "ms" : ""}</span>${!args.length && (r2.value?.$java || r2.value?.$table) ? ` ${sub(m, "→ card")}` : ""}`
      : `<span class="fail">${esc(r2.error)}</span>`;
    bindSubs();
  };
  $("#snap", body).onclick = async () => {
    $("#snapout", body).innerHTML = `<span class="spin"></span>`;
    const r3 = await call("getters", { ref: v.ref, methods: getters });
    const vals = r3.values || {};
    $("#snapout", body).innerHTML = `<table style="margin-bottom:10px">${Object.keys(vals).sort().map((k) => `<tr><td class="k">${(vals[k] && (vals[k].$java || vals[k].$table)) ? sub(k, esc(k)) : esc(k)}</td><td>${val(vals[k])}</td></tr>`).join("")}</table>
      ${Object.keys(r3.failed || {}).length ? `<details><summary>${Object.keys(r3.failed).length} getter(s) threw</summary><table>${Object.entries(r3.failed).map(([k, er]) => `<tr><td class="k">${esc(k)}</td><td class="fail mono" style="font-size:11px">${esc(er)}</td></tr>`).join("")}</table></details>` : ""}`;
    bindSubs();
  };
  return v;
}

// ── addons (dashboard/workbench/40_addons.lua) ─────────────────────────────
// Addons are declared in Lua (WB.addon{...}); everything here is generated
// from that declaration: param forms, step chips, panels.
async function addonsFor(type) {
  S.addonCache = S.addonCache || {};
  const key = S.mod + "|" + (type || "");
  if (!S.addonCache[key]) S.addonCache[key] = call("addons", type ? { type } : {}).catch((e) => ({ addons: [], loadErrors: [], error: e.message }));
  return S.addonCache[key];
}
function paramForm(act, values) {
  return arr(act.params).map((p) => {
    const v = values && values[p.name] !== undefined ? values[p.name] : p.default;
    const name = `data-pn="${esc(p.name)}" data-pt="${esc(p.type || "string")}"`;
    let inp;
    if (p.type === "select") inp = `<select class="inp" ${name}>${arr(p.options).map((o) => `<option ${String(o) === String(v) ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
    else if (p.type === "bool") inp = `<input type="checkbox" ${name} ${v ? "checked" : ""}>`;
    else if (p.type === "json") inp = `<input class="inp mono" ${name} style="width:200px" value="${esc(v === undefined ? "" : JSON.stringify(v))}">`;
    else inp = `<input class="inp mono" ${name} ${p.type === "number" ? `type="number" style="width:90px"` : `style="width:140px"`} value="${esc(v ?? "")}">`;
    return `<label title="${esc(p.doc || "")}">${esc(p.label || p.name)} ${inp}</label>`;
  }).join("");
}
function readParams(el) {
  const out = {};
  for (const i of $$("[data-pn]", el)) {
    const t = i.dataset.pt;
    let v = t === "bool" ? i.checked : i.value;
    if (t === "number") v = v === "" ? undefined : +v;
    if (t === "json") { try { v = v.trim() ? JSON.parse(v) : undefined; } catch (e) { throw new Error(i.dataset.pn + ": bad JSON (" + e.message + ")"); } }
    out[i.dataset.pn] = v;
  }
  return out;
}
const stepText = (st) => `${st.addon}/${st.action}${Object.keys(st.params || {}).length ? " " + Object.entries(st.params).map(([k, v]) => k + "=" + (typeof v === "object" ? JSON.stringify(v) : v)).join(" ") : ""}`;
// Panels with an optional "before" set: changed keys are highlighted, with the old value struck through.
function panelsHtml(panels, before) {
  const prev = {};
  for (const p of arr(before)) prev[p.addon + "/" + p.id] = p.data;
  return arr(panels).filter((p) => p.data != null || p.error).map((p) => {
    const was = before ? prev[p.addon + "/" + p.id] : undefined;
    if (p.error) return `<div class="panel"><div class="ph">${esc(p.title)}</div><pre class="fail" style="padding:4px 8px">${esc(p.error)}</pre></div>`;
    const d = p.data;
    if (typeof d !== "object" || Array.isArray(d)) return `<div class="panel"><div class="ph">${esc(p.title)}</div><div style="padding:3px 8px">${val(d)}</div></div>`;
    const keys = Array.from(new Set([...Object.keys(d), ...Object.keys(was || {})])).sort();
    return `<div class="panel"><div class="ph">${esc(p.title)} <span class="dim" style="text-transform:none">· ${esc(p.addonName || p.addon)}</span></div><table>${keys.map((k) => {
      const changed = was && JSON.stringify(was[k]) !== JSON.stringify(d[k]);
      return `<tr class="${changed ? "chg" : ""}"><td class="k">${esc(k)}</td><td>${changed && was[k] !== undefined ? `<span class="was">${esc(typeof was[k] === "object" ? JSON.stringify(was[k]) : String(was[k]))}</span>` : ""}${d[k] === undefined ? `<span class="dim">(gone)</span>` : val(d[k], 1)}</td></tr>`;
    }).join("")}</table></div>`;
  }).join("");
}

// ── 3D item view (pzchar .glb, three.js vendored by pzchar) ────────────────
// One renderer at a time: a new view disposes the previous one.
let V3D = null;
async function view3d(canvas, vis) {
  if (V3D) { V3D.stop(); V3D = null; }
  let THREE, GLTFLoader, OrbitControls;
  try {
    THREE = await import("three");
    ({ GLTFLoader } = await import("three/addons/loaders/GLTFLoader.js"));
    ({ OrbitControls } = await import("three/addons/controls/OrbitControls.js"));
  } catch (e) { canvas.replaceWith(Object.assign(document.createElement("div"), { className: "dim", textContent: "3D view needs pzchar's three.js: " + e.message })); return; }
  if (!canvas.isConnected) return;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
  renderer.setSize(w, h, false);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight(0xdfe6ee, 0x2a2420, 1.6));
  const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(2, 3, 2); scene.add(key);
  const camera = new THREE.PerspectiveCamera(30, w / h, 0.001, 100);
  const controls = new OrbitControls(camera, canvas);
  controls.enableDamping = true; controls.autoRotate = true; controls.autoRotateSpeed = 1.6;
  let raf = 0, alive = true;
  const stop = () => { alive = false; cancelAnimationFrame(raf); controls.dispose(); renderer.dispose(); };
  V3D = { stop };
  const url = `/api/wb/${encodeURIComponent(S.mod)}/model?ref=${encodeURIComponent(vis.model)}&fmt=glb`;
  new GLTFLoader().load(url, (gltf) => {
    if (!alive) return;
    const obj = gltf.scene;
    obj.traverse((o) => {
      if (!o.isMesh) return;
      o.material = o.material.clone();
      o.material.side = THREE.DoubleSide;
      if (vis.tint) o.material.color.multiply(new THREE.Color(vis.tint));
      if (vis.glow && o.material.emissive) { o.material.emissive = new THREE.Color(vis.glow); o.material.emissiveIntensity = 0.16; }
    });
    scene.add(obj);
    const box = new THREE.Box3().setFromObject(obj), size = box.getSize(new THREE.Vector3()), centre = box.getCenter(new THREE.Vector3());
    const r = Math.max(size.length() / 2, 1e-3), dist = r / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * 1.15;
    // Look at the broadest face: along the item's THINNEST axis, a little
    // off-axis and above, so blades and flat items don't present edge-on.
    const ax = ["x", "y", "z"].sort((a, b) => size[a] - size[b])[0];
    const dir = new THREE.Vector3(0.25, 0.3, 0.25); dir[ax] = 1;
    camera.position.copy(centre).add(dir.normalize().multiplyScalar(dist));
    camera.near = dist / 100; camera.far = dist * 10; camera.updateProjectionMatrix();
    controls.target.copy(centre); controls.update();
    const tick = () => { if (!alive || !canvas.isConnected) { stop(); return; } controls.update(); renderer.render(scene, camera); raf = requestAnimationFrame(tick); };
    tick();
  }, undefined, () => { if (alive && canvas.isConnected) canvas.replaceWith(Object.assign(document.createElement("div"), { className: "dim", textContent: "no 3D model for " + vis.model })); });
}

// ── tools (pluggable: add an entry here + a dashboard/workbench/*.lua) ────
const TOOLS = {};
function tool(id, def) { TOOLS[id] = def; }

// Board: a crafting canvas ---------------------------------------------------
// Cards are live engine objects (items) and recipes. Crafting spawns the
// outputs as new cards wired to the recipe; outputs feed the next recipe, so a
// chain runs on the SAME objects. Details live in ONE inspector for the
// selected card. The board is a replayable scenario (types + addon steps +
// crafts), because live refs die with the VM; saved boards are BLUEPRINTS
// (library: mod templates + your own), optionally with `expect` checks.
tool("board", {
  icon: "▦", label: "Board",
  st: { b: null, pal: null, palQ: "", palTab: "find", lib: null, msg: "", busy: false },
  key() { return "wbBoard:" + S.mod; },
  board() {
    const st = this.st;
    if (!st.b || st.b.mod !== S.mod) {
      let b = null;
      try { b = JSON.parse(localStorage[this.key()] || "null"); } catch (_) {}
      st.b = b && b.cards ? b : this.emptyBoard();
      st.b.mod = S.mod;
      st.checked = false; st.lib = null;
    }
    return st.b;
  },
  emptyBoard() { return { cards: [], view: { x: 60, y: 60, z: 1 }, sel: null, seq: 1, expect: [], meta: null, results: null }; },
  save() { localStorage[this.key()] = JSON.stringify(this.board()); },
  card(id) { return this.board().cards.find((c) => c.id === id); },
  newCard(c) { const b = this.board(); c.id = "c" + b.seq++; b.cards.push(c); return c; },
  say(msg, busy) { this.st.msg = msg || ""; this.st.busy = !!busy; const el = $("#bmsg"); if (el) el.innerHTML = (busy ? `<span class="spin"></span> ` : "") + esc(this.st.msg); },
  isStock(c) { return c.kind === "item" && (c.count || 1) > 1; },
  // Random rolls. Boards default to seeded (varied, replayable); blueprints
  // carry their rng. reset=true restarts the seed's sequence.
  rng() { const b = this.board(); if (!b.rng) b.rng = { mode: "seeded", seed: 1 }; return b.rng; },
  async applyRng(reset) {
    const r = this.rng();
    if (!reset && this.st.rngApplied === JSON.stringify(r) + S.mod) return;
    let seed = r.seed;
    if (r.mode === "random") seed = Math.floor(Math.random() * 2147483646) + 1;
    const res = await call("setRandom", { mode: r.mode === "midpoint" ? "midpoint" : "seeded", seed }).catch(() => null);
    this.st.rngApplied = JSON.stringify(r) + S.mod;
    if (res && r.mode === "random") this.st.lastSeed = res.seed;
  },
  // Recipes and board actions are both "process" cards: inputs -> outputs.
  isProc(c) { return c && (c.kind === "recipe" || c.kind === "action"); },

  // Live refs die with the VM (idle shutdown, restart). Probe one; if it's
  // gone, mark everything stale rather than failing on each click.
  async checkLive() {
    const st = this.st, b = this.board();
    if (st.checked) return;
    st.checked = true;
    const probe = b.cards.find((c) => c.kind === "item" && c.ref && !c.consumed);
    if (!probe) return;
    try { await call("addonPanels", { ref: probe.ref }); }
    catch (_) {
      for (const c of b.cards) if (c.kind === "item") { c.stale = true; c.ref = null; }
      this.save(); this.draw();
      this.say("The engine VM restarted since this board was built: ↻ run all rebuilds it.");
    }
  },

  // ── object cards (Explore, on the canvas) ──
  // { kind:"object", label, expr | rootRef | from(cardId), steps, ref, cls }
  // from = an item card (its live ref) or a parent object card (its resolved
  // ref); expr re-resolves anywhere; rootRef lives only as long as the VM.
  exploreRef(ref, label, fromId) {
    const from = fromId && this.card(fromId);
    const p = from ? this.freshSpot(from.x + 260, from.y + 40) : this.centerWorld();
    const c = this.newCard({ kind: "object", label: label || "$" + ref, rootRef: ref, steps: [], x: p.x, y: p.y, linkFrom: from ? from.id : null });
    this.board().sel = c.id;
    this.save(); this.draw(); this.inspect();
    return c;
  },
  exploreCard(fromId, step, label) {
    const from = this.card(fromId);
    const p = this.freshSpot(from.x + 260, from.y + (from.kind === "object" ? 30 : 0));
    const c = this.newCard({ kind: "object", label: label || (step ? stepLabel(step) : (from.snap && from.snap.name) || from.type || "object"),
                             from: fromId, steps: step ? [step] : [], x: p.x, y: p.y });
    this.board().sel = c.id;
    this.save(); this.draw(); this.inspect();
    return c;
    function stepLabel(st) { return st.startsWith("#") ? "[" + st.slice(1) + "]" : st.startsWith(".") ? st.slice(1) : ":" + st + "()"; }
  },
  exploreExpr(expr) {
    const p = this.centerWorld();
    const c = this.newCard({ kind: "object", label: expr.length > 40 ? expr.slice(0, 38) + "…" : expr, expr, steps: [], x: p.x, y: p.y });
    this.board().sel = c.id;
    this.save(); this.draw(); this.inspect();
  },
  // The root this object card resolves from (resolving a parent first).
  async objectRoot(o) {
    if (o.expr) return { expr: o.expr };
    if (o.from) {
      const f = this.card(o.from);
      if (!f) return o.rootRef ? { ref: o.rootRef } : null;
      if (f.kind === "object") { const v = await this.resolveObject(f); return v && v.ref ? { ref: v.ref } : null; }
      return f.ref ? { ref: f.ref } : null;
    }
    return o.rootRef ? { ref: o.rootRef } : null;
  },
  async resolveObject(o) {
    const root = await this.objectRoot(o);
    if (!root) return null;
    const r = await call("resolvePath", { expr: root.expr, ref: root.ref, steps: o.steps }).catch(() => null);
    const v = r && !r.failedAt ? r.value : null;
    if (v && v.$java) { o.cls = short(v.class); o.str = String(v.str || "").slice(0, 60); }
    if (v && v.$table) { o.cls = "table"; o.str = v.count + " entries"; }
    o.ref = v && v.ref;
    return v;
  },
  async inspectObject(el, o) {

  async refreshWorld(c) {

    catch (e) { c.err = e.message; }

  // Atlas lookups + page images (pzmap's extracted Tiles2x packs).
  async ensureSprites(names) {
    const S2 = (this.st.sprites = this.st.sprites || {});
    const need = [...new Set(names)].filter((n) => !(n in S2));
    for (let i = 0; i < need.length; i += 400) {
      const r = await fetch(`/api/wb/sprites?names=${encodeURIComponent(need.slice(i, i + 400).join(","))}`).then((x) => x.json()).catch(() => ({ sprites: {} }));
      for (const n of need.slice(i, i + 400)) S2[n] = (r.sprites || {})[n] || null;
    }
    const pages = [...new Set(names.map((n) => S2[n] && S2[n].page).filter(Boolean))];
    const P = (this.st.pages = this.st.pages || {});
    await Promise.all(pages.filter((u) => !P[u]).map((u) => new Promise((res) => { const im = new Image(); im.onload = () => { P[u] = im; res(); }; im.onerror = () => { P[u] = null; res(); }; im.src = u; })));
  },
  // Draw a sprite into a 128x256 frame whose top-left is (fx, fy), scaled.
  drawSprite(ctx, name, fx, fy, k) {
    const e = (this.st.sprites || {})[name], im = e && (this.st.pages || {})[e.page];
    if (!im) return false;
    ctx.drawImage(im, e.pos[0], e.pos[1], e.size[0], e.size[1], fx + e.off[0] * k, fy + e.off[1] * k, e.size[0] * k, e.size[1] * k);
    return true;
  },
  // One square's stack, iso-framed (the floor diamond at the frame bottom).
  // Fitted to the stack's bounding box in frame space, so a tall tank and a
  // flat floor tile both fill the thumbnail.
  paintSquare(cv, sprites) {
    const ctx = cv.getContext("2d"), S2 = this.st.sprites || {};
    ctx.clearRect(0, 0, cv.width, cv.height);
    let x0 = 128, y0 = 256, x1 = 0, y1 = 0;
    for (const n of sprites) { const e = S2[n]; if (!e) continue; x0 = Math.min(x0, e.off[0]); y0 = Math.min(y0, e.off[1]); x1 = Math.max(x1, e.off[0] + e.size[0]); y1 = Math.max(y1, e.off[1] + e.size[1]); }
    if (x1 <= x0 || y1 <= y0) return;
    const k = Math.min(cv.width / (x1 - x0), cv.height / (y1 - y0));
    const fx = (cv.width - (x1 - x0) * k) / 2 - x0 * k, fy = cv.height - (y1 - y0) * k - y0 * k;
    for (const n of sprites) this.drawSprite(ctx, n, fx, fy, k);
  },
  // An area around the card's tile, painter-sorted like pzmap (z, x+y, x).
  async paintArea(cv, c, r) {
    const t = await call("worldTiles", { x0: c.wx - r, y0: c.wy - r, x1: c.wx + r, y1: c.wy + r, zLo: 0, zHi: Math.max(0, c.wz) + 2 }).catch(() => null);
    if (!t || !cv.isConnected) return;
    await this.ensureSprites(t.tiles.flatMap((q) => q.s));
    const tiles = t.tiles.sort((a, b) => a.z - b.z || (a.x + a.y) - (b.x + b.y) || a.x - b.x);
    const ctx = cv.getContext("2d"), W = cv.width, H = cv.height;
    const span = 2 * r + 1, k = W / (span * 128 + 64);
    const ox = W / 2, oy = H / 2 - (r + 1) * 32 * k * 0.2;
    const at = (x, y, z) => [ox + ((x - c.wx) - (y - c.wy)) * 64 * k, oy + ((x - c.wx) + (y - c.wy)) * 32 * k - z * 192 * k];
    ctx.clearRect(0, 0, W, H);
    for (const q of tiles) {
      const [sx, sy] = at(q.x, q.y, q.z);
      ctx.globalAlpha = q.z > c.wz ? 0.35 : 1;
      for (const n of q.s) this.drawSprite(ctx, n, sx - 64 * k, sy + 64 * k - 256 * k, k);
    }
    ctx.globalAlpha = 1;
    const [cx, cy] = at(c.wx, c.wy, c.wz);
    ctx.strokeStyle = "#ffc247"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cx, cy + 64 * k); ctx.lineTo(cx + 64 * k, cy + 96 * k); ctx.lineTo(cx, cy + 128 * k); ctx.lineTo(cx - 64 * k, cy + 96 * k); ctx.closePath(); ctx.stroke();
    // click a tile in the render -> retarget the card
    cv.onclick = (e) => {
      const b = cv.getBoundingClientRect(), mx = (e.clientX - b.left) * (W / b.width) - ox, my = (e.clientY - b.top) * (H / b.height) - oy - 96 * k + c.wz * 192 * k;
      const u = mx / (64 * k), v = my / (32 * k);
      const dx = Math.round((u + v) / 2), dy = Math.round((v - u) / 2);
      if (!dx && !dy) return;
      c.wx += dx; c.wy += dy; c.label = `${c.wx},${c.wy},${c.wz}`;
      this.refreshWorld(c);
    };
  },
  // Verbs per object (62_worldverbs.lua + addons' worldVerbs): vanilla code
  // paths run on the real object. Items they make or take become item cards
  // wired from this world card; the square is re-read after.

      tb.onclick = () => this.worldTooltip(o, $(`[data-otip="${i}"]`, el));

      if (!o.entity && o.sprite) {

            return;
          }
          this.runWorldVerb(c, o, v, {}, i, el);
        };
        row.appendChild(b);
      }
    }));
  },

  // Entity binder: tile -> entity script (written into the mod) -> reloaded
  // -> built on this very object. Then craft at it, open it, fill it.
  entityBinder(c, o, host) {
    if (!host) return;
    const base = String((o.props && o.props.CustomName) || o.sprite).replace(/[^A-Za-z0-9]/g, "");
    const prefix = String(S.mod).replace(/[^A-Za-z0-9]/g, "");
    const ci = o.props && o.props.CustomItem;
    host.innerHTML = `<div class="rrow other" style="margin-top:4px">
      ${ci ? `<div class="warn" style="font-size:11.5px;margin-bottom:4px">This tile carries <span class="mono">CustomItem = ${esc(ci)}</span>: in game its entity is built from that ITEM's script (GameEntityFactory: CustomItem wins), so a sprite-bound entity here would be ignored on a real cell load. Put the components on <span class="mono">${esc(ci)}</span> instead (a thin item override).</div>` : ""}
      <div class="pform">
        <label>entity <input class="inp mono" data-eb="name" value="${esc(prefix + "_" + base)}" style="width:220px"></label>
        <label>window title <input class="inp" data-eb="displayName" value="${esc((o.props && o.props.CustomName) || base)}" style="width:160px"></label>
        <label title="CraftBench: recipes whose Tags include this craft here (leave empty for none)">workstation tag <input class="inp mono" data-eb="craftBench" placeholder="e.g. ${esc(base)}" style="width:150px"></label>
        <label title="FluidContainer capacity (empty: no fluid container)">fluid capacity <input class="inp mono" data-eb="capacity" type="number" placeholder="none" style="width:80px"></label>
        <label title="RainFactor: how much rain it collects (vanilla round barrel 0.25)">rain <input class="inp mono" data-eb="rain" type="number" step="0.05" placeholder="0" style="width:60px"></label>
      </div>
      <pre class="box" data-eb="preview" style="max-height:200px;font-size:10.5px"></pre>
      <div class="row" style="gap:6px"><button class="btn small primary" data-eb="go">write + build</button><span class="dim" data-eb="file" style="font-size:11px"></span></div></div>`;
    const val = (k) => { const x = $(`[data-eb="${k}"]`, host); return x ? x.value.trim() : ""; };
    const spec = () => ({ name: val("name"), sprite: o.sprite, displayName: val("displayName"), craftBench: val("craftBench") || undefined,
                          fluid: val("capacity") ? { capacity: +val("capacity"), rainFactor: val("rain") ? +val("rain") : undefined } : undefined });
    const post = (body) => fetch(`/api/wb/${encodeURIComponent(S.mod)}/entity-bind`, { method: "POST", body: JSON.stringify(body) }).then((x) => x.json().then((j) => ({ status: x.status, ...j })));
    const preview = debounce(async () => {
      const r = await post({ ...spec(), dry: true }).catch((e) => ({ error: e.message }));
      $(`[data-eb="preview"]`, host).textContent = r.text || r.error || "";
      $(`[data-eb="file"]`, host).textContent = r.file ? `→ ${r.file}${r.exists ? " (exists: will ask)" : ""}` : "";
    }, 200);
    for (const inp of $$("input[data-eb]", host)) inp.oninput = preview;
    preview();
    $(`[data-eb="go"]`, host).onclick = async () => {
      let w = await post(spec());
      if (w.status === 409) { if (!confirm(w.error + "\n\nOverwrite it?")) return; w = await post({ ...spec(), overwrite: true }); }
      if (w.error) { this.say("✗ " + w.error); return; }
      this.say(`wrote ${w.file}; reloading entity scripts…`, true);
      const rl = await call("devReload", { scripts: ["Entity"] }).catch((e) => ({ error: e.message }));
      if (rl.error || (rl.scripts && rl.scripts.err)) { this.say("✗ reload: " + (rl.error || rl.scripts.err)); return; }
      const b = await call("worldBindEntity", { ref: o.ref, name: "Base." + w.name }).catch((e) => ({ ok: false, msg: e.message }));
      this.say(`${b.ok ? "✓" : "✗"} ${w.name} @ ${c.label}: ${b.msg}${b.ok && spec().craftBench ? ` · recipes tagged ${spec().craftBench} now craft here` : ""}`);
      await this.refreshWorld(c);
    };
  },
  // Property stamper (63_stamper.lua): the sprite's PropertyContainer is
  // shared, so a stamp changes every object wearing the sprite, in this VM.
  // Export writes the boot-time Lua that makes it real in game.
  async stamper(c, o, host) {
    if (!host) return;
    const sprite = o.sprite;
    const PRESETS = {
      "disassemble: wood": { set: { CanScrap: "", Material: "Wood" } },
      "disassemble: metal (torch)": { set: { CanScrap: "", Material: "MetalPlates" } },
      "disassemble: metal + pipes": { set: { CanScrap: "", Material: "MetalPlates", Material2: "MetalPipe" } },
      "pick up (moveable)": { set: { IsMoveAble: "", PickUpWeight: "10" } },
      "container (new objects)": { set: { container: "crate", ContainerCapacity: "50" } },
      "jukebox (new objects)": { set: { IsoType: "IsoJukebox" }, tileType: "jukebox" },
    };
    let d, list;
    try { [d, list] = await Promise.all([call("spriteProps", { sprite }), call("stampList", {})]); }
    catch (e) { host.innerHTML = `<div class="fail">${esc(e.message)}</div>`; return; }
    const mine = arr(list.stamps).find((s) => s.sprite === sprite);
    const stamped = new Set(mine ? [...Object.keys(mine.set || {}), ...arr(mine.unset)] : []);
    const props = Object.entries(d.props || {}).sort(([a], [b]) => a.localeCompare(b));
    host.innerHTML = `<div class="rrow other" style="margin-top:4px">
      <div class="dim" style="font-size:11px;margin-bottom:4px">🏷 <span class="mono">${esc(sprite)}</span> · shared PropertyContainer: every object with this sprite sees a stamp · tile type <span class="mono">${esc(d.tileType)}</span>${mine ? ` · <span class="warn">stamped in this VM</span>` : ""}</div>
      <table style="font-size:11.5px">${props.map(([k, v]) => `<tr><td class="k${stamped.has(k) ? " warn" : ""}">${esc(k)}</td><td class="mono">${esc(v)}</td><td><button class="btn small" data-st-unset="${esc(k)}" title="unset ${esc(k)}">✕</button></td></tr>`).join("")}</table>
      <div style="margin:3px 0">${arr(d.flags).map((f) => `<span class="wchip">${esc(f)}</span>`).join("")}</div>
      <div class="pform">
        <label>key <input class="inp mono" data-st="key" style="width:130px" placeholder="CanScrap"></label>
        <label>value <input class="inp mono" data-st="val" style="width:110px" placeholder="(none)"></label>
        <button class="btn small" data-st="set">set</button>
        <label title="IsoFlagType name">flag <input class="inp mono" data-st="flag" style="width:100px" placeholder="solidfloor"></label>
        <button class="btn small" data-st="addflag">+ flag</button>
        <label title="IsoObjectType name: chooses the object class for objects created AFTER the stamp">tile type <input class="inp mono" data-st="tt" style="width:90px" placeholder="jukebox"></label>
        <button class="btn small" data-st="settt">set</button>
      </div>
      <div class="row" style="gap:6px;margin:4px 0">
        <select class="inp" data-st="preset"><option value="">preset…</option>${Object.keys(PRESETS).map((k) => `<option>${esc(k)}</option>`).join("")}</select>
        ${mine ? `<button class="btn small" data-st="undo">↶ undo this sprite</button>` : ""}
        <button class="btn small" data-st="export" ${arr(list.stamps).length ? "" : "disabled"} title="boot-time Lua for every sprite stamped in this VM">⇩ export (${arr(list.stamps).length})</button>
        <span data-st="msg" style="font-size:11px"></span>
      </div>
      <div data-st="exp"></div></div>`;
    const q = (k) => $(`[data-st="${k}"]`, host);
    const msg = (t, cls) => { q("msg").innerHTML = `<span class="${cls || "dim"}">${esc(t)}</span>`; };
    // Re-read the square (verbs, tooltips and props follow the stamp), then
    // reopen the stamper on the same sprite.
    const reopen = async () => {
      await this.refreshWorld(c);
      const idx = arr(c.info && c.info.objects).findIndex((x) => x.sprite === sprite);
      const h = $(`[data-oform="${idx}"]`);
      if (idx >= 0 && h) this.stamper(c, c.info.objects[idx], h);

      try { await call("stampSprite", { sprite, ...args }); await reopen(); }
      catch (e) { msg("✗ " + e.message, "fail"); }

    if (q("undo")) q("undo").onclick = async () => { await call("stampUndo", { sprite }).catch((e) => msg("✗ " + e.message, "fail")); await reopen(); };

  // ── the live dev loop (70_dev.lua + the server's DevWatch) ──
  async setLive(on) {
    this.st.live = on;
    const btn = $("#blive");
    if (btn) { btn.classList.toggle("primary", on); btn.textContent = on ? "⟳ live ●" : "⟳ live"; }
    const r = await fetch(`/api/wb/${encodeURIComponent(S.mod)}/dev`, { method: "POST", body: JSON.stringify({ on }) }).then((x) => x.json()).catch(() => null);
    this.st.devSeq = r ? r.seq : 0;
    clearInterval(this._devTimer);
    if (on) this._devTimer = setInterval(() => this.pollDev(), 1200);
    this.say(on ? "live: watching this mod's media/lua, media/scripts and workbench/ — save a file to reload it into the engine" : "");
  },
  async pollDev() {
    if (S.tool !== "board" || !this.st.live) return;
    const r = await fetch(`/api/wb/${encodeURIComponent(S.mod)}/dev?since=${this.st.devSeq || 0}`).then((x) => x.json()).catch(() => null);
    if (!r || !arr(r.events).length) return;
    this.st.devSeq = r.seq;
    for (const ev of r.events) {
      const res = ev.result || {};
      const bad = arr(res.lua).filter((m) => !m.ok);
      const parts = [];
      if (arr(res.lua).length) parts.push(`${res.lua.length} module(s)`);
      if (res.scripts) parts.push(`scripts ${arr(res.scripts.types).join("/")} ${res.scripts.ms != null ? Math.round(res.scripts.ms) + "ms" : ""}${res.scripts.hadErrors ? " ✗ load errors" : ""}`);
      if (arr(ev.tools).length) parts.push("addons");
      if (arr(ev.needsRestart).length) parts.push(`${ev.needsRestart.join("/")} scripts changed: restart VM to pick them up (they don't hot-reload safely)`);
      const what = `⟳ ${arr(ev.files).slice(0, 3).join(", ")}${arr(ev.files).length > 3 ? " +" + (ev.files.length - 3) : ""}: ${parts.join(" · ") || ev.skipped || ev.error || "no reload needed"}`;
      if (bad.length || ev.error || (res.scripts && (res.scripts.err || res.scripts.hadErrors))) {
        this.say(`${what} · ✗ ${bad.map((m) => m.module + ": " + m.err).join(" | ") || ev.error || res.scripts.err || "script load errors (see the dashboard log)"}`);
        continue;
      }
      this.say(what + (this.board().cards.length ? " · re-running the board…" : ""), true);
      if (this.board().cards.length) await this.replay(true);
      this.say(what + " · ✓ board re-ran");
    }
  },

  // ── the world clock (65_clock.lua) ──
  async clockRefresh() {
    const st = await call("clockStatus").catch(() => null);
    const el = $("#bclk");
    if (el) el.textContent = st ? `day ${st.day} ${st.clock}` : "n/a";
    if (st && el) el.parentNode.title = el.parentNode.title.split("\n")[0] + `\nlisteners: ${Object.entries(st.listeners || {}).map(([k, v]) => k + " " + v).join(", ")}`;
    return st;
  },
  async advanceClock(minutes) {
    const b = this.board();
    const live = b.cards.filter((c) => c.kind === "item" && c.ref && !c.consumed && !c.stale);
    this.say(`advancing ${minutes >= 1440 ? minutes / 1440 + " day(s)" : minutes >= 60 ? minutes / 60 + " hour(s)" : minutes + " min"}…`, true);
    let r;
    try { r = await call("clockAdvance", { minutes, refs: live.map((c) => c.ref) }); }
    catch (e) { this.say("clock: " + e.message); return; }
    // Live items: re-read every card's snapshot; mark the ones that moved.
    for (const c of live) {
      const before = JSON.stringify(c.snap && c.snap.badges);
      const snap = await call("addonPanels", { ref: c.ref }).catch(() => null);
      if (snap) { c.snap = snap; c.timeMoved = JSON.stringify(snap.badges) !== before; }
    }
    for (const c of b.cards.filter((c) => c.kind === "world")) await this.refreshWorld(c);
    const fired = Object.entries(r.fired || {}).map(([k, v]) => `${k.replace("Every", "")}×${v}`).join(" ");
    const moved = live.filter((c) => c.timeMoved).length;
    this.say(`⏱ day ${r.day} ${r.clock} · ${fired || "no events"} · ${r.aged} item(s) aged${moved ? `, ${moved} changed` : ""}${arr(r.errors).length ? ` · ✗ ${r.errors.length} listener error(s): ${r.errors[0]}` : ""}${arr(r.itemErrors).length ? ` · ✗ aging: ${r.itemErrors[0]}` : ""}`, false);
    const el = $("#bclk"); if (el) el.textContent = `day ${r.day} ${r.clock}`;
    this.save(); this.draw();
    if (b.sel) this.inspect();
  },

  // ── the item's real tooltip (66_tooltip.lua) ──
  // TooltipLib's own providers run against this live item through its
  // recording context; the display list is drawn here in PZ's tooltip style.
  async itemTooltip(c) {
    const host = $("#itip");
    if (!host || !c.ref || c.consumed) return;
    const detail = !!this.st.tipDetail;
    const r = await call("itemTooltip", { ref: c.ref, detail }).catch((e) => ({ error: e.message }));
    if (!$("#itip") || this.board().sel !== c.id) return;
    if (r.error) { $("#itip").innerHTML = `<div class="fail" style="font-size:11.5px">tooltip: ${esc(r.error)}</div>`; return; }
    if (r.unavailable) { $("#itip").innerHTML = `<div class="dim" style="font-size:11.5px">${esc(r.unavailable)}</div>`; return; }
    const col = (x, d) => { if (!x || typeof x !== "object") return d; const v = Array.isArray(x) ? x : [x.r, x.g, x.b, x.a ?? 1]; return v[0] == null ? d : `rgba(${Math.round(v[0] * 255)},${Math.round(v[1] * 255)},${Math.round(v[2] * 255)},${v[3] ?? 1})`; };
    const txt = (v) => esc(v == null ? "" : typeof v === "number" ? String(Math.round(v * 100) / 100) : String(v));
    let accent = null;
    const lineHtml = (l) => {
      const [op, a, b, c2, d] = l;
      switch (op) {
        case "setAccentColor": accent = col(a, null); return "";
        case "addLabel": return `<div style="color:${col(b, "#e6e6e6")}">${txt(a)}</div>`;
        case "addText": return `<div style="color:${col(b, "#e6e6e6")};white-space:pre-wrap">${txt(a)}</div>`;
        case "addHeader": case "beginSection": return `<div class="hd" style="color:${col(b, "#ffffcc")}">${txt(a)}</div>`;
        case "addDivider": return `<div class="dv" style="border-color:${col(a, "#555")}"></div>`;
        case "addSpacer": return `<div style="height:6px"></div>`;
        case "addKeyValue": {
          if (a && typeof a === "object" && !Array.isArray(a)) return `<div class="kv"><span style="color:${col(a.keyColor, "#e6e6e6")}">${txt(a.key)}</span><span class="v" style="color:${col(a.valueColor || a.valColor, "#e6e6e6")}">${txt(a.value)}</span></div>`;
          return `<div class="kv"><span style="color:${col(c2, "#e6e6e6")}">${txt(a)}</span><span class="v" style="color:${col(d, "#e6e6e6")}">${txt(b)}</span></div>`;
        }
        case "addInteger": case "addFloat": case "addPercentage": {
          const v = op === "addPercentage" ? (b * 100).toFixed(c2 ?? 0) + "%" : op === "addFloat" ? Number(b).toFixed(c2 ?? 2) : b;
          const good = (op === "addFloat" || op === "addPercentage" ? d : c2);
          const vc = good == null ? "#e6e6e6" : (b >= 0) === !!good ? "#7fd07f" : "#e07070";
          return `<div class="kv"><span>${txt(a)}</span><span class="v" style="color:${vc}">${esc(String(v))}</span></div>`;
        }

      }

    const body = arr(r.providers).map((p) => `${arr(p.lines).map(lineHtml).join("")}${p.error ? `<div style="color:#e07070;font-size:11px">${esc(p.id)}: ${esc(p.error)}</div>` : ""}`).join("");

      <label class="muted" style="font-size:11.5px"><input type="checkbox" id="tipdet" ${detail ? "checked" : ""}> detail key held</label>${r.hiddenDetail && !detail ? ` <span class="dim" style="font-size:11px">· more behind the detail key</span>` : ""}
      <div class="pztip" style="margin-top:4px">${accent ? `<div class="rail" style="background:${accent}"></div>` : ""}<div class="nm">${esc(h.name || "")}</div>
        <div class="kv"><span>Weight</span><span class="v">${h.weight != null ? Number(h.weight).toFixed(2) : "?"}</span></div>
        ${h.conditionMax ? `<div class="row"><span>Condition</span><div class="bar"><i style="width:${(h.condition / h.conditionMax) * 100}%;background:#5fbf5f"></i></div></div>` : ""}
        ${body}
        <div class="pv">${arr(r.providers).map((p) => esc(p.id)).join(" · ")}</div></div>
      ${arr(r.loadErrors).length ? `<details><summary class="dim" style="font-size:11px">${r.loadErrors.length} load note(s)</summary><pre class="box">${esc(r.loadErrors.join("\n"))}</pre></details>` : ""}`;
    $("#tipdet").onchange = (e) => { this.st.tipDetail = e.target.checked; this.itemTooltip(c); };
  },

  // ── console dock ──
  dock() {

    return `<div class="bdock" id="bdock"><div class="dh" id="dockh">›_ <b>console</b><span class="dim">resident VM · <span class="mono">$N</span> = a live object · Ctrl+Enter runs · object results can become cards</span><span style="flex:1"></span>${open ? "▾" : "▴"}</div>
      ${open ? `<div class="dbody"><div><textarea class="inp mono" id="dsrc" placeholder='return PZEngine.instanceItem("Base.Axe")'></textarea>

  },
  bindDock() {
    const st = this.st;
    st.dlog = st.dlog || [];

  async runConsole() {
    const src = $("#dsrc").value;
    if (!src.trim()) return;
    const entry = { src, pending: true };
    this.st.dlog.unshift(entry);
    this.renderDock();
    try { const r = await call("eval", { src }); Object.assign(entry, { values: arr(r.values), out: arr(r._out), ms: r._ms }); }
    catch (e) { Object.assign(entry, { error: e.message, out: arr(e.out) }); }
    entry.pending = false;

  },
  renderDock() {
    const el = $("#dout");

      ${e.pending ? `<span class="spin"></span>` : ""}${arr(e.out).length ? `<pre class="muted">${esc(e.out.join("\n"))}</pre>` : ""}${e.error ? `<pre class="fail">${esc(e.error)}</pre>` : ""}
      ${arr(e.values).map((x, k) => `<div>${val(x)}${x && (x.$java || x.$table) ? ` <button class="btn small" data-tocard="${i}:${k}" title="put it on the board">◎ card</button>${x.$java && /inventory/i.test(x.class || "") ? ` <button class="btn small" data-toitem="${i}:${k}" title="as a live item card">◇ item card</button>` : ""}` : ""}</div>`).join("")}</div>`).join("");
    for (const b of $$("[data-tocard]", el)) b.onclick = () => { const [i, k] = b.dataset.tocard.split(":").map(Number); const e = this.st.dlog[i]; this.exploreRef(e.values[k].ref, e.src.split("\n")[0].slice(0, 40)); };
    for (const b of $$("[data-toitem]", el)) b.onclick = async () => {
